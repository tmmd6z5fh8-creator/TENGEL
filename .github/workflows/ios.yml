# テンゲル iOSアプリの確認：ios ブランチに push すると、GitHubのMacでアプリを作ってシミュレーターで動かす
# 結果（ログ・スクショ・report）は ios-ci-<ランナー> ブランチに置く（毎回上書き）
name: iOS app check
on:
  push:
    branches: [ios]
permissions:
  contents: write
concurrency:
  group: ios-check
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]     # 第4.226版：コードを 非公開の 倉庫に 引っ越す ので Mac は 1台（非公開の 倉庫の Mac は 無料の 分が 小さい：前は macos-15 と 2台）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110     # 第4.226版：無料の 分を 守る ため 150 → 110（いつもは 50〜70分）。第4.218版：run 189 の macOS 26 が Mac の 遅さで 90分に 届いて 止まった（結果も 送れなかった）ので 150 に。第4.156版：iPad の 広い 窓の 確かめ（もう 1回 作る）の 分 のばした（前は 50）。第4.180版：run 146 の macOS 26 が Mac の 混み合いで 70分を こえた ので 90 に
    steps:
      - uses: actions/checkout@v4
      - name: Build and run in Simulator
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: bash ci/run.sh
      - name: Push results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ matrix.os }}
        run: |
          mkdir -p results && cd results
          echo "run ${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT} sha ${GITHUB_SHA} ${LABEL}" > RUN.txt
          git init -q
          git config user.name "tengel-ci"
          git config user.email "tengel-ci@users.noreply.github.com"
          git checkout -q -b "ios-ci-${LABEL}"
          git add -A
          git commit -q -m "iOS check run ${GITHUB_RUN_NUMBER} on ${LABEL}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ios-ci-${LABEL}"
