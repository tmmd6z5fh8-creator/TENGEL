<title>テンゲルⅢ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: アプリ型シェル — 夜の開催を思わせる紺の帯ヘッダー＋本文。スマホは1カラム＋下タブ、PCは「入力｜判定」の2ペイン */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#141A2E; --muted:#5A6175; --line:#D7DBE4;
  --night:#16203D; --night-ink:#F3F0E6; --lamp:#E2A23B;
  --primary:#1B2A55; --primary-ink:#FFFFFF; --focus:#E2A23B;
  --A:#2C67A8; --A-bg:#E3EDF8; --B:#A86F00; --B-bg:#FBF0D6; --C:#B8264F; --C-bg:#FBE3EA;
  --ok:#17784A; --ok-bg:#DDF2E6; --warn:#A14E06; --warn-bg:#FCEBD9; --bad:#A8231B; --bad-bg:#F9E0DE;
  --heat:#1B2A55;
  --w1:#FFFFFF; --w1i:#151515; --w2:#1A1A1A; --w2i:#FFFFFF; --w3:#D3232D; --w3i:#FFFFFF; --w4:#1E5BBE; --w4i:#FFFFFF;
  --w5:#F3CF1E; --w5i:#151515; --w6:#1D8A3B; --w6i:#FFFFFF; --w7:#F07E19; --w7i:#151515; --w8:#F38DB6; --w8i:#151515;
  --font-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --font-body:'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:10px; --gap:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1121; --surface:#141B31; --surface-2:#1A2340; --ink:#ECEEF5; --muted:#9BA3BB; --line:#2A3457;
  --night:#090E1C; --night-ink:#F3F0E6; --lamp:#F0B54E;
  --primary:#F0B54E; --primary-ink:#1C1300; --focus:#F0B54E;
  --A:#7DB1EC; --A-bg:#16294A; --B:#F2BE55; --B-bg:#3A2C0D; --C:#F27399; --C-bg:#40162A;
  --ok:#5FD39A; --ok-bg:#123726; --warn:#F3A45B; --warn-bg:#3D2410; --bad:#F2867D; --bad-bg:#401A17;
  --heat:#F0B54E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1121; --surface:#141B31; --surface-2:#1A2340; --ink:#ECEEF5; --muted:#9BA3BB; --line:#2A3457;
  --night:#090E1C; --night-ink:#F3F0E6; --lamp:#F0B54E;
  --primary:#F0B54E; --primary-ink:#1C1300; --focus:#F0B54E;
  --A:#7DB1EC; --A-bg:#16294A; --B:#F2BE55; --B-bg:#3A2C0D; --C:#F27399; --C-bg:#40162A;
  --ok:#5FD39A; --ok-bg:#123726; --warn:#F3A45B; --warn-bg:#3D2410; --bad:#F2867D; --bad-bg:#401A17;
  --heat:#F0B54E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);color:var(--night-ink);border-bottom:3px solid var(--lamp)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.04em;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--lamp)}
.brand .ver{font-size:12px;opacity:.75;letter-spacing:.06em}
.dbpill{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid rgba(243,240,230,.3);white-space:nowrap}
.dbpill.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5FD39A;margin-right:6px;vertical-align:1px}
.tabs-top{display:none;gap:4px}
.tabs-top button,.tabbar button{border:0;background:none;cursor:pointer}
.tabs-top button{color:var(--night-ink);opacity:.7;padding:6px 14px;border-radius:8px;font-weight:700}
.tabs-top button[aria-selected="true"]{opacity:1;background:rgba(243,240,230,.12);box-shadow:inset 0 -2px 0 var(--lamp)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{color:var(--primary)}
@media (min-width:900px){.tabs-top{display:flex}.tabbar{display:none}}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 96px}
@media (min-width:900px){main{padding-block:22px 48px}}
.view[hidden]{display:none}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:var(--gap)}
.card h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 12px;font-weight:700}
.card h3{font-size:15px;margin:0 0 8px}
.judge-grid{display:grid;gap:var(--gap)}
@media (min-width:900px){.judge-grid{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}.result-col{position:sticky;top:84px}}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.lab{font-size:12px;color:var(--muted);font-weight:700}
.f.s2{grid-column:span 2}.f.s3{grid-column:span 3}.f.s4{grid-column:span 4}.f.s6{grid-column:span 6}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}
input[type=number]{appearance:textfield;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{font-size:14px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{flex:1;border:0;background:none;padding:8px 4px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}

.w3{background:var(--w3);color:var(--w3i)}.w4{background:var(--w4);color:var(--w4i)}.w5{background:var(--w5);color:var(--w5i)}
.w6{background:var(--w6);color:var(--w6i)}.w7{background:var(--w7);color:var(--w7i)}.w8{background:var(--w8);color:var(--w8i)}

.LA{background:var(--A-bg);color:var(--A)}.LB{background:var(--B-bg);color:var(--B)}.LC{background:var(--C-bg);color:var(--C)}

.vfoot{margin-top:14px;display:flex;flex-direction:column;gap:8px}

.numbers{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:14px;font-size:13px}

details.full{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.full summary{cursor:pointer;font-weight:700;font-size:14px}
pre.out{white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);font-size:12.5px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0 0;max-height:none;overflow-x:auto}

/* ledger */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* stats */
.stat-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.tile .l{font-size:12px;color:var(--muted);font-weight:700}
.tile .d{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}

.stat-grid{display:grid;gap:var(--gap);margin-top:var(--gap)}
@media (min-width:900px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-grid .wide{grid-column:1/-1}}
.stat-grid .card+.card{margin-top:0}
.stat-grid>*,.judge-grid>*{min-width:0}
.ledit .fields{max-width:760px}
.minibar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:25;padding-inline:12px;display:flex;justify-content:center;pointer-events:none}
.minibar button{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;border:0;cursor:pointer;background:var(--night);color:var(--night-ink);border-radius:999px;padding:7px 8px 7px 7px;box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:13px;text-align:left}
.minibar .lb{flex:none}
.minibar .mz{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar .go{flex:none;font-weight:700;color:var(--lamp);padding-right:6px}
@media (min-width:900px){.minibar{display:none}}
.heat td.c{text-align:center;font-family:var(--font-mono);min-width:3em}
.heat td.c.on{outline:2px solid var(--primary);outline-offset:-3px;font-weight:700}
.prog{display:flex;flex-direction:column;gap:12px}
.pi .pl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.pi .pl b{font-family:var(--font-mono)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:var(--night-ink);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}

@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}.f.s3{grid-column:span 2}.f.s4{grid-column:span 4}.f.s6{grid-column:span 4}.f.s2m4{grid-column:span 4}}

/* v2: 購入記録・月ごとの収支 */

.tile .v.plus,.plus{color:var(--ok)}

.stc.hit{background:var(--ok-bg);color:var(--ok)}
.stc.miss{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>テンゲル<em>Ⅲ</em></h1><span class="ver">大井 第13改訂版</span></div>
    <nav class="tabs-top" role="tablist" aria-label="画面">
      <button role="tab" data-tab="judge" aria-selected="true">判定</button>
      <button role="tab" data-tab="rec" aria-selected="false">記録</button>
      <button role="tab" data-tab="stats" aria-selected="false">実測・回収</button>
    </nav>
    <span class="dbpill" id="dbpill">データに接続中…</span>
  </div>
</header>

<main>
<!-- ===== 判定 ===== -->
<section class="view" id="v-judge">
  <div class="judge-grid">
    <div class="input-col">
      <div class="card">
        <h2>レース情報</h2>
        <div class="row" id="ocrRow" hidden>
          <button class="btn primary" id="ocrBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>オッズ画像から読み取る</button>
          <input type="file" id="ocrFile" accept="image/*" multiple hidden>
          <span class="small muted" id="ocrHint">単勝・複勝と3連単人気順のスクショを1〜3枚</span>
        </div>
        <div id="ocrMsg"></div>
        <div class="fields" style="margin-top:12px">
          <div class="f s3"><label for="fVenue">開催場</label><input id="fVenue" list="venues" value="大井" autocomplete="off"></div>
          <div class="f s3"><label for="fDate">日付</label><input type="date" id="fDate"></div>
          <div class="f s2"><label for="fR">レース</label><select id="fR"></select></div>
          <div class="f s2"><label for="fDist">距離(m)</label><input type="number" id="fDist" inputmode="numeric" placeholder="1200"></div>
          <div class="f s2"><label for="fN">出走頭数</label><input type="number" id="fN" inputmode="numeric" placeholder="12"></div>
          <div class="f s2"><span class="lab">コース</span><div class="seg" id="fSurf"><button type="button" data-v="ダ" aria-pressed="true">ダ</button><button type="button" data-v="芝" aria-pressed="false">芝</button></div></div>
          <div class="f s4"><span class="lab">馬場状態</span><div class="seg" id="fBaba"><button type="button" data-v="良" aria-pressed="false">良</button><button type="button" data-v="稍重" aria-pressed="false">稍重</button><button type="button" data-v="重" aria-pressed="false">重</button><button type="button" data-v="不良" aria-pressed="false">不良</button></div></div>
        </div>
        <datalist id="venues"></datalist>
      </div>

      <div class="card">
        <h2>単勝・複勝オッズ（馬番ごと）</h2>
        <div class="oheads" aria-hidden="true"><div class="ohead"><span>馬</span><span>単勝</span><span>複勝（幅は 1.2-1.5）</span></div><div class="ohead two"><span>馬</span><span>単勝</span><span>複勝</span></div></div>
        <div class="odds" id="oddsGrid"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost" type="button" id="addRow">＋馬番を1つ増やす</button>
          <span class="small muted">取消・除外の馬は単勝を空欄のまま</span>
        </div>
        <div class="fields" id="tan1Wrap" style="margin-top:12px">
          <div class="f s3"><label for="fTan1">単勝1位オッズ（一覧が無いとき）</label><input type="number" id="fTan1" inputmode="decimal" step="0.1" placeholder="2.1"></div>
        </div>
      </div>

      <div class="card">
        <h2>3連単（人気順）</h2>
        <div class="fields">
          <div class="f s3"><label for="fS1">1位オッズ</label><input type="number" id="fS1" inputmode="decimal" step="0.1" placeholder="28.6"></div>
          <div class="f s3"><label for="fS1c">1位の組番（任意）</label><input id="fS1c" inputmode="numeric" placeholder="3-1-5"></div>
          <div class="f s3"><label for="fS5">5位オッズ（記録用）</label><input type="number" id="fS5" inputmode="decimal" step="0.1"></div>
          <div class="f s3"><label for="fS5c">5位の組番</label><input id="fS5c" inputmode="numeric"></div>
          <div class="f s3"><label for="fS10">10位オッズ（記録用）</label><input type="number" id="fS10" inputmode="decimal" step="0.1"></div>
          <div class="f s3"><label for="fS10c">10位の組番</label><input id="fS10c" inputmode="numeric"></div>
        </div>
        <div class="row end" style="margin-top:14px">
          <button class="btn ghost" type="button" id="clearBtn">入力をクリア</button>
          <button class="btn" type="button" id="sampleBtn">入力例を入れる</button>
        </div>
      </div>
    </div>

    <div class="result-col">
      <div class="card" id="result" aria-live="polite"></div>
      <div class="card" id="recCard"></div>
    </div>
  </div>
</section>

<!-- ===== 記録（買ったレース） ===== -->
<section class="view" id="v-rec" hidden>
  <div class="card">
    <div class="ym" id="ymRec"></div>
    <div class="filters" id="rFilters">
      <button class="fchip" data-f="all" aria-pressed="true">すべて</button>
      <button class="fchip" data-f="wait" aria-pressed="false">結果待ち</button>
      <button class="fchip" data-f="hit" aria-pressed="false">的中</button>
      <button class="fchip" data-f="miss" aria-pressed="false">不的中</button>
      <button class="fchip" data-f="other" aria-pressed="false">未購入・払い戻し</button>
    </div>
    <p class="hint" id="recSummary"></p>

<script>
/* ===== テンゲルⅢ 判定エンジン（第13改訂版） ===== */
const T = (() => {
  const VERSION = '第13改訂版';
  const ZN = ['人気', '中穴', '大穴', '超大穴'];
  const SYM = 'ABCDEFGHIJKL';
  const P = { // 期間の区分
    kohan: '2026-08-31', shinki: '2026-10-04', dai13: '2026-10-08'
  };

  const round1 = x => Math.round(x * 10 + 1e-7) / 10;
  const ratio = (tan1, s1) => (tan1 > 0 && s1 > 0) ? round1(s1 / tan1) : null;
  const zoneOf = rank => {
    if (!rank || rank < 1) return null;
    if (rank <= 3) return '人気';
    if (rank <= 6) return '中穴';
    if (rank <= 9) return '大穴';
    if (rank <= 12) return '超大穴';
    return '対象外';
  };
  const period = d => !d ? '' : d < P.kohan ? '前半' : d < P.shinki ? '後半' : d < P.dai13 ? '新規' : '第13新規';

  // ゾーン定義
  const Z = (a, b, label, opt = {}) => ({ a, b, label: label || (a + '→' + b.join('／')), ...opt });
  const SETS = {
    A: [Z('人気', ['人気']), Z('人気', ['中穴'])],
    B: [Z('中穴', ['人気']), Z('人気', ['大穴'])],
    C0: [Z('人気', ['人気']), Z('人気', ['中穴'])],
    C1: [Z('人気', ['大穴']), Z('中穴', ['中穴'], null, { prov: true }), Z('大穴', ['人気'])],
    C2: [Z('人気', ['大穴', '超大穴']), Z('中穴', ['大穴', '超大穴']), Z('大穴', ['人気'])]
  };
  const THIRD = {
    A: [['人気', '中穴'], ['人気', '中穴']],
    B: [['人気', '大穴'], ['人気', '大穴']],
    C0: null,
    C1: [['人気', '中穴'], ['人気', '大穴'], ['人気', '中穴']],
    C2: [['人気', '中穴'], ['人気', '超大穴'], ['人気', '中穴']]
  };
  const THIRD_PROV = { A: [false, false], B: [true, true], C1: [false, true, false], C2: [false, true, false] };
  const OLD = {
    '非該当': [Z('人気', ['人気']), Z('人気', ['中穴'])],
    '第1段階': SETS.C1,
    '第2段階': SETS.C2
  };
  const KUBUN_LABEL = { A: 'A層（固定）', B: 'B層（固定）', C0: 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' };
  const LAYER_LABEL = { A: 'A層（堅）', B: 'B層（警戒）', C: 'C層（穴）' };

  function gateRaw(hi, n) {
    if (hi == null || !n) return '非該当';
    if (hi >= 10 && n >= 14) return '第2段階';
    if (hi >= 10 && n >= 9) return '第1段階';
    return '非該当';
  }
  function layerOf(baba, tan1, s1) {
    const hi = ratio(tan1, s1);
    if (baba === '重') return { L: 'A', cond: 1, hi };
    if (s1 >= 62.4) return { L: 'C', cond: 2, hi };
    if (tan1 >= 2.5 && hi >= 16) return { L: 'C', cond: 3, hi };
    if (hi >= 12) return { L: 'B', cond: 4, hi };
    return { L: 'A', cond: 5, hi };
  }
  // 第13の区分
  function classify(x) {
    const { L, cond, hi } = layerOf(x.baba, x.tan1, x.s1);
    const g = gateRaw(hi, x.n);
    let kubun, early = false, honrai = null, c0reason = null;
    if (L === 'A') kubun = 'A';
    else if (L === 'B') kubun = 'B';
    else if (x.r <= 3) { kubun = 'C0'; early = true; honrai = g; c0reason = '序盤R'; }
    else { kubun = g === '第2段階' ? 'C2' : g === '第1段階' ? 'C1' : 'C0'; if (kubun === 'C0') c0reason = 'ゲート条件未達'; }
    // 第12の帯（旧本線）
    let band12;
    if (x.r <= 3) band12 = '非該当';
    else if (L === 'A' && x.baba !== '重') band12 = '非該当';
    else band12 = g;
    const c20 = L === 'C' ? (hi >= 20 ? '比20以上' : '比20未満') : '';
    return { L, cond, hi, gate: g, kubun, early, honrai, c0reason, band12, c20 };
  }
  function zoneHit(set, z1, z2) {
    if (!z1 || !z2) return 0;
    for (let i = 0; i < set.length; i++) if (set[i].a === z1 && set[i].b.includes(z2)) return i + 1;
    return 0;
  }
  // 頭数ごとのゾーン頭数・通り数
  const zsize = (z, n) => {
    const i = ZN.indexOf(z); if (i < 0) return 0;
    return Math.max(0, Math.min(3, n - i * 3));
  };
  const combos = (zone, n) => zone.b.reduce((s, b) => {
    const sa = zsize(zone.a, n), sb = zsize(b, n);
    return s + (zone.a === b ? sa * Math.max(0, sa - 1) : sa * sb);
  }, 0);

  // レコード → 派生値
  function derive(rec) {
    const c = classify(rec);
    const z1 = zoneOf(rec.p1), z2 = zoneOf(rec.p2), z3 = zoneOf(rec.p3);
    const has12 = !!(z1 && z2);
    const set = SETS[c.kubun];
    const hit = has12 ? zoneHit(set, z1, z2) : 0;
    const third = THIRD[c.kubun];
    const has3 = has12 && !!z3;
    const hit3 = (hit && third && has3) ? third[hit - 1].includes(z3) : null;
    const tri = !!hit3;
    const oset = OLD[c.band12];
    const hit12 = has12 ? zoneHit(oset, z1, z2) : 0;
    const ana = has12 && ([z1, z2].includes('大穴') || [z1, z2].includes('超大穴'));
    const nn = z1 === '人気' && z2 === '人気';
    const anaZone = z => z.a === '大穴' || z.a === '超大穴' || z.b.includes('大穴') || z.b.includes('超大穴');
    const pay = num(rec.umatanPay);
    const inv13 = set.reduce((s, z) => s + combos(z, rec.n), 0) * 100;
    const inv12 = oset.reduce((s, z) => s + combos(z, rec.n), 0) * 100;
    const isOi = (rec.venue || '大井') === '大井';
    return {
      ...rec, ...c, z1, z2, z3, has12, has3, hit, hit3, tri, hit12,
      ana, nn, pair: has12 ? z1 + '→' + z2 : '',
      ninkiIn12: (z1 === '人気' ? 1 : 0) + (z2 === '人気' ? 1 : 0),
      anaHit13: hit ? anaZone(set[hit - 1]) : false,
      anaHit12: hit12 ? anaZone(oset[hit12 - 1]) : false,
      sup1: z1 === '超大穴',
      per: period(rec.date), isOi,
      inStats: isOi && Number(rec.cnt ?? 1) === 1 && has12,
      pay, inv13, inv12,
      ret13: pay != null && hit ? pay : 0,
      ret12: pay != null && hit12 ? pay : 0
    };
  }
  function num(v) { if (v === '' || v == null) return null; const n = Number(v); return isFinite(n) ? n : null; }

  // ===== 集計 =====
  function stats(list, excludeId) {
    const rs = list.filter(r => r.inStats && r.id !== excludeId);
    const S = { n: rs.length, k: {}, layer: {}, band12: {}, early: { n: 0, nn: 0, nc: 0 }, c20: {}, ninki: {} };
    for (const k of ['A', 'B', 'C0', 'C1', 'C2']) S.k[k] = { n: 0, hit: [0, 0, 0], hitTot: 0, nn: 0, ana: 0, n3: 0, t: { 人気: 0, 中穴: 0, 大穴: 0, 超大穴: 0, 対象外: 0 }, hit3n: [0, 0, 0], tri3: [0, 0, 0], triTot: 0, hitIn3: 0, sub: [{ 大穴: 0, 超大穴: 0 }, { 大穴: 0, 超大穴: 0 }, { 大穴: 0, 超大穴: 0 }] };
    for (const L of ['A', 'B', 'C']) S.layer[L] = { n: 0, ana: 0, nn: 0 };
    for (const b of ['非該当', '第1段階', '第2段階']) S.band12[b] = { n: 0, hit: [0, 0, 0], sub: [{ 大穴: 0, 超大穴: 0 }, { 大穴: 0, 超大穴: 0 }, { 大穴: 0, 超大穴: 0 }] };
    for (const c of ['比20以上', '比20未満']) S.c20[c] = { n: 0, ana: 0, sup1: 0, nnnc: 0, hit: 0 };
    for (const i of [0, 1, 2]) S.ninki[i] = { n: 0, 人気: 0, 中穴: 0, 大穴: 0, 超大穴: 0, 対象外: 0 };
    for (const r of rs) {
      const K = S.k[r.kubun];
      K.n++; if (r.hit) { K.hit[r.hit - 1]++; K.hitTot++; if (r.z2 === '大穴' || r.z2 === '超大穴') K.sub[r.hit - 1][r.z2]++; }
      if (r.nn) K.nn++; if (r.ana) K.ana++;
      if (r.has3) {
        K.n3++; K.t[r.z3]++;
        if (r.hit) { K.hitIn3++; K.hit3n[r.hit - 1]++; if (r.tri) { K.tri3[r.hit - 1]++; K.triTot++; } }
        S.ninki[r.ninkiIn12][r.z3]++; S.ninki[r.ninkiIn12].n++;
      }
      const Ly = S.layer[r.L]; Ly.n++; if (r.ana) Ly.ana++; if (r.nn) Ly.nn++;
      const B = S.band12[r.band12]; B.n++;
      const bset = r.band12 === '非該当' ? OLD['非該当'] : OLD[r.band12];
      const bh = zoneHit(bset, r.z1, r.z2);
      if (bh) { B.hit[bh - 1]++; if (r.z2 === '大穴' || r.z2 === '超大穴') B.sub[bh - 1][r.z2]++; }
      if (r.r <= 3) { S.early.n++; if (r.nn) S.early.nn++; if (r.pair === '人気→中穴') S.early.nc++; }
      if (r.L === 'C' && (r.kubun === 'C1' || r.kubun === 'C2')) {
        const C = S.c20[r.c20]; C.n++; if (r.ana) C.ana++; if (r.sup1) C.sup1++; if (r.pair === '人気→人気' || r.pair === '人気→中穴') C.nnnc++; if (r.hit) C.hit++;
      }
    }
    return S;
  }

  const pct = (a, b, d = 1) => b ? (a / b * 100).toFixed(d) + '%' : '—';
  function hantei(K) {
    if (!K || K.n < 5) return { mark: '・【並】', note: '※データ不足', cls: 'nami' };
    const r = K.nn / K.n;
    if (r >= 0.55) return { mark: '⚠️【薄】', note: '回収率が薄い可能性が高い', cls: 'usu' };
    if (r < 0.30) return { mark: '◎【厚】', note: '配当妙味あり', cls: 'atsu' };
    return { mark: '・【並】', note: '標準', cls: 'nami' };
  }

  // ===== 当日判定 =====
  // input: {venue,date,r,dist,surface,baba,n,horses:[{no,tan,fuku}],tan1,s1,s5,s10, s1combo}
  function judge(inp, S, opt = {}) {
    const out = { ok: false, missing: [] };
    const horses = (inp.horses || []).filter(h => h && h.no && h.tan > 0)
      .map(h => ({ no: +h.no, tan: +h.tan, fuku: fukuLow(h.fuku), fukuRaw: h.fuku || '', fukuRange: /[-〜~]/.test(String(h.fuku || '')) }))
      .sort((a, b) => a.tan - b.tan || a.no - b.no);
    horses.forEach((h, i) => { h.rank = i + 1; h.sym = i < 12 ? SYM[i] : 'M'; h.zone = zoneOf(i + 1); });
    const tan1 = horses.length ? horses[0].tan : num(inp.tan1);
    const x = { r: num(inp.r), dist: num(inp.dist), baba: inp.baba || '', n: num(inp.n), tan1, s1: num(inp.s1) };
    if (!x.r) out.missing.push('レース番号');
    if (!x.dist) out.missing.push('距離');
    if (!x.baba) out.missing.push('馬場状態');
    if (!x.n) out.missing.push('出走頭数');
    if (!x.tan1) out.missing.push('単勝1位オッズ');
    if (!x.s1) out.missing.push('3連単1位オッズ');
    if (out.missing.length) return out;
    out.ok = true;
    const venue = (inp.venue || '大井').trim() || '大井';
    const isOi = venue === '大井';
    const c = classify(x);
    const s5 = num(inp.s5), s10 = num(inp.s10);
    const hasJL = x.n >= 10;
    const chuui = s5 == null ? '確認不可' : (hasJL && s5 >= 40 ? '該当' : '非該当');
    const oldSkip = (s5 != null && s5 >= 78) || (s10 != null && s10 >= 110) ? '該当' : '非該当';
    const set = SETS[c.kubun], third = THIRD[c.kubun];
    const zoneNums = z => horses.filter(h => h.zone === z).sort(z === '大穴' || z === '超大穴' ? fukuSort : () => 0).map(h => h.no);
    const fukuUsed = z => { const hs = horses.filter(h => h.zone === z); return hs.length && hs.every(h => h.fuku != null); };
    const nums = {}; for (const z of ZN) nums[z] = zoneNums(z);
    const outside = horses.filter(h => h.rank > 12).map(h => h.no);
    function fukuSort(a, b) {
      const all = horses.filter(h => h.zone === a.zone);
      if (all.every(h => h.fuku != null)) return a.fuku - b.fuku || a.no - b.no;
      return 0;
    }
    Object.assign(out, { venue, isOi, x, c, s5, s10, chuui, oldSkip, horses, nums, outside, fukuUsed, set, third, S,
      surface: inp.surface || 'ダ', date: inp.date || '', s1combo: inp.s1combo || '', s5combo: inp.s5combo || '', s10combo: inp.s10combo || '',
      warnN: horses.length && horses.length !== x.n ? `オッズ入力${horses.length}頭／出走頭数${x.n}頭` : '' });
    out.oldSet = OLD[c.band12];
    out.combosN = set.map(z => combos(z, x.n));
    return out;
  }
  function fukuLow(v) {
    if (v == null || v === '') return null;
    const m = String(v).replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).match(/\d+(\.\d+)?/);
    return m ? Number(m[0]) : null;
  }

  return { VERSION, ZN, SETS, THIRD, THIRD_PROV, OLD, KUBUN_LABEL, LAYER_LABEL, round1, ratio, zoneOf, period, classify, derive, stats, judge, hantei, pct, combos, zsize, num, P };
})();
if (typeof module !== 'undefined') module.exports = T;

</script>
<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = v => { if (v == null || v === '') return '—'; const n = +v; if (!isFinite(n)) return String(v); return n % 1 === 0 ? n.toFixed(1) : String(n); };
const hiTxt = h => h == null ? '—' : h.toFixed(1);
const yen = v => v == null ? '—' : Math.round(v).toLocaleString('ja-JP');
const pct = T.pct;
const todayJST = () => { const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); };
const VENUES = { '大井': 'oi', '川崎': 'kawasaki', '船橋': 'funabashi', '浦和': 'urawa', '門別': 'monbetsu', '盛岡': 'morioka', '水沢': 'mizusawa', '金沢': 'kanazawa', '笠松': 'kasamatsu', '名古屋': 'nagoya', '園田': 'sonoda', '姫路': 'himeji', '高知': 'kochi', '佐賀': 'saga', '帯広': 'obihiro', '札幌': 'sapporo', '函館': 'hakodate', '福島': 'fukushima', '新潟': 'niigata', '東京': 'tokyo', '中山': 'nakayama', '中京': 'chukyo', '京都': 'kyoto', '阪神': 'hanshin', '小倉': 'kokura' };
const venueKey = v => VENUES[v] || ('v' + [...v].map(c => c.codePointAt(0).toString(16)).join(''));
const idFor = (date, venue, r) => date.replace(/-/g, '') + '-' + venueKey(venue || '大井') + '-' + String(r).padStart(2, '0');
const storeGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const storeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, ms); }


// ===== state =====
// recs/derived = テンゲル基盤データ（マザーデータ・races）… アプリからは書き換えない
// bets          = 買ったレースの記録（bets）… 実測・回収の「月ごとの収支」だけに使う
const blankForm = () => ({ id: null, venue: '大井', date: todayJST(), r: '', dist: '', surface: 'ダ', baba: '', n: '', rows: [], tan1: '', s1: '', s1combo: '', s5: '', s5combo: '', s10: '', s10combo: '' });
// 入力例（架空のレース）。初めて開いたときと「入力例を入れる」で使う
const exampleForm = () => Object.assign(blankForm(), { example: true, venue: '大井', r: '8', dist: '1400', surface: 'ダ', baba: '稍重', n: '14', s1: '41.3', s1combo: '6-2-10', s5: '58.2', s10: '84.0',
  rows: [[1, 12.4, '3.0-4.6'], [2, 4.1, '1.6-2.2'], [3, 31.5, '6.1-9.8'], [4, 9.8, '2.6-3.9'], [5, 18.2, '4.0-6.2'], [6, 2.4, '1.1-1.3'], [7, 7.6, '2.1-3.1'], [8, 54.0, '9.4-15.0'], [9, 25.9, '5.2-8.1'], [10, 6.3, '1.9-2.7'], [11, 14.7, '3.3-5.1'], [12, 88.6, '13.2-21.1'], [13, 40.2, '7.7-12.2'], [14, 120.5, '18.4-29.6']].map(([no, tan, fuku]) => ({ no, tan: String(tan), fuku })) });
const nowYM = () => { const t = todayJST(); return { y: +t.slice(0, 4), m: +t.slice(5, 7) }; };
const st = {
  tab: 'judge', recs: new Map(), derived: [], bets: new Map(), db: null, canWrite: true, sample: null, sampleImgs: null, downloads: null,
  dbState: 'connecting', betState: 'connecting', form: Object.assign(blankForm(), storeGet('tengel.form') || exampleForm()),
  ym: nowYM(), rf: 'all', open: null, per: '全期間', pairK: 'all', confirmDel: null, draft: null
};
if (!Array.isArray(st.form.rows)) st.form.rows = [];

// ===== tabs =====
function setTab(t) {
  if (!['judge', 'rec', 'stats'].includes(t)) t = 'judge';
  st.tab = t;
  $$('[role=tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  $('#v-judge').hidden = t !== 'judge'; $('#v-rec').hidden = t !== 'rec'; $('#v-stats').hidden = t !== 'stats';
  if (t === 'rec') renderRec(); if (t === 'stats') renderStats();
  storeSet('tengel.tab', t); window.scrollTo(0, 0);

function applyOCR(d) {
  const f = st.form, got = [], miss = [];
  const N = v => { const n = parseFloat(z2h(v)); return isFinite(n) ? n : null; };
  const put = (k, v, lab) => { if (v != null && v !== '') { f[k] = String(v); got.push(lab); } else miss.push(lab); };
  if (d.venue) { f.venue = String(d.venue).replace(/競馬場?$/, ''); got.push('開催場'); }

  put('r', N(d.r), 'R'); put('dist', N(d.dist), '距離'); put('n', N(d.n), '頭数');
  if (d.surface === '芝' || d.surface === 'ダ') f.surface = d.surface;
  if (['良', '稍重', '重', '不良'].includes(d.baba)) { f.baba = d.baba; got.push('馬場'); } else miss.push('馬場');
  const hs = Array.isArray(d.horses) ? d.horses.filter(h => h && N(h.no) && N(h.tan)) : [];
  if (hs.length) { f.rows = hs.map(h => ({ no: N(h.no), tan: String(N(h.tan)), fuku: h.fuku == null ? '' : String(h.fuku) })); got.push(`単勝${hs.length}頭`); if (!hs.some(h => h.fuku)) miss.push('複勝'); }
  else miss.push('単勝');
  for (const [k, lab] of [['s1', '3連単1位'], ['s5', '3連単5位'], ['s10', '3連単10位']]) {
    const o = d[k]; const v = o && N(o.odds);
    if (v) { f[k] = String(v); f[k + 'combo'] = o.combo ? String(o.combo) : ''; got.push(lab); } else miss.push(lab);
  }
  f.id = null; f.extra = 0;
  formToUI(); changed();
  $('#ocrMsg').innerHTML = `<div class="banner ${miss.length ? 'warn' : 'info'}">読み取った：${esc(got.join('・') || 'なし')}${miss.length ? `<br>読めなかった：<b>${esc(miss.join('・'))}</b>　→ 手で入れてね` : ''}<br><span class="small">読み間違いがないか、オッズと頭数だけは画面と見比べてね。</span></div>`;
}


// ===== 買ったレースの記録（bets） =====
// 基盤データとは完全に別。ここで計算した数字は「実測・回収」の月ごとの収支にだけ出す
const toNum = v => { if (v === '' || v == null) return null; const n = Number(z2h(v).replace(/[,，円¥\s]/g, '')); return isFinite(n) ? n : null; };
const pad2 = n => String(n).padStart(2, '0');
const splitZ = s => String(s || '').split('／').filter(Boolean);
function snapOf(J) {
  return { ver: T.VERSION, L: J.c.L, kubun: J.c.kubun, hi: J.c.hi, band12: J.c.band12, c20: J.c.c20, isOi: J.isOi,
    zones: J.set.map(z => ({ a: z.a, b: z.b.join('／'), label: z.label })), third: J.third ? J.third.map(t => t.join('・')) : null };
}
function zoneHitOf(b) {
  const z1 = T.zoneOf(b.p1), z2 = T.zoneOf(b.p2); if (!z1 || !z2) return 0;
  const zs = b.snap?.zones || [];
  for (let i = 0; i < zs.length; i++) if (zs[i].a === z1 && splitZ(zs[i].b).includes(z2)) return i + 1;
  return 0;
}
// 的中・不的中はレース結果（着順）から自動判定。その他（未購入・払い戻し）は手で選ぶ
function betStatus(b) {
  const types = b.types && b.types.length ? b.types : ['馬単'];
  if (b.other === '未購入') return { s: '未購入', cls: 'skip', zi: zoneHitOf(b), types };
  if (b.other === '払い戻し') return { s: '払い戻し', cls: 'skip', types };
  const z1 = T.zoneOf(b.p1), z2 = T.zoneOf(b.p2), z3 = T.zoneOf(b.p3);
  if (!z1 || !z2) return { s: '結果待ち', cls: 'wait', types };
  const zi = zoneHitOf(b);
  const third = b.snap?.third;
  const triHit = !!(zi && third && z3 && String(third[zi - 1] || '').split('・').includes(z3));
  const uma = types.includes('馬単') && zi > 0, tri = types.includes('3連単') && triHit;
  if (!uma && !tri && types.includes('3連単') && zi && !z3) return { s: '結果待ち', cls: 'wait', types, need3: true, zi, z1, z2 };
  const hit = uma || tri;
  return { s: hit ? '的中' : '不的中', cls: hit ? 'hit' : 'miss', zi, triHit, uma, tri, z1, z2, z3, types };
}
const stakeOf = b => b.other === '未購入' ? 0 : (toNum(b.stake) || 0);
const payoutOf = b => b.other === '未購入' ? 0 : b.other === '払い戻し' ? (toNum(b.payout) ?? toNum(b.stake) ?? 0) : (toNum(b.payout) || 0);
function betAgg(list) {
  const A = { n: 0, hit: 0, miss: 0, wait: 0, refund: 0, skip: 0, skipHit: 0, stake: 0, pay: 0, noStake: 0 };
  for (const b of list) {
    const s = betStatus(b);
    if (s.s === '未購入') { A.skip++; if (s.zi) A.skipHit++; continue; }
    A.n++; A.stake += stakeOf(b); A.pay += payoutOf(b); if (toNum(b.stake) == null) A.noStake++;
    if (s.s === '的中') A.hit++; else if (s.s === '不的中') A.miss++; else if (s.s === '結果待ち') A.wait++; else A.refund++;

}

function reviewCard(all) {

function motherNote() {
  const all = st.derived, n = all.filter(r => r.inStats).length;
  const ds = all.map(r => r.date).filter(Boolean).sort();

// ===== データ接続 =====
function setPill() {
  const p = $('#dbpill');
  const mN = st.derived.filter(r => r.inStats).length;
  if (st.dbState === 'on') { p.textContent = `基盤 ${mN}走・記録 ${st.bets.size}件${st.canWrite ? '' : '（閲覧のみ）'}`; p.classList.add('on'); }

function inputBusy(sel) { const a = document.activeElement; return !!(a && a.closest && a.closest(sel) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
let rT; function recompute() {
  clearTimeout(rT); rT = setTimeout(() => {
    st.derived = [...st.recs.values()].map(r => T.derive(r));

}

// 1つの購読は最大1000件なので、四半期ごとに分けて購読する（2026年7月〜来四半期）
function quarters() {
  const pad = n => String(n).padStart(2, '0'), now = todayJST(), out = [];
  let ey = +now.slice(0, 4), em = Math.floor((+now.slice(5, 7) - 1) / 3) * 3 + 1 + 6; while (em > 12) { em -= 12; ey++; }
  let y = 2026, m = 7;
  while ((y < ey || (y === ey && m < em)) && out.length < 48) { let ny = y, nm = m + 3; if (nm > 12) { nm -= 12; ny++; } out.push([`${y}-${pad(m)}-01`, `${ny}-${pad(nm)}-01`]); y = ny; m = nm; }
  return out;
}
function subscribeAll(db, name, map, onChange, onReady, onDead) {
  const col = db.collection(name), qs = quarters(), seen = new Map(), firstSeen = new Set();
  const subs = [...qs.map(([s, e]) => [s, col.where('date', '>=', s).where('date', '<', e).limit(1000)]),
    ['old', col.where('date', '<', qs[0][0]).limit(1000)], ['future', col.where('date', '>=', qs[qs.length - 1][1]).limit(1000)]];
  let ready = false;
  const handle = key => snap => {
    const ids = new Set(snap.docs.map(d => d.id));
    for (const id of (seen.get(key) || [])) if (!ids.has(id)) map.delete(id);
    seen.set(key, ids);
    for (const d of snap.docs) { const v = d.data(); if (v) map.set(d.id, { id: d.id, ...v }); }
    firstSeen.add(key);
    if (!ready && firstSeen.size >= subs.length) { ready = true; onReady(); }
    if (ready) onChange();
  };
  const onErr = e => { if (e && (e.code === 'revoked' || e.code === 'not_granted')) onDead(); };
  for (const [key, q] of subs) q.onSnapshot(handle(key), onErr);
  setTimeout(() => { if (!ready) { ready = true; onReady(); onChange(); } }, 10000);
}
async function setupDB() {

  st.db = db;

<script>
// ===== iPhoneアプリ版だけの機能：基盤データの貼り付け更新・記録のバックアップ =====
(function () {
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var z2h = function (s) { return String(s == null ? '' : s).replace(/[０-９．／－]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); };
  var pad = function (n) { return ('0' + n).slice(-2); };
  function toast(m) { var t = $('#toast'); if (!t) return; t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3000); }
  function parseDate(s) {
    s = z2h(s).trim(); var m;
    if (/^\d{5}$/.test(s)) { var d = new Date(Date.UTC(1899, 11, 30) + (+s) * 864e5); return d.toISOString().slice(0, 10); }
    if ((m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);

  }

  function parseMother(text) {

      if (!date || !r || ['良', '稍重', '重', '不良'].indexOf(baba) < 0) { if (!/日付/.test(l)) bad++; return; }
      rows.push({ id: date.replace(/-/g, '') + '-oi-' + pad(r), date: date, venue: '大井', r: r, baba: baba, dist: num(c[3]), surface: 'ダ', n: num(c[4]), tan1: num(c[5]), s1: num(c[6]),
        p1: num(c[7]), p2: num(c[8]), p3: num(c[9]), s5: num(c[10]), s10: num(c[11]), umatanPay: num(c[12]), sanrenPay: num(c[13]), note: c[14] || '', cnt: (c[15] === '' || c[15] == null) ? 1 : Number(z2h(c[15])) });
    });

    box.innerHTML = '<summary style="cursor:pointer;font-weight:700">基盤データの更新（Excelから貼り付け）</summary>' +
      '<p class="hint">Excelの検証データの<b>A〜P列（日付〜集計対象）</b>を全部コピーして貼り付けてね。今の基盤データと<b>まるごと入れ替える</b>よ。買ったレースの記録には触らないよ。</p>' +
      '<p class="small muted" id="pwaMotherMeta" style="margin:6px 0"></p>' +
      '<textarea id="pwaMotherText" rows="5" placeholder="2026/10/08\t1\t良\t1200\t12\t2.1\t18.5\t1\t3\t2\t…"></textarea>' +
      '<div class="row" style="margin-top:8px"><button class="btn" type="button" id="pwaMotherParse">読み取る</button><span class="small" id="pwaMotherInfo"></span><button class="btn primary" type="button" id="pwaMotherApply" hidden>入れ替える</button></div>';
    note.parentNode.insertBefore(box, note.nextSibling);
    var parsed = null;
    function meta() { TengelLocal.motherMeta().then(function (m) { $('#pwaMotherMeta').textContent = m ? ('いまの基盤データ：' + m.n + '走（' + (String(m.ver).indexOf('paste') === 0 ? '貼り付けで更新' : 'アプリに入っていた版') + '・' + new Date(m.at).toLocaleString('ja-JP') + '）') : ''; }); }

      $('#pwaMotherApply').hidden = !parsed.rows.length;

        .catch(function (e) { toast('入れ替えられなかったよ：' + (e && e.message || e)); });
    });

      '<div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="pwaBackup">バックアップを保存</button><button class="btn" type="button" id="pwaRestore">バックアップから戻す</button><input type="file" id="pwaRestoreFile" accept=".json,application/json" hidden></div><p class="small" id="pwaBkInfo"></p>';
    rec.insertBefore(bk, $('#recList'));

})();
