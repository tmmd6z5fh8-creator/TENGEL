れます。</li>\n<li><b>外部のページ：</b>リンクを押したときは、Safariなどのブラウザで開きます。</li>\n</ul>\n<h3>4. 第三者への提供</h3>\n<p>開発者は利用者の情報を持っていないため、第三者に提供することはありません。</p>\n<h3>5. 情報の削除</h3>\n<p>記録は本アプリの中で削除できます。APIキーは「設定 → 画像の読み取り → キーを消す」で削除できます。</p>\n<h3>6. 対象年齢</h3>\n<p>本アプリは20歳以上の方を対象としています（20歳未満の方は、法律により馬券を購入できません）。</p>\n<h3>7. 変更</h3>\n<p>このポリシーを変更するときは、本アプリまたはこのページでお知らせします。</p>\n<p class=\"small\">制定：2026年10月13日</p>", "tokushoho": null, "fonts": null, "email": null, "links": {"privacy": null, "tokushoho": null, "support": null}};window.__MOTHER_VER="2026-10-09b";window.__MOTHER=[{"id": "20260720-oi-01", "date": "2026-07-20", "venue": "大井", "r": 1, "baba": "稍重", "dist": 1600, "surface": "ダ", "n": 14, "tan1": 1.2, "s1": 19.5, "p1": 7, "p2": 5, "p3": 3, "cnt": 1, "note": ""}, {"id": "20260720-oi-02", "date": "2026-07-20", "venue": "大井", "r": 2, "baba": "稍重", "dist": 1200, "surface": "ダ", "n": 15, "tan1": 1.9, "s1": 43.6, "p1": 6, "p2": 12, "p3": 14, "cnt": 1, "note": ""}, {"id": "20260720-oi-03", "date": "2026-07-20", "venue": "大井", "r": 3, "baba": "稍重", "dist": 1400, "surface": "ダ", "n": 7, "tan1": 1.2, "s1": 16, "p1": 1, "p2": 4, "p3": 2, "cnt": 1, "note": ""}, {"id": "20260720-oi-04", "date": "2026-07-20", "venue": "大井", "r": 4, "baba": "稍重", "dist": 1200, "surface": "ダ", "n": 10, "tan1": 1.7, "s1": 14.9, "p1": 1, "p2": 5, "p3": 2, "cnt": 1, "note": ""}, {"id": "20260720-oi-05", "date": "2026-07-20", "venue": "大井", "r": 5, "baba": "良", "dist": 1400, "surface": "ダ", "n": 10, "tan1": 1.4, "s1": 17.7, "p1": 5, "p2": 2, "p3": 1, "cnt": 1, "note": ""}, {"id": "20260720-oi-06", "date": "2026-07-20", "venue": "大井", "r": 6, "baba": "良", "dist": 1200, "surface": "ダ", "n": 13, "tan1": 1.9, "s1": 23.7, "p1": 2, "p2": 7, "p3": 3, "cnt": 1, "note": ""}, {"id": "20260720-oi-07", "date": "2026-07-20", "venue": "大井", "r": 7, "baba": "良", "dist": 1600, "surface": "ダ", "n": 10, "tan1": 2.9, "s1": 23.1, "p1": 3, "p2": 5, "p3": 4, "cnt": 1, "note": ""}, {"id": "20260720-oi-08", "date": "2026-07-20", "venue": " <title>テンゲルⅢ</title>

  --font-body:'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;

  --primary:#F0B54E; --primary-ink:#1C1300; --focus:#F0B54E;

*{box-sizing:border-box}

.muted{color:var(--muted)}

.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}

.tabs-top button{color:var(--night-ink);opacity:.7;padding:6px 14px;border-radius:8px;font-weight:700}
.tabs-top button[aria-selected="true"]{opacity:1;background:rgba(243,240,230,.12);box-shadow:inset 0 -2px 0 var(--lamp)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--sab,0px)}
.tabbar button{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{color:var(--primary)}
@media (min-width:900px){.tabs-top{display:flex}.tabbar{display:none}}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 96px}
@media (min-width:900px){main{padding-block:22px 48px}}
.view[hidden]{display:none}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:var(--gap)}
.card h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 12px;font-weight:700}
.card h3{font-size:15px;margin:0 0 8px}
.judge-grid{display:grid;gap:var(--gap)}

.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}

.f.s2{grid-column:span 2}.f.s3{grid-column:span 3}.f.s4{grid-column:span 4}.f.s6{grid-column:span 6}
input[type=text],input[type=number],input[type=date],input[type=password],input:not([type]),select,textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}

input[type=number]{appearance:textfield;-moz-appearance:textfield}

textarea{font-size:14px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}

.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.banner{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.banner.info{background:var(--A-bg);color:var(--ink)}
.banner.warn{background:var(--warn-bg);color:var(--ink)}
.banner.bad{background:var(--bad-bg);color:var(--ink)}

/* odds grid */

.orow{display:grid;grid-template-columns:2.1em minmax(0,.8fr) minmax(0,1.2fr);gap:8px;align-items:center}

#result{scroll-margin-top:72px}

.vhead{display:flex;gap:14px;align-items:stretch}

.lbadge .ln{font-size:12px;font-weight:700;letter-spacing:.08em;margin-top:2px}
.LA{background:var(--A-bg);color:var(--A)}.LB{background:var(--B-bg);color:var(--B)}.LC{background:var(--C-bg);color:var(--C)}

.flag{font-size:11px;color:var(--warn);white-space:nowrap}
.ledit{padding:4px 12px 14px;background:var(--surface-2);border-top:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}

/* stats */
.stat-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.stat-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1.2}
.tile .l{font-size:12px;color:var(--muted);font-weight:700}
.tile .d{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td.l,table.t th.l{text-align:left}
table.t thead th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--muted)}
table.t tr.sub td{color:var(--muted);font-size:12.5px}
table.t .g{color:var(--ok);font-weight:700}
.stat-grid{display:grid;gap:var(--gap);margin-top:var(--gap)}
@media (min-width:900px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-grid .wide{grid-column:1/-1}}
.stat-grid .card+.card{margin-top:0}
.stat-grid>*,.judge-grid>*{min-width:0}
.ledit .fields{max-width:760px}
.minibar{position:fixed;left:0;right:0;bottom:calc(58px + var(--sab,0px));z-index:25;padding-inline:12px;display:flex;justify-content:center;pointer-events:none}
.minibar button{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;border:0;cursor:pointer;background:var(--night);color:var(--night-ink);border-radius:999px;padding:7px 8px 7px 7px;box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:13px;text-align:left}
.minibar .lb{flex:none}
.minibar .mz{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar .go{flex:none;font-weight:700;color:var(--lamp);padding-right:6px}
@media (min-width:900px){.minibar{display:none}}
.heat td.c{text-align:center;font-family:var(--font-mono);min-width:3em}
.heat td.c.on{outline:2px solid var(--primary);outline-offset:-3px;font-weight:700}
.prog{display:flex;flex-direction:column;gap:12px}
.pi .pl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.pi .pl b{font-family:var(--font-mono)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--primary)}
.pi .pd{font-size:12px;color:var(--muted);margin-top:3px}

.toast{position:fixed;left:50%;bottom:calc(118px + var(--sab,0px));transform:translateX(-50%);background:var(--night);color:var(--night-ink);padding:9px 16px;border-radius:18px;font-size:13.5px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);width:max-content;max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}.f.s3{grid-column:span 2}.f.s4{grid-column:span 4}.f.s6{grid-column:span 4}.f.s2m4{grid-column:span 4}}

/* v2: 購入記録・月ごとの収支 */
.ym{display:flex;flex-direction:column;gap:10px}
.ym-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ym-top select{width:auto;min-width:7.5em;font-weight:700}
.ym-top .ttl{font-weight:700;font-size:15px}
.months{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (min-width:700px){.months{grid-template-columns:repeat(13,minmax(0,1fr))}}
.months button{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 2px;cursor:pointer;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.months button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
.months button.has::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--lamp)}
.money-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:var(--gap)}
@media (min-width:700px){.money-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile .v.plus,.plus{color:var(--ok)}
.tile .v.minus,.minus{color:var(--bad)}
.stc{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.stc.hit{background:var(--ok-bg);color:var(--ok)}
.stc.miss{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.stc.wait{background:var(--warn-bg);color:var(--warn)}
.stc.skip{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-weight:400}
.stc.ref{background:var(--A-bg);color:var(--A)}
.recbox{display:flex;flex-direction:column;gap:12px}
.recstatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.recstatus .big{font-size:18px;font-weight:700}
.recstatus .sub{font-size:12.5px;color:var(--muted)}
.balance{font-family:var(--font-mono);font-weight:600}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700}
.toggles button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.sep{display:flex;align-items:center;gap:12px;margin:28px 0 4px}
.sep h2{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0;letter-spacing:.03em;white-space:nowrap}
.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.mother-note{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.perchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
table.t tr.cur td{background:var(--surface-2);font-weight:700}
.lmoney{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}

/* v3: 設定・買い目編集 */
.zk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.zk-tabs .fchip{position:relative}
.zk-tabs .fchip.cus::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 2px var(--surface)}
.zk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zk-head b{font-size:16px}
.chip.cus{background:var(--lamp);color:#1C1300;border-color:transparent}
.chip.dirty{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.zedit{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.zrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.zr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zr-no{font-family:var(--font-display);font-size:15px;color:var(--muted)}
.zr-label{font-weight:700;font-size:16px}
.zr-act{margin-left:auto;display:flex;gap:4px}
.zr-act button{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:32px;cursor:pointer;font-size:15px;line-height:1}
.zr-act button:disabled{opacity:.35;cursor:default}
.zr-line{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.zr-lab{font-size:12px;font-weight:700;color:var(--muted)}
.zpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zpick button{border:0;background:none;padding:7px 2px;cursor:pointer;font-size:13.5px;white-space:nowrap;min-height:36px}
.zpick button+button{border-left:1px solid var(--line)}
.zpick button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.zr-stat{font-size:12.5px;color:var(--muted);margin-top:8px}
.zr-stat b{color:var(--ink);font-family:var(--font-mono)}
.zr-warn{font-size:12.5px;color:var(--warn);margin-top:6px}
.zsum{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);font-size:13px}
.zsum b{font-family:var(--font-mono)}
.zsave{margin-top:14px;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.zsave.sticky{position:sticky;bottom:calc(64px + var(--sab,0px));z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.14);border-color:var(--lamp)}
@media (min-width:900px){.zsave.sticky{bottom:12px}}
.zsave .msg{font-size:12.5px;color:var(--muted);flex:1 1 12em}
.setsec+.setsec{margin-top:var(--gap)}
.updbar{flex:1 1 100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--lamp);border-radius:10px;padding:8px 10px;font-size:13.5px;background:rgba(226,162,59,.12)}
.updbar b{color:var(--lamp)}
.updbar .btn{margin-left:auto;background:var(--lamp);color:#1C1300;border-color:var(--lamp);padding:7px 14px}
#smRevert,#seRevert,#seClear{white-space:normal;text-align:left}
.kvs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:8px 0}
.kvs dt{color:var(--muted)}.kvs dd{margin:0;min-width:0}

/* v4: マザーデータ（3つ） */
.slotbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.slotbar .sl-lab{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.slotchip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;max-width:100%}
.slotchip b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.slotchip span{font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
.slotchip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.slotchip.on span{color:inherit;opacity:.8}
.slotchip.empty{border-style:dashed;opacity:.75}
#slotStats .slotbar{margin:2px 0 8px}
.slotlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.slotrow.on{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.slotrow.edit{outline:2px dashed var(--lamp);outline-offset:2px}
.sr-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15.5px}
.sr-no{font-family:var(--font-display);color:var(--muted);font-size:14px}
.sr-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.sr-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sr-act .btn{padding:7px 12px}
.slotedit{margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--lamp);background:var(--surface)}
.slotedit h3{font-size:15px;margin:0 0 8px}
.slotedit .namerow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
/* v5: ひとつ前に戻す・形のちがうファイルの注意・画像の読み取りの設定 */
.setsec{scroll-margin-top:84px}
.warnline{color:var(--warn);font-weight:700}
#seUndo{white-space:normal;text-align:left}
.ocrset .namerow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ocrset .seg{max-width:420px}
ol.steps{margin:8px 0 0;padding-left:1.4em;line-height:1.8}
ol.steps li+li{margin-top:2px}
/* v7: 買った券種（7種類）・券種ごとの金額 */
.bettypes button{padding:7px 11px}
.amts{display:flex;flex-direction:column;gap:6px}
.amts:empty{display:none}
.amt{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto minmax(0,1fr) 4.6em;gap:6px;align-items:center}
.amt-t{font-weight:700;font-size:14px;white-space:nowrap}
.amt .arr{color:var(--muted)}
.amt input{font-family:var(--font-mono)}
.amt-s{font-size:11.5px;font-weight:700;text-align:center;border-radius:999px;padding:2px 4px;white-space:nowrap}
.amt-s.hit{background:var(--ok-bg);color:var(--ok)}
.amt-s.miss{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.amt-s.wait{background:var(--warn-bg);color:var(--warn)}
.amt-s.skip{color:var(--muted)}
/* v8: 記録フォームの「マザーデータにも入れる」 */
.mfld{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.mfld .mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mfld select{width:auto;min-width:12em;max-width:100%}
.mpays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.mpays label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.mpays input{font-family:var(--font-mono)}
.mstate{margin-top:6px}
.mstate .go{border:0;background:none;padding:0;color:var(--A);text-decoration:underline;cursor:pointer;font:inherit}
.chip.mchip{background:var(--A-bg);color:var(--A);border-color:transparent}
/* v6: WIN5（JRAの指定5レースの1着を全部当てる） */
.w5banner{display:flex;flex-direction:column;gap:8px;border:1px solid var(--lamp);background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:var(--gap)}
.w5banner b{font-size:15px}
.w5banner .sub{display:block;font-size:12.5px;color:var(--muted)}
.w5slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.w5sbtn{min-width:2.5em;height:2.3em;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;color:var(--ink)}
.w5sbtn.has{border-color:var(--primary);box-shadow:inset 0 -3px 0 var(--primary)}
.w5sbtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.w5push{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.w5push .lab{font-size:12.5px;color:var(--muted);font-weight:700}
.w5top .fields{margin-top:12px}
.w5sum{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--night);color:var(--night-ink);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.w5sum .big{font-family:var(--font-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.w5sum .eq{font-family:var(--font-mono);font-size:13px;opacity:.8;flex:1 1 100%}
.w5sum .lite{font-size:12.5px;opacity:.8}
.w5sum.bad{background:var(--bad-bg);color:var(--ink)}
.w5races{display:flex;flex-direction:column;gap:var(--gap);margin-top:var(--gap)}
.w5h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.w5no{font-family:var(--font-display);font-size:22px;line-height:1;color:var(--primary);min-width:1.2em}
.w5ttl{font-weight:700;font-size:16px}
.w5meta{font-size:12.5px;color:var(--muted);flex:1 1 100%}
.w5lab{font-size:12px;font-weight:700;color:var(--muted);margin-top:12px}
.w5zones{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.w5zones button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;cursor:pointer;font-weight:700;display:inline-flex;align-items:baseline;gap:5px;color:var(--ink)}
.w5zones button small{font-size:10.5px;font-weight:700;color:var(--lamp)}
.w5zones button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.w5zones button[aria-pressed="true"] small{color:inherit;opacity:.85}
.w5zones button:disabled{opacity:.4;cursor:default}
.w5picks{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}
.num.off{opacity:.28}
button.num{border:0;cursor:pointer;margin:0;-webkit-tap-highlight-color:transparent}
button.num:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hpnote{font-size:12px;color:var(--muted);margin:10px 0 -4px}
.w5picks .cnt{font-family:var(--font-mono);font-weight:600;margin-left:4px}
.w5empty{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.w5res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.w5res .f input{text-align:center;font-family:var(--font-mono)}
.w5res .f>label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w5mk{font-weight:700;font-size:15px;text-align:center;min-height:1.4em}
.w5mk.o{color:var(--ok)}.w5mk.x{color:var(--bad)}
.w5recs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.w5rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.w5rec.cur{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.w5rec .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.w5rec .r2{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.w5act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.w5act .btn{padding:7px 12px}
@media (max-width:420px){.w5res{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.w5res .f input{padding:8px 4px}}
/* App Store版だけ：一つ前のレース（矢印）・テンゲルにお任せ・買い目（予約）・予約レースの結果入力 */
.rnav{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:12.5px;color:var(--muted)}
.rnav button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.rnav button:disabled{opacity:.35;cursor:default}
.rnav .cur{flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnav .cur.prev{color:var(--warn);font-weight:700}
.hprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 8px}
.hprow .hpnote{margin:0;flex:1;min-width:200px}
.btn.omakase{background:var(--night);color:var(--night-ink);border-color:transparent}
.zref .cpct{color:var(--ink);font-weight:700;font-family:var(--font-mono)}
.rsvst{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-bottom:10px}
.rsvst .stc{font-size:13px}
.betlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.betrow{display:grid;grid-template-columns:5.2em minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.betrow .bt{font-weight:700}
.betrow .bc{font-family:var(--font-mono);font-variant-numeric:tabular-nums;line-height:1.7;word-break:break-all}
.betrow .bn{color:var(--muted);white-space:nowrap}
.betrow .bc .hitc{background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:0 3px;font-weight:700}
.betrow .bc .refc{text-decoration:line-through;color:var(--muted)}

<script>
/* ===== テンゲルⅢ 判定エンジン（第13改訂版） ===== */
const T = (() => {
  const VERSION = '第13改訂版';
  const ZN = ['人気', '中穴', '大穴', '超大穴'];
  const SYM = 'ABCDEFGHIJKL';
  const P = { // 期間の区分
    kohan: '2026-08-31', shinki: '2026-10-04', dai13: '2026-10-08'
  };

  const round1 = x => Math.round(x * 10 + 1e-7) / 10;
  const ratio = (tan1, s1) => (tan1 > 0 && s1 > 0) ? round1(s1 / tan1) : null;
  const zoneOf = rank => {
    if (!rank || rank < 1) return null;
    if (rank <= 3) return '人気';
    if (rank <= 6) return '中穴';
    if (rank <= 9) return '大穴';
    if (rank <= 12) return '超大穴';
    return '対象外';
  };
  const period = d => !d ? '' : d < P.kohan ? '前半' : d < P.shinki ? '後半' : d < P.dai13 ? '新規' : '第13新規';

  // ゾーン定義
  const Z = (a, b, label, opt = {}) => ({ a, b, label: label || (a + '→' + b.join('／')), ...opt });
  const SETS = {
    A: [Z('人気', ['人気']), Z('人気', ['中穴'])],
    B: [Z('中穴', ['人気']), Z('人気', ['大穴'])],
    C0: [Z('人気', ['人気']), Z('人気', ['中穴'])],
    C1: [Z('人気', ['大穴']), Z('中穴', ['中穴'], null, { prov: true }), Z('大穴', ['人気'])],
    C2: [Z('人気', ['大穴', '超大穴']), Z('中穴', ['大穴', '超大穴']), Z('大穴', ['人気'])]
  };
  const THIRD = {
    A: [['人気', '中穴'], ['人気', '中穴']],
    B: [['人気', '大穴'], ['人気', '大穴']],
    C0: null,
    C1: [['人気', '中穴'], ['人気', '大穴'], ['人気', '中穴']],
    C2: [['人気', '中穴'], ['人気', '超大穴'], ['人気', '中穴']]
  };
  const THIRD_PROV = { A: [false, false], B: [true, true], C0: null, C1: [false, true, false], C2: [false, true, false] };
  // 旧本線（第12の帯）は買い目編集の影響を受けない固定の定義
  const OLD = {
    '非該当': [Z('人気', ['人気']), Z('人気', ['中穴'])],
    '第1段階': [Z('人気', ['大穴']), Z('中穴', ['中穴'], null, { prov: true }), Z('大穴', ['人気'])],
    '第2段階': [Z('人気', ['大穴', '超大穴']), Z('中穴', ['大穴', '超大穴']), Z('大穴', ['人気'])]
  };
  const KUBUN_LABEL = { A: 'A層（固定）', B: 'B層（固定）', C0: 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' };

  // ===== 買い目編集（まさちゃんのカスタム） =====
  // 設定の形：{ A: [{ a:'人気', b:['人気'], t:['人気','中穴'] }, …], B: …, C0: …, C1: …, C2: … }
  // t（3着）が空＝その買い目の3着は見送り
  const KEYS = ['A', 'B', 'C0', 'C1', 'C2'];
  const MAXZ = 6;
  const DEFAULT_CFG = {};
  for (const k of KEYS) DEFAULT_CFG[k] = SETS[k].map((z, i) => ({ a: z.a, b: [...z.b], t: THIRD[k] ? [...THIRD[k][i]] : [] }));
  const DEF_SETS = {}, DEF_PROV = {};
  for (const k of KEYS) { DEF_SETS[k] = SETS[k].map(z => ({ ...z, b: [...z.b] })); DEF_PROV[k] = THIRD_PROV[k] ? [...THIRD_PROV[k]] : null; }
  const CUSTOM = { A: false, B: false, C0: false, C1: false, C2: false };
  const ordZ = arr => ZN.filter(z => (arr || []).includes(z));
  function normRow(r) {
    if (!r || !ZN.includes(r.a)) return null;
    const b = ordZ(r.b); if (!b.length) return null;
    return { a: r.a, b, t: ordZ(r.t) };
  }
  const sameRow = (x, y) => x.a === y.a && x.b.join() === y.b.join() && x.t.join() === y.t.join();
  const copyCfg = c => { const o = {}; for (const k of KEYS) o[k] = c[k].map(r => ({ a: r.a, b: [...r.b], t: [...r.t] })); return o; };
  function cleanCfg(cfg) {
    const o = {};
    for (const k of KEYS) {
      const rows = cfg && Array.isArray(cfg[k]) ? cfg[k].map(normRow).filter(Boolean).slice(0, MAXZ) : [];
      o[k] = rows.length ? rows : DEFAULT_CFG[k].map(r => ({ a: r.a, b: [...r.b], t: [...r.t] }));
    }
    return o;
  }
  function isDefaultRows(k, rows) { const d = DEFAULT_CFG[k]; return rows.length === d.length && rows.every((r, i) => sameRow(r, d[i])); }
  let CFG = copyCfg(DEFAULT_CFG);
  function setZones(cfg) {
    CFG = cleanCfg(cfg);
    for (const k of KEYS) {
      const rows = CFG[k];
      CUSTOM[k] = !isDefaultRows(k, rows);
      const zs = rows.map(r => {
        const d = DEF_SETS[k].find(z => z.a === r.a && z.b.join() === r.b.join());
        return Z(r.a, r.b, null, d && d.prov ? { prov: true } : {});
      });
      SETS[k].splice(0, SETS[k].length, ...zs);
      if (!rows.some(r => r.t.length)) { THIRD[k] = null; THIRD_PROV[k] = null; }
      else {
        THIRD[k] = rows.map(r => [...r.t]);
        THIRD_PROV[k] = rows.map(r => { const i = DEFAULT_CFG[k].findIndex(x => sameRow(x, r)); return i >= 0 && DEF_PROV[k] ? !!DEF_PROV[k][i] : false; });
      }
    }
    return CFG;
  }
  const getZones = () => copyCfg(CFG);
  const isCustom = k => k ? !!CUSTOM[k] : KEYS.some(x => CUSTOM[x]);
  // ペアの出現数（"人気|中穴" → 回数）から、あるゾーンの出現数を数える
  const zoneCount = (pairs, z) => z.b.reduce((s, b) => s + ((pairs && pairs[z.a + '|' + b]) || 0), 0);
  const LAYER_LABEL = { A: 'A層（堅）', B: 'B層（警戒）', C: 'C層（穴）' };

  function gateRaw(hi, n) {
    if (hi == null || !n) return '非該当';
    if (hi >= 10 && n >= 14) return '第2段階';
    if (hi >= 10 && n >= 9) return '第1段階';
    return '非該当';
  }
  function layerOf(baba, tan1, s1) {
    const hi = ratio(tan1, s1);
    if (baba === '重') return { L: 'A', cond: 1, hi };
    if (s1 >= 62.4) return { L: 'C', cond: 2, hi };
    if (tan1 >= 2.5 && hi >= 16) return { L: 'C', cond: 3, hi };
    if (hi >= 12) return { L: 'B', cond: 4, hi };
    return { L: 'A', cond: 5, hi };
  }
  // 第13の区分
  function classify(x) {
    const { L, cond, hi } = layerOf(x.baba, x.tan1, x.s1);
    const g = gateRaw(hi, x.n);
    let kubun, early = false, honrai = null, c0reason = null;
    if (L === 'A') kubun = 'A';
    else if (L === 'B') kubun = 'B';
    else if (x.r <= 3) { kubun = 'C0'; early = true; honrai = g; c0reason = '序盤R'; }
    else { kubun = g === '第2段階' ? 'C2' : g === '第1段階' ? 'C1' : 'C0'; if (kubun === 'C0') c0reason = 'ゲート条件未達'; }
    // 第12の帯（旧本線）
    let band12;
    if (x.r <= 3) band12 = '非該当';
    else if (L === 'A' && x.baba !== '重') band12 = '非該当';
    else band12 = g;
    const c20 = L === 'C' ? (hi >= 20 ? '比20以上' : '比20未満') : '';
    return { L, cond, hi, gate: g, kubun, early, honrai, c0reason, band12, c20 };
  }
  function zoneHit(set, z1, z2) {
    if (!z1 || !z2) return 0;
    for (let i = 0; i < set.length; i++) if (set[i].a === z1 && set[i].b.includes(z2)) return i + 1;
    return 0;
  }
  // 頭数ごとのゾーン頭数・通り数
  const zsize = (z, n) => {
    const i = ZN.indexOf(z); if (i < 0) return 0;
    return Math.max(0, Math.min(3, n - i * 3));
  };
  const combos = (zone, n) => zone.b.reduce((s, b) => {
    const sa = zsize(zone.a, n), sb = zsize(b, n);
    return s + (zone.a === b ? sa * Math.max(0, sa - 1) : sa * sb);
  }, 0);

  // レコード → 派生値
  function derive(rec) {
    const c = classify(rec);
    const z1 = zoneOf(rec.p1), z2 = zoneOf(rec.p2), z3 = zoneOf(rec.p3);
    const has12 = !!(z1 && z2);
    const set = SETS[c.kubun];
    const hit = has12 ? zoneHit(set, z1, z2) : 0;
    const third = THIRD[c.kubun];
    const has3 = has12 && !!z3;
    const t3 = (hit && third) ? (third[hit - 1] || []) : [];

    if (auto.length) { const k = room >= 1 ? w5Alloc(auto.map(r => r.list), room) : auto.map(() => 1); auto.forEach((r, j) => { r.picks = r.list.slice(0, k[j]).map(h => h.no); }); }
    manual.forEach(r => { r.picks = r.man.slice(); });
  } else ready.forEach(r => { r.picks = r.man ? r.man.slice() : r.list.map(h => h.no); });
  plan.manual = ready.filter(r => r.man).map(r => r.i);
  // 当たる目安：選んだゾーンの「1着の割合（実測）」×ゾーンの中で買った馬の単勝オッズの割合
  let all = 1;
  ready.forEach(r => {
    const M = w5Rates(r.J.c.kubun), pick = new Set(r.picks), zp = z => r.J.horses.filter(h => h.zone === z).reduce((a, h) => a + r.pOf(h), 0);
    const zpk = z => r.J.horses.filter(h => h.zone === z && pick.has(h.no)).reduce((a, h) => a + r.pOf(h), 0);
    r.M = M;
    r.cover = M.n >= 5 ? T.ZN.reduce((a, z) => a + (zp(z) > 0 ? (M.c[z] / M.n) * (zpk(z) / zp(z)) : 0), 0) : r.J.horses.filter(h => pick.has(h.no)).reduce((a, h) => a + r.pOf(h), 0);
    r.coverBy = M.n >= 5 ? 'jissoku' : 'odds';
    all *= r.cover;
  });
  plan.points = ready.length ? ready.reduce((a, r) => a * r.picks.length, 1) : 0;
  plan.cost = plan.points * 100;
  plan.hitAll = plan.all ? all : null;
  plan.over = plan.all && maxPts >= 1 && plan.points > maxPts;
  return plan;
}
// 当たり外れ：1着の馬番が買った馬に入っているか。1つでも外れたら不的中、5つ全部入ったら的中
function w5StatusOf(races, other) {
  const marks = (races || []).map(r => { const w = toNum(r.win); if (w == null) return '—'; return (r.picks || []).includes(w) ? '○' : '×'; });
  if (other === '未購入') return { s: '未購入', cls: 'skip', marks };
  if (other === '払い戻し') return { s: '払い戻し', cls: 'skip', marks };
  if (marks.includes('×')) return { s: '不的中', cls: 'miss', marks };
  if (marks.length === W5N && marks.every(m => m === '○')) return { s: '的中', cls: 'hit', marks };
  return { s: '結果待ち', cls: 'wait', marks };
}

  if (d.surface === '芝' || d.surface === 'ダ') f.surface = d.surface;

function setZmsg(t, bad) { const m = $('#zmsg'); if (m) { m.textContent = t; m.style.color = bad ? 'var(--bad)' : ''; } }

// 1つの購読は最大1000件なので、四半期ごとに分けて購読する（2026年7月〜来四半期）
function quarters() {
  const pad = n => String(n).padStart(2, '0'), now = todayJST(), out = [];
  let ey = +now.slice(0, 4), em = Math.floor((+now.slice(5, 7) - 1) / 3) * 3 + 1 + 6; while (em > 12) { em -= 12; ey++; }
  let y = 2026, m = 7;
  while ((y < ey || (y === ey && m < em)) && out.length < 48) { let ny = y, nm = m + 3; if (nm > 12) { nm -= 12; ny++; } out.push([`${y}-${pad(m)}-01`, `${ny}-${pad(nm)}-01`]); y = ny; m = nm; }
  return out;
}
function subscribeAll(db, name, map, onChange, onReady, onDead) {
  const col = db.collection(name), qs = quarters(), seen = new Map(), firstSeen = new Set();
  const subs = [...qs.map(([s, e]) => [s, col.where('date', '>=', s).where('date', '<', e).limit(1000)]),
    ['old', col.where('date', '<', qs[0][0]).limit(1000)], ['future', col.where('date', '>=', qs[qs.length - 1][1]).limit(1000)]];
  let ready = false;
  const handle = key => snap => {
    const ids = new Set(snap.docs.map(d => d.id));
    for (const id of (seen.get(key) || [])) if (!ids.has(id)) map.delete(id);
    seen.set(key, ids);
    for (const d of snap.docs) { const v = d.data(); if (v) map.set(d.id, { id: d.id, ...v }); }
    firstSeen.add(key);
    if (!ready && firstSeen.size >= subs.length) { ready = true; onReady(); }
    if (ready) onChange();
  };
  const onErr = e => { if (e && (e.code === 'revoked' || e.code === 'not_granted')) onDead(); };
  for (const [key, q] of subs) q.onSnapshot(handle(key), onErr);
  setTimeout(() => { if (!ready) { ready = true; onReady(); onChange(); } }, 10000);
}

}

  if (JSON.stringify(T.getZones()) !== before) { st.zdraft = null; recompute(); }
}).catch(() => {});
const t0 = storeGet('tengel.tab'); if (t0) setTab(t0 === 'ledger' ? 'rec' : t0);
if (window.claude && typeof window.claude.use === 'function') { setupDB(); setupOCR(); setupDownloads(); }
else { st.dbState = 'off'; st.betState = 'off'; setPill(); $('#ocrRow').hidden = true; if (st.tab !== 'judge') setTab(st.tab); }
})();

    if (auto && window.TengelWallet) { const w = window.TengelWallet.snapshot(); if (w) data.wallet = w; }

  // バックアップから戻す（同じレースの記録は新しい方を残す・マザーデータは新しいときだけ）。返り値＝お知らせの文
  async function restoreFromData(d) {
    const list = Array.isArray(d) ? d : d && d.bets;
    if (!Array.isArray(list)) throw new Error('テンゲルのバックアップじゃないみたい');
    const cur = TengelLocal.mem.bets;
    const add = list.filter(b => { if (!b || !b.id) return false; const o = cur.get(b.id); return !o || String(b.updatedAt || '') >= String(o.updatedAt || ''); });
    await TengelLocal.putBets(add);
    const msg = [`記録${add.length}件を戻したよ（同じレースは新しい方を残したよ）`];
    if (d.settings && Object.prototype.hasOwnProperty.call(d.settings, 'zones')) {
      document.dispatchEvent(new CustomEvent('tengel:zones', { detail: d.settings.zones }));
      msg.push(d.settings.zones ? '買い目の設定も戻したよ' : '買い目は初期の設定にしたよ');
    }
    const last = rs => rs.reduce((m, r) => r.date > m ? r.date : m, '');
    // ポイントの台帳（アプリの中の自動バックアップにだけ入っている）。書き出したファイルには入っていない
    if (d.wallet && d.auto && window.TengelWallet) {
      const w = window.TengelWallet;
      if (w.isEmpty()) { const ok = await w.restore(d.wallet).catch(() => false); if (ok) msg.push(`ポイント（${w.total().toLocaleString('ja-JP')}P）も戻したよ`); }
    }
    if (d.slots) {
      for (const n of [1, 2, 3]) if (d.slots.names && d.slots.names[n]) await L().rename(n, d.slots.names[n]);
      for (const n of [2, 3]) {
        const doc = d.slots.data && d.slots.data[n]; if (!doc || !Array.isArray(doc.rows) || !doc.rows.length) continue;
        if (slotLocked(n)) { msg.push(`「${L().names()[n]}」の枠は解放していないので、そのデータは入れなかったよ`); continue; }
        const cur = L().rows(n), bl = last(doc.rows), cl = last(cur);
        if (!cur.length || bl > cl || (bl === cl && doc.rows.length > cur.length)) { await L().replace(n, doc.rows, { source: doc.source || 'excel', file: doc.file || '' }); msg.push(`「${L().names()[n]}」のデータ${doc.rows.length}走も戻したよ`); }
      }
    }
    if (Array.isArray(d.motherAdd) && d.motherAdd.length) {
      const have = new Set(L().rows(1).map(r => r.id));
      const add = d.motherAdd.filter(r => r && r.id && r.date && r.r && !have.has(r.id));
      if (add.length) { await L().upsert(1, add); msg.push(`「${L().names()[1]}」に、自分で入れたレース${add.length}走も戻したよ`); }
    }
    if (d.mother && Array.isArray(d.mother.rows) && d.mother.rows.length) {
      const curRows = L().rows(1);
      const bl = last(d.mother.rows), cl = last(curRows);
      if (bl > cl || (bl === cl && d.mother.rows.length > curRows.length)) {
        await TengelLocal.replaceRaces(d.mother.rows, { source: (d.mother.meta && d.mother.meta.source) || 'excel', file: (d.mother.meta && d.mother.meta.file) || '' });
        msg.push(`大井データも${d.mother.rows.length}走に戻したよ`);
      }
    }
    return msg;
  }

  ${A.tokushoho ? `<details id="abTokusho"><summary>特定商取引法に基づく表記</summary><div>${A.tokushoho}</div></details>` : ''}
  ${A.fonts ? `<details id="abFonts"><summary>フォントのライセンス</summary><div>${A.fonts}</div></details>` : ''}
  ${A.email ? `<p class="small" style="margin:10px 0 0">お問い合わせ：<a href="mailto:${esc(A.email)}">${esc(A.email)}</a>${L.support ? `・<a href="${esc(L.support)}" target="_blank" rel="noopener">サポートのページ</a>` : ''}</p>` : ''}`;
    const box = $('#setExtra') || $('#v-set'); if (box) box.appendChild(c);
  }

  function boot() {
    mdCss();
    build();
    manualEntry();
    cmEntry();
    aboutEntry();
    // 記録タブには、バックアップの場所だけ案内する
    const rec = $('#v-rec'), list = $('#recList');
    if (rec && list) {
      const row = document.createElement('div'); row.className = 'row'; row.style.marginTop = 'var(--gap)';
      row.innerHTML = '<button class="btn ghost" type="button" data-goset="backup">💾 記録のバックアップ（設定タブ）</button>';
      rec.insertBefore(row, list);
    }
    document.addEventListener('tengel:tab', e => { if (e.detail === 'set') { TengelLocal.ready.then(() => { paintSlots(false); paintBackup(); paintDataCard(); }).catch(() => {}); } });
    document.addEventListener('tengel:slots', () => { if ($('#slotList')) TengelLocal.ready.then(() => { paintSlots(false); paintDataCard(); mdRefresh(); }).catch(() => {}); });
    TengelLocal.ready.then(() => { paintSlots(false); paintBackup(); (TengelLocal.notices || []).forEach(n => toast(n, 4200)); }).catch(() => {});
    nativeBoot();
    setTimeout(() => checkUpdate(false), 2500);
    if (NATIVE) setTimeout(() => nativeChecks(false), 3000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUpdate(false); if (NATIVE) nativeChecks(false); } });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body></html>
