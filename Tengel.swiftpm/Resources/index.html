<script>window.__APP_VER="2026.10.14-2";window.__CM={"src": "cm/tengel3_cm.mp4?v=997550f1", "poster": "cm/poster.jpg?v=867c5e22", "dur": "0:45", "srcApp": "cm/tengel3_cm_app.mp4?v=d71806b0"};window.__ABOUT={"target": "app", "appName": "テンゲル", "disclaimer": "<ul>\n<li>テンゲルは、過去のレースのデータから傾向を分析して表示する道具です。参考的中率などは過去の実測で、これからの的中や利益を約束するものではありません。</li>\n<li>馬券を買うかどうか、何を買うかは、ご自身の判断でお決めください。</li>\n<li><b>馬券は20歳になってから。</b>20歳未満の方は、法律により馬券を購入できません。</li>\n<li>競馬は無理のない範囲で楽しみましょう。のめり込みが心配なときは、ひとりで悩まずに相談してください。<br>\nギャンブル依存症予防回復支援センター「サポートコール」<a href=\"tel:0120683705\">0120-683-705</a>（年中無休・24時間・通話料無料）<br>\n<a href=\"https://www.cas.go.jp/jp/seisaku/gamble/\" target=\"_blank\" rel=\"noopener\">相談窓口の案内（内閣官房 ギャンブル等依存症対策推進本部）</a></li>\n</ul>", "notices": "<p>テンゲルは個人が開発した非公式のアプリです。競馬の主催者・団体とは関係ありません。</p>\n<ul>\n<li>iPhone、iPad、Safariは、米国およびその他の国で登録されたApple Inc.の商標です。iPhoneの商標は、アイホン株式会社のライセンスにもとづき使用されています。</li>\n<li>Excelは、米国Microsoft Corporationの米国およびその他の国における登録商標または商標です。</li>\n<li>そのほか、記載されている会社名・団体名・商品名・サービス名は、各社・各団体の商標または登録商標です。</li>\n</ul>", "privacy": "<h3>1. 基本の考え方</h3>\n<p>テンゲル（以下「本アプリ」）は、利用者の個人情報や使い方の情報を、開発者が集めることも、受け取ることもありません。本アプリには、広告・アクセス解析・トラッキングの仕組みは入っていません。</p>\n<h3>2. 端末の中に保存する情報</h3>\n<p>次の情報は、利用者の端末の中（本アプリの保存領域）にだけ保存します。開発者には送りません。</p>\n<ul>\n<li>買ったレースの記録・メモ、5重勝の記録</li>\n<li>買い目の設定、マザーデータ（利用者が取り込んだExcel・CSVのデータや、自分で入れたレースのデータを含む）</li>\n<li>ポイントの台帳（買ったポイント・もらったポイント・使ったポイントの記録）、解放したもの、ミッションの進み具合</li>\n<li>予約した買い目・諦めたレース・1つ前のレース</li>\n</ul>\n<p>記録・設定・ポイントの台帳は、端末の中の自動バックアップのファイルにも保存します。これらは、端末のバックアップ（iCloudバックアップなど）に含まれることがあります。ポイントの台帳は、本アプリを削除すると消え、もどせません。</p>\n<p>はじめてのプレゼント（ポイント）を受け取ったことと、サブスクリプションのポイントを足した取引の番号だけは、端末のキーチェーン（Apple Inc. の仕組み。iCloudキーチェーンで同じApple IDの端末と同期されることがあります）に「しるし」として保存します。同じプレゼントやポイントを2回受け取れないようにするためのもので、利用者の記録や個人情報は含みません。開発者は見られません。</p>\n<h3>3. 外部に送る情報</h3>\n<ul>\n<li><b>画像の読み取り：</b>利用者が選んだスクリーンショット画像は、端末の中（iOS・iPadOS の文字認識の機能）で読み取ります。画像も読み取った文字も、外部には送りません。</li>\n<li><b>アプリの更新の確認：</b>アプリを開いたとき（12時間に1回まで）と「新しい版があるか確認」を押したときに、App Storeに新しい版が出ているかを Apple Inc. に問い合わせます。送るのは本アプリのIDと国だけで、利用者の記録や設定は送りません。通信の仕組み上、IPアドレスなどが Apple Inc. に送られます。</li>\n<li><b>データの更新：</b>アプリを開いたとき（12時間に1回まで）と「新しいデータがあるか確認」を押したときに、開発者が GitHub Pages（GitHub, Inc.）で公開しているレースのデータを読み込みます。利用者の記録や設定は送りません。通信の仕組み上、IPアドレスなどが GitHub, Inc. に送られます。</li>\n<li><b>CM（紹介動画）：</b>見るときだけ、動画を GitHub Pages（GitHub, Inc.）から読み込みます。このとき、通信の仕組み上、IPアドレスなどが GitHub, Inc. に送られます。</li>\n<li><b>ファイルに保存・共有：</b>利用者が選んだ保存先・共有先に、バックアップやCSVのファイルを渡します（ポイントの台帳は含みません）。</li>\n<li><b>App内課金：</b>ポイントのパックとサブスクリプションの購入は、Apple Inc. の App内課金（App Store）で行います。購入・支払い・返金の情報は Apple Inc. が扱い、開発者は利用者の氏名・カード情報などを受け取りません。本アプリは、購入が完了したことを App Store から受け取ってポイントを台帳に足します。</li>\n<li><b>結果確認のお知らせ：</b>予約したレースの発走15分後に出すお知らせは、端末の中から出す通知（ローカル通知）です。サーバーもプッシュ通知も使わず、外部には何も送りません。通知の許可は端末の設定でいつでも変えられます。</li>\n<li><b>外部のページ：</b>リンクを押したときは、Safariなどのブラウザで開きます。</li>\n</ul>\n<h3>4. 第三者への提供</h3>\n<p>開発者は利用者の情報を持っていないため、第三者に提供することはありません。</p>\n<h3>5. 情報の削除</h3>\n<p>記録は本アプリの中で削除できます。本アプリを削除すると、端末の中の記録・設定・ポイントの台帳・解放したもの・自動バックアップはすべて削除され、もどせません（キーチェーンの「しるし」は残ることがあります）。</p>\n<h3>6. 対象年齢</h3>\n<p>本アプリは20歳以上の方を対象としています（20歳未満の方は、法律により馬券を購入できません）。</p>\n<h3>7. 変更</h3>\n<p>このポリシーを変更するときは、本アプリまたはこのページでお知らせします。</p>\n<p class=\"small\">制定：2026年10月13日</p>", "tokushoho": null, "fonts": "<p>このアプリでは、次のフォントを SIL Open Font License, Version 1.1 にしたがって使っています（フォントのファイルは変えていません）。</p><ul><li><b>BIZ UDPGothic</b><br><span class=\"small\">Copyright 2022 The BIZ UDGothic Project Authors (https://github.com/googlefonts/morisawa-biz-ud-mincho)</span></li><li><b>Dela Gothic One</b><br><span class=\"small\">Copyright 2020 The Dela Gothic Project Authors (https://github.com/syakuzen/DelaGothic)</span></li><li><b>IBM Plex Mono</b><br><span class=\"small\">Copyright © 2017 IBM Corp. with Reserved Font Name &quot;Plex&quot;</span></li></ul><pre class=\"ofl\">-----------------------------------------------------------\nSIL OPEN FONT LICENSE Version 1.1 - 26 February 2007\n-----------------------------------------------------------\n\nPREAMBLE\nThe g <script>
 
const T = (() => {
  const VERSION = 'テンゲルⅢ';
  const vnorm = v => String(v || '').normalize('NFKC').replace(/\s/g, '').replace(/(競馬場|競馬)$/, '');
  const vhash = v => { let h = 0x811c9dc5; for (const ch of vnorm(v)) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); };
  const homeOf = v => !vnorm(v) || (typeof window !== 'undefined' && Array.isArray(window.__MOTHER_HOME) && window.__MOTHER_HOME.includes(vhash(v)));
  const ZN = ['人気', '中穴', '大穴', '超大穴'];
  const SYM = 'ABCDEFGHIJKL';
  const P = { 
    kohan: '2026-08-31', shinki: '2026-10-04', dai13: '2026-10-08'
  };

  const round1 = x => Math.round(x * 10 + 1e-7) / 10;
  const ratio = (tan1, s1) => (tan1 > 0 && s1 > 0) ? round1(s1 / tan1) : null;
  const zoneOf = rank => {
    if (!rank || rank < 1) return null;
    if (rank <= 3) return '人気';
    if (rank <= 6) return '中穴';
    if (rank <= 9) return '大穴';
    if (rank <= 12) return '超大穴';
    return '対象外';
  };
  const period = d => !d ? '' : d < P.kohan ? '前半' : d < P.shinki ? '後半' : d < P.dai13 ? '新規' : '最新';

  
  const Z = (a, b, label, opt = {}) => ({ a, b, label: label || (a + '→' + b.join('／')), ...opt });
  const SETS = {
    A: [Z('人気', ['人気']), Z('人気', ['中穴'])],
    B: [Z('中穴', ['人気']), Z('人気', ['大穴'])],
    C0: [Z('人気', ['人気']), Z('人気', ['中穴'])],
    C1: [Z('人気', ['大穴']), Z('中穴', ['中穴'], null, { prov: true }), Z('大穴', ['人気'])],
    C2: [Z('人気', ['大穴', '超大穴']), Z('中穴', ['大穴', '超大穴']), Z('大穴', ['人気'])]
  };
  const THIRD = {
    A: [['人気', '中穴'], ['人気', '中穴']],
    B: [['人気', '大穴'], ['人気', '大穴']],
    C0: null,
    C1: [['人気', '中穴'], ['人気', '大穴'], ['人気', '中穴']],
    C2: [['人気', '中穴'], ['人気', '超大穴'], ['人気', '中穴']]
  };
  const THIRD_PROV = { A: [false, false], B: [true, true], C0: null, C1: [false, true, false], C2: [false, true, false] };
  
  const OLD = {
    '非該当': [Z('人気', ['人気']), Z('人気', ['中穴'])],
    '第1段階': [Z('人気', ['大穴']), Z('中穴', ['中穴'], null, { prov: true }), Z('大穴', ['人気'])],
    '第2段階': [Z('人気', ['大穴', '超大穴']), Z('中穴', ['大穴', '超大穴']), Z('大穴', ['人気'])]
  };
  const KUBUN_LABEL = { A: 'A層（固定）', B: 'B層（固定）', C0: 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' };

  
  
  
  const KEYS = ['A', 'B', 'C0', 'C1', 'C2'];
  const MAXZ = 6;
  const DEFAULT_CFG = {};
  for (const k of KEYS) DEFAULT_CFG[k] = SETS[k].map((z, i) => ({ a: z.a, b: [...z.b], t: THIRD[k] ? [...THIRD[k][i]] : [] }));
  const DEF_SETS = {}, DEF_PROV = {};
  for (const k of KEYS) { DEF_SETS[k] = SETS[k].map(z => ({ ...z, b: [...z.b] })); DEF_PROV[k] = THIRD_PROV[k] ? [...THIRD_PROV[k]] : null; }
  const CUSTOM = { A: false, B: false, C0: false, C1: false, C2: false };
  const ordZ = arr => ZN.filter(z => (arr || []).includes(z));
  function normRow(r) {
    if (!r || !ZN.includes(r.a)) return null;
    const b = ordZ(r.b); if (!b.length) return null;
    return { a: r.a, b, t: ordZ(r.t) };
  }
  const sameRow = (x, y) => x.a === y.a && x.b.join() === y.b.join() && x.t.join() === y.t.join();
  const copyCfg = c => { const o = {}; for (const k of KEYS) o[k] = c[k].map(r => ({ a: r.a, b: [...r.b], t: [...r.t] })); return o; };
  function cleanCfg(cfg) {
    const o = {};
    for (const k of KEYS) {
      const rows = cfg && Array.isArray(cfg[k]) ? cfg[k].map(normRow).filter(Boolean).slice(0, MAXZ) : [];
      o[k] = rows.length ? rows : DEFAULT_CFG[k].map(r => ({ a: r.a, b: [...r.b], t: [...r.t] }));
    }
    return o;
  }
  function isDefaultRows(k, rows) { const d = DEFAULT_CFG[k]; return rows.length === d.length && rows.every((r, i) => sameRow(r, d[i])); }
  let CFG = copyCfg(DEFAULT_CFG);
  function setZones(cfg) {
    CFG = cleanCfg(cfg);
    for (const k of KEYS) {
      const rows = CFG[k];
      CUSTOM[k] = !isDefaultRows(k, rows);
      const zs = rows.map(r => {
        const d = DEF_SETS[k].find(z => z.a === r.a && z.b.join() === r.b.join());
        return Z(r.a, r.b, null, d && d.prov ? { prov: true } : {});
      });
      SETS[k].splice(0, SETS[k].length, ...zs);
      if (!rows.some(r => r.t.length)) { THIRD[k] = null; THIRD_PROV[k] = null; }
      else {
        THIRD[k] = rows.map(r => [...r.t]);
        THIRD_PROV[k] = rows.map(r => { const i = DEFAULT_CFG[k].findIndex(x => sameRow(x, r)); return i >= 0 && DEF_PROV[k] ? !!DEF_PROV[k][i] : false; });
      }
    }
    return CFG;
  }
  const getZones = () => copyCfg(CFG);
  const isCustom = k => k ? !!CUSTOM[k] : KEYS.some(x => CUSTOM[x]);
  
  const zoneCount = (pairs, z) => z.b.reduce((s, b) => s + ((pairs && pairs[z.a + '|' + b]) || 0), 0);
  const LAYER_LABEL = { A: 'A層（堅）', B: 'B層（警戒）', C: 'C層（穴）' };

  function gateRaw(hi, n) {
    if (hi == null || !n) return '非該当';
    if (hi >= 10 && n >= 14) return '第2段階';
    if (hi >= 10 && n >= 9) return '第1段階';
    return '非該当';
  }
  function layerOf(baba, tan1, s1) {
    const hi = ratio(tan1, s1);
    if (baba === '重') return { L: 'A', cond: 1, hi };
    if (s1 >= 62.4) return { L: 'C', cond: 2, hi };
    if (tan1 >= 2.5 && hi >= 16) return { L: 'C', cond: 3, hi };
    if (hi >= 12) return { L: 'B', cond: 4, hi };
    return { L: 'A', cond: 5, hi };
  }
  
  function classify(x) {
    const { L, cond, hi } = layerOf(x.baba, x.tan1, x.s1);
    const g = gateRaw(hi, x.n);
    let kubun, early = false, honrai = null, c0reason = null;
    if (L === 'A') kubun = 'A';
    else if (L === 'B') kubun = 'B';
    else if (x.r <= 3) { kubun = 'C0'; early = true; honrai = g; c0reason = '序盤R'; }
    else { kubun = g === '第2段階' ? 'C2' : g === '第1段階' ? 'C1' : 'C0'; if (kubun === 'C0') c0reason = 'ゲート条件未達'; }
    
    let band12;
    if (x.r <= 3) band12 = '非該当';
    else if (L === 'A' && x.baba !== '重') band12 = '非該当';
    else band12 = g;
    const c20 = L === 'C' ? (hi >= 20 ? '比20以上' : '比20未満') : '';
    return { L, cond, hi, gate: g, kubun, early, honrai, c0reason, band12, c20 };
  }
  function zoneHit(set, z1, z2) {
    if (!z1 || !z2) return 0;
    for (let i = 0; i < set.length; i++) if (set[i].a === z1 && set[i].b.includes(z2)) return i + 1;
    return 0;
  }
  
  const zsize = (z, n) => {
    const i = ZN.indexOf(z); if (i < 0) return 0;
    return Math.max(0, Math.min(3, n - i * 3));
  };
  const combos = (zone, n) => zone.b.reduce((s, b) => {
    const sa = zsize(zone.a, n), sb = zsize(b, n);
    return s + (zone.a === b ? sa * Math.max(0, sa - 1) : sa * sb);
  }, 0);

  
  function derive(rec) {
    const c = classify(rec);
    const z1 = zoneOf(rec.p1), z2 = zoneOf(rec.p2), z3 = zoneOf(rec.p3);
    const has12 = !!(z1 && z2);
    const set = SETS[c.kubun];
    const hit = has12 ? zoneHit(set, z1, z2) : 0;
    const third = THIRD[c.kubun];
    const has3 = has12 && !!z3;
    const t3 = (hit && third) ? (third[hit - 1] || []) : [];
    const hit3 = (hit && t3.length && has3) ? t3.includes(z3) : null;
    const tri = !!hit3;
    const oset = OLD[c.band12];
    const hit12 = has12 ? zoneHit(oset, z1, z2) : 0;
    const ana = has12 && ([z1, z2].includes('大穴') || [z1, z2].includes('超大穴'));
    const nn = z1 === '人気' && z2 === '人気';
    const anaZone = z => z.a === '大穴' || z.a === '超大穴' || z.b.includes('大穴') || z.b.includes('超大穴');
    const pay = num(rec.umatanPay);
    const inv13 = set.reduce((s, z) => s + combos(z, rec.n), 0) * 100;
    const inv12 = oset.reduce((s, z) => s + combos(z, rec.n), 0) * 100;
    const isOi = homeOf(rec.venue);
    return {
      ...rec, ...c, z1, z2, z3, has12, has3, hit, hit3, tri, hit12,
      ana, nn, pair: has12 ? z1 + '→' + z2 : '',
      ninkiIn12: (z1 === '人気' ? 1 : 0) + (z2 === '人気' ? 1 : 0),
      anaHit13: hit ? anaZone(set[hit - 1]) : false,
      hitLabel: hit ? set[hit - 1].label : '',
      hitNoNinki: hit ? (set[hit - 1].a !== '人気' && !set[hit - 1].b.includes('人気')) : false,
      anaHit12: hit12 ? anaZone(oset[hit12 - 1]) : false,
      sup1: z1 === '超大穴',
      per: period(rec.date), isOi,
      
      inStats: Number(rec.cnt ?? 1) === 1 && has12,
      pay, inv13, inv12,
      ret13: pay != null && hit ? pay : 0,
      ret12: pay != null && hit12 ? pay : 0
    };
  }
  function num(v) { if (v === '' || v == null) return null; const n = Number(v); return isFinite(n) ? n : null; }

  
  function stats(list, excludeId) {
    const rs = list.filter(r => r.inStats && r.id !== excludeId);
    const zarr = () => Array(MAXZ).fill(0), zsub = () => Array.from({ length: MAXZ }, () => ({ 人気: 0, 中穴: 0, 大穴: 0, 超大穴: 0 }));
    const S = { n: rs.length, k: {}, layer: {}, band12: {}, early: { n: 0, nn: 0, nc: 0, pairs: {} }, c20: {}, ninki: {} };
    for (const k of KEYS) S.k[k] = { n: 0, hit: zarr(), hitTot: 0, nn: 0, ana: 0, n3: 0, t: { 人気: 0, 中穴: 0, 大穴: 0, 超大穴: 0, 対象外: 0 }, hit3n: zarr(), tri3: zarr(), triTot: 0, hitIn3: 0, sub: zsub(), pairs: {} };
    for (const L of ['A', 'B', 'C']) S.layer[L] = { n: 0, ana: 0, nn: 0 };
    for (const b of ['非該当', '第1段階', '第2段階']) S.band12[b] = { n: 0, hit: zarr(), sub: zsub(), pairs: {} };
    for (const c of ['比20以上', '比20未満']) S.c20[c] = { n: 0, ana: 0, sup1: 0, nnnc: 0, hit: 0 };
    for (const i of [0, 1, 2]) S.ninki[i] = { n: 0, 人気: 0, 中穴: 0, 大穴: 0, 超大穴: 0, 対象外: 0 };
    const addPair = (o, r) => { const key = r.z1 + '|' + r.z2; o[key] = (o[key] || 0) + 1; };
    for (const r of rs) {
      const K = S.k[r.kubun];
      K.n++; addPair(K.pairs, r);
      if (r.hit) { K.hit[r.hit - 1]++; K.hitTot++; if (K.sub[r.hit - 1][r.z2] != null) K.sub[r.hit - 1][r.z2]++; }
      if (r.nn) K.nn++; if (r.ana) K.ana++;
      if (r.has3) {
        K.n3++; K.t[r.z3]++;
        if (r.hit && r.hit3 !== null) { K.hitIn3++; K.hit3n[r.hit - 1]++; if (r.tri) { K.tri3[r.hit - 1]++; K.triTot++; } }
        S.ninki[r.ninkiIn12][r.z3]++; S.ninki[r.ninkiIn12].n++;
      }
      const Ly = S.layer[r.L]; Ly.n++; if (r.ana) Ly.ana++; if (r.nn) Ly.nn++;
      const B = S.band12[r.band12]; B.n++; addPair(B.pairs, r);
      const bset = r.band12 === '非該当' ? OLD['非該当'] : OLD[r.band12];
      const bh = zoneHit(bset, r.z1, r.z2);
      if (bh) { B.hit[bh - 1]++; if (B.sub[bh - 1][r.z2] != null) B.sub[bh - 1][r.z2]++; }
      if (r.r <= 3) { S.early.n++; addPair(S.early.pairs, r); if (r.nn) S.early.nn++; if (r.pair === '人気→中穴') S.early.nc++; }
      if (r.L === 'C' && (r.kubun === 'C1' || r.kubun === 'C2')) {
        const C = S.c20[r.c20]; C.n++; if (r.ana) C.ana++; if (r.sup1) C.sup1++; if (r.pair === '人気→人気' || r.pair === '人気→中穴') C.nnnc++; if (r.hit) C.hit++;
      }
    }
    return S;
  }

  const pct = (a, b, d = 1) => b ? (a / b * 100).toFixed(d) + '%' : '—';
  function hantei(K) {
    if (!K || K.n < 5) return { mark: '・【並】', note: '※データ不足', cls: 'nami' };

}

function w5Changed(full) { w5Save(); if (st.tab !== 'win5') return; if (full) renderW5(); else { w5Paint(); w5PaintRes(false); } }
function w5Roll() {

function w5Toggle(i, z) {

}

function w5TogHorse(i, no) {
  const r = w5Plan().races[i]; if (!r.list) return;
  const cur = (r.picks || []).slice(), k = cur.indexOf(no);

function w5Push(n, btn) {
  if (st.form.example) { toast('入力例（架空のレース）は5重勝に入れられないよ'); return; }
  const R = st.w5.races[n - 1], f = st.form;

  if (R.form && !same && !btn.dataset.ok) { btn.dataset.ok = '1'; toast(`${W5MARK[n - 1]}には${w5Label(R.form)}が入っているよ。もう一度押すと入れ替えるよ`, 3600); return; }
  R.form = w5CleanForm(f); R.sel = null; R.win = ''; R.man = null; if (f.date && !st.w5.id) st.w5.date = f.date;
  w5Unfix(); w5Save(); renderResult(); toast(`5重勝の${W5MARK[n - 1]}に${w5Label(f)}を入れたよ。5重勝タブで買い目を出すよ`, 3200);

async function w5SaveRecord(btn) {
  if (!st.db) { toast('記録に接続できていないよ'); return; }
  const plan = w5Plan(), w = st.w5;
  if (!plan.all) { toast('5レース全部入れてから保存してね', 3200); return; }
  if (!plan.maxPts) { toast('予算を100円以上で入れてね'); return; }
  if (!w.date) { toast('日付を入れてね'); return; }
  const id = w.id || (() => { const base = w.date.replace(/-/g, '') + '-win5'; if (!st.win5.has(base) && !st.bets.has(base)) return base; for (let k = 2; ; k++) if (!st.win5.has(base + '-' + k) && !st.bets.has(base + '-' + k)) return base + '-' + k; })();
  const now = new Date().toISOString(), stake = toNum(w.stake) ?? plan.cost;
  const doc = { kind: 'win5', date: w.date, budget: toNum(w.budget), mode: w.mode, points: plan.points, stake, payout: toNum(w.payout), other: w.other || '', note: w.note || '', updatedAt: now,
    races: plan.races.map(r => ({ form: w5CleanForm(r.R.form), sel: r.sel, picks: r.picks || [], win: toNum(r.R.win), label: w5Label(r.R.form), L: r.J.c.L, kubun: r.J.c.kubun })) };
  const isNew = !st.win5.has(id);
  btn.disabled = true;
  try {
    await writeBet(id, isNew ? { ...doc, createdAt: now } : doc, isNew);
    w.id = id; w.fixed = true; w.races.forEach((R, i) => { R.picks = doc.races[i].picks; }); w5Save();
    const s = w5StatusOf(doc.races, doc.other);
    toast(`✅ 5重勝の記録を保存したよ（${s.s}）`, 3000);
    if (!inputBusy('#w5Body')) renderW5(); else w5PaintList();
  } catch (e) { writeErr(e); }
  finally { btn.disabled = false; }
}
function w5Open(id) {

  if (st.w5edit) w5EndEdit(false);
  st.w5 = w5Norm({ id, fixed: true, date: b.date, budget: b.budget == null ? '' : String(b.budget), mode: b.mode || 'pick', randAll: st.w5.randAll,
    races: (b.races || []).map(r => ({ form: r.form || null, sel: r.sel || null, win: r.win == null ? '' : String(r.win), picks: Array.isArray(r.picks) ? r.picks : null })),
    stake: b.stake == null ? '' : String(b.stake), payout: b.payout == null ? '' : String(b.payout), other: b.other || '', note: b.note || '' });

document.addEventListener('click', e => {
  const t = e.target;
  const push = t.closest('[data-w5push]'); if (push) { w5Push(+push.dataset.w5push, push); return; }
  const go = t.closest('[data-w5go]'); if (go) { const n = +go.dataset.w5go; if (n !== st.w5edit) w5StartEdit(n); return; }
  if (t.closest('[data-w5back]')) { w5EndEdit(true); return; }
  if (!t.closest('#w5Body')) return;
  const zb = t.closest('[data-w5z]'); if (zb && !zb.disabled) { w5Toggle(+zb.dataset.i, zb.dataset.w5z); return; }
  const hb = t.closest('[data-w5h]'); if (hb) { w5TogHorse(+hb.dataset.i, +hb.dataset.w5h); return; }
  const mb = t.closest('#w5Mode button'); if (mb) { const v = mb.dataset.v; if (v === st.w5.mode) return; if (v === 'rand') w5Roll(); else st.w5.mode = 'pick'; w5Changed(true); return; }
  const ob = t.closest('#w5Other button'); if (ob) { st.w5.other = ob.dataset.v; $$('#w5Other button').forEach(x => x.setAttribute('aria-pressed', String(x === ob))); w5Save(); w5PaintRes(false); return; }
  const a = t.closest('[data-w5act]'); if (!a) return;
  const act = a.dataset.w5act, row = a.closest('.w5rec');
  if (act === 'edit') w5StartEdit(+a.dataset.i + 1);
  else if (act === 'clear') { const R = st.w5.races[+a.dataset.i]; if (!a.dataset.ok) { a.dataset.ok = '1'; a.textContent = 'ほんとに外す？'; return; } Object.assign(R, w5Race0()); w5Unfix(); w5Changed(true); }
  else if (act === 'roll') { w5Roll(); w5Changed(true); }
  else if (act === 'auto') { st.w5.races[+a.dataset.i].man = null; w5Changed(true); }
  else if (act === 'save') w5SaveRecord(a);
  else if (act === 'new') { if (!a.dataset.ok) { a.dataset.ok = '1'; a.textContent = 'ほんとに新しくする？（入れた5レースは消えるよ）'; return; } if (st.w5edit) w5EndEdit(false); st.w5 = w5Blank(st.w5); w5Changed(true); toast('新しい5重勝にしたよ'); }
  else if (act === 'open' && row) w5Open(row.dataset.id);
  else if (act === 'del1' && row) { st.w5del = row.dataset.id; w5PaintList(); }
  else if (act === 'del0') { st.w5del = null; w5PaintList(); }
  else if (act === 'del2' && row) { const id = row.dataset.id; st.w5del = null; st.db.collection('bets').doc(id).delete().then(() => { if (st.w5.id === id) { st.w5.id = null; st.w5.fixed = false; w5Save(); } toast('5重勝の記録を消したよ'); }).catch(writeErr); }
});

  if (J.horses.length && !st.w5edit) h += NATIVE_APP && Reserve()

    : `<p class="hpnote">番号を押すと、買う馬を選べるよ（うすい番号＝買わない馬）。馬単・3連単の当たり外れは、買ったゾーンの選んだ馬で判定するよ。</p>`;
  h += '<ol class="zones">';
  J.set.forEach((z, i) => {

      else {

        third = `<div class="zthird"><span class="t3">3着：${tz.join('・')}</span>${tprov}<div class="zref">${ref3(J, i)}　馬単的中時の3着 <b>${K.tri3[i]}/${K.hit3n[i]}</b>${tz.includes('人気') ? '　※人気は配当低めになりやすい' : ''}</div>${tn}</div>`;
      }
    }

      ${numsA ? `<div class="znums">${numsA}<span class="arr">→</span>${numsB}</div>` : ''}
      <div class="zref">参考的中率 <b>${refZone(J, i)}</b></div>${customPctHTML(J, i)}<div class="zref">${reasonOf(k, z)}</div>${third}</div></li>`;
  });
  h += '</ol>';
  if (!J.third) h += `<div class="banner info">3連単3着：<b>見送り</b>（${T.isCustom(k) ? 'この区分の買い目に3着を決めていないため' : 'C層・非該当／' + c.c0reason}）</div>`;
  if (J.horses.length) {
    h += '<div class="numbers">' + T.ZN.map(z => { const hn = hideNote(J, z); return `<span class="zl">${z}</span><span>${hn ? `<span class="hidenote">${hn}</span>` : J.nums[z].length ? numChips(J, J.nums[z]) + (/(大穴|超大穴)/.test(z) && J.fukuUsed(z) ? ' <span class="hidenote">複勝順</span>' : '') : '<span class="hidenote">該当なし</span>'}</span>`; }).join('') + (J.outside.length ? `<span class="zl">対象外</span><span class="hidenote">${J.outside.join('・')}（13番人気以降）</span>` : '') + '</div>';
  }
  const kubunN = K.n;
  h += `<div class="vfoot"><div class="small">レース判定：${c.L}層×${bandName(k)}　${kubunN >= 5 ? `人気→人気率 ${pct(K.nn, kubunN)}・穴絡み率 ${pct(K.ana, kubunN)}（n=${kubunN}）` : `データ不足（n=${kubunN}）`}<span class="muted">　※払戻データ未取得のため、人気→人気の出現率を代理指標にしているよ</span></div>`;
  if (J.third) h += `<div class="small">3連単ゾーン的中 ${pct(K.triTot, K.n3)}（${K.triTot}/${K.n3}）・馬単的中時の3着的中率 ${pct(K.triTot, K.hitIn3)}（${K.triTot}/${K.hitIn3}）<span class="muted">　※回収率は払戻がたまってから</span></div>`;
  if (c.L === 'C' && c.c20 === '比20以上' && (k === 'C1' || k === 'C2')) h += `<div class="small">観測メモ：1着超大穴を観測中（${S.c20['比20以上'].sup1}/${S.c20['比20以上'].n}）※判定・ゾーンには使わない</div>`;
  h += `<div class="oldline">旧本線（記録用・買い目ではない）${esc(oldLineText(J))}</div>`;
  if (J.excluded) h += `<div class="small muted">基盤データにあるこのレース自身は外して参考値を計算しているよ（自己参照の除外）。</div>`;
  if (!st.w5edit && !st.form.example) h += `<div class="w5push"><span class="lab">5重勝に入れる</span>${st.w5.races.map((R, i) => `<button type="button" class="w5sbtn${R.form ? ' has' : ''}" data-w5push="${i + 1}" aria-label="5重勝の${i + 1}レース目に入れる">${W5MARK[i]}</button>`).join('')}<span class="small muted">（5重勝の対象レースのとき）</span></div>`;
  h += `<div class="row" style="margin-top:4px"><button class="btn primary" type="button" id="copyAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>全文コピー</button>
    ${st.w5edit || (NATIVE_APP && Reserve()) ? '' : `<button class="btn primary" type="button" id="saveJudge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>${st.bets.has(J.id) ? '判定と結果を上書き保存' : '判定と結果を保存'}</button>`}</div>
    ${st.w5edit ? `<p class="small muted" style="margin:0">5重勝のレースは、ここでは保存しないよ。5重勝タブで5レースまとめて記録してね。</p>` : NATIVE_APP && Reserve() ? '<p class="small muted" style="margin:0">買い目は下の「買い目」で予約するよ（結果は記録タブで入れるよ）。</p>' : st.form.example ? '<p class="small muted" style="margin:0">入力例は保存できないよ。本番のレースを入れてね。</p>' : '<p class="small muted" style="margin:0">' + (st.bets.has(J.id) ? '記録タブに保存済み。' : '') + '下の「結果・収支の記録」に入れた着順・購入額・回収額も一緒に保存するよ。結果がまだなら空のままでOK（結果待ちで保存）。</p>'}<div data-k="savemsg" data-id="${esc(J.id || '')}" hidden></div></div>
    <details class="full"><summary>全STEPを表示（STEP0〜T3）</summary><pre class="out" id="outText">${esc(buildText(J))}</pre></details>`;
  box.innerHTML = h;
  $('#copyAll').addEventListener('click', ev => copyText(buildText(J), ev.currentTarget, $('#outText')));
  const om = $('#omakaseBtn'); if (om) om.addEventListener('click', () => omakase(J));
  const sj = $('#saveJudge'); if (sj) sj.addEventListener('click', () => { const box = $('#recCard .recf'); if (box) saveRecf(box, sj); else toast('先に判定に必要な項目を入れてね'); });
  for (const el of $$('[data-k=savemsg]', box)) paintSaveMsg(el);
}


function buildText(J) {
  const S = J.S, c = J.c, x = J.x, k = c.kubun, K = S.k[k], sep = '━━━━━━━━━━━━', o = [];
  const n3All = Object.values(S.k).reduce((s, q) => s + q.n3, 0);
  const refL = J.isOi ? null : `【参考判定】${J.venue}${x.r}R／参考値はすべて${J.mother}${S.n}走（3着${n3All}走）の実測`;
  const arrow = s => String(s || '').replace(/[-－ー‐ｰ\s]+/g, '→');
  const so = (v, cb) => v == null ? '読取不可' : (cb ? arrow(cb) + ' / ' : '') + fmt(v) + '倍';
  
  o.push(sep); if (refL) o.push(refL);
  if (J.motherN !== 1) o.push(`マザーデータ：${J.mother}（集計対象${S.n}走）`);
  o.push(`開催場：${J.venue || '—'}`);
  o.push(`レース：${x.r}R　／　出走頭数：${x.n}頭　／　距離：${x.dist}m（${J.surface}）　／　馬場状態：${x.baba}`);
  if (J.surface === '芝' && J.builtin) o.push('※芝レース（アプリに入っているデータはダートのレースだけ）');
  if (J.horses.length) { o.push('|人気|番号|記号|単勝|'); J.horses.forEach(hh => o.push(`|${hh.rank}|${hh.no}|${hh.sym}|${fmt(hh.tan)}|`)); }
  else o.push(`単勝1位：${fmt(x.tan1)}倍（全頭のオッズ一覧なし）`);
  o.push(`3連単1位：${J.s1combo ? arrow(J.s1combo) + ' / ' : ''}${fmt(x.s1)}倍`);
  o.push(`3連単5位：${so(J.s5, J.s5combo)}`); o.push(`3連単10位：${so(J.s10, J.s10combo)}`);
  if (J.warnN) o.push('※' + J.warnN);
  if (J.excluded) o.push('※基盤データ収録済みのため、このレース自身を除外して参考値を再計算（自己参照の除外）');
  o.push(sep, '');
  
  o.push(sep, '■STEP1　超大穴帯注意', `3連単5位：${J.s5 == null ? '読取不可' : fmt(J.s5) + '倍'}　3連単10位：${J.s10 == null ? '読取不可' : fmt(J.s10) + '倍'}`, `超大穴帯注意（J〜L出走 かつ 5位≥40.0）：${J.chuui}`, `旧見送り条件（記録用）：${J.oldSkip}`, sep, '');
  
  o.push(sep, '■STEP2　姫ゲート層判定', `単勝1位：${fmt(x.tan1)}倍　3連単1位：${fmt(x.s1)}倍　比：${c.hi.toFixed(1)}`, `馬場：${x.baba}`, `判定：【${T.LAYER_LABEL[c.L]}】`, `根拠：${condText(J)}`, `入口：${entryText(J)}`);
  if (c.L === 'C') o.push(`比区分：${c.c20}　※記録用・判定には使わない`);
  o.push(sep, '');
  
  o.push(sep, '■STEP2-1　序盤Rフィルター（C層のみ）', `層：${c.L}層`, `レース番号：${x.r}R`, `判定：${c.L !== 'C' ? '—（固定）' : c.early ? '【ゲート閉（序盤R）】' : '【通過】'}`);
  if (c.early) o.push(`本来の帯：${c.honrai}　※記録用・表示のみ`);
  o.push(sep, '');
  
  const g1 = c.hi >= 10 && x.n >= 9, g2 = c.hi >= 10 && x.n >= 14;
  o.push(sep, '■STEP2-2　大穴フィルター（C層のみ）', `対象：${c.L !== 'C' ? `${c.L}層は実行せず（固定）` : c.early ? '序盤Rのため実行せず' : 'C層で序盤R通過'}`);
  if (c.L === 'C' && !c.early) o.push(`比：${c.hi.toFixed(1)}　頭数：${x.n}頭`, `第1段階（比≥10.0 かつ 頭数≥9）：${g1 ? '作動' : '不作動'}`, `第2段階（比≥10.0 かつ 頭数≥14）：${g2 ? '作動' : '不作動'}`);
  o.push(`判定：${c.L !== 'C' ? '—（固定）' : '【' + bandName(k) + '】'}`, sep, '');
  
  o.push(sep, '■STEP3　役割ゾーン候補', `区分：${({ A: 'A層（固定）', B: 'B層（固定）', C0: c.early ? 'C層・非該当（序盤R）' : 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}`);
  J.set.forEach((z, i) => o.push(`第${i + 1}：${z.label}${z.prov ? '　※暫定・同一ゾーン例外' : ''}`));
  if (T.isCustom(k)) o.push('※カスタム買い目（設定タブで変更）。参考値もこの買い目で計算');
  o.push(sep, '');
  
  o.push(sep, '■STEP4　テンゲルⅢ　馬単 最終判定');
  if (refL) o.push(`【参考判定】${J.venue}${x.r}R／参考値はすべて${J.mother}${S.n}走の実測`);
  o.push(`レース：${x.r}R（距離${x.dist}m／馬場${x.baba}／${x.n}頭）`);
  o.push(`超大穴帯注意：【${J.chuui}】　旧見送り条件（記録用）：【${J.oldSkip}】`);
  o.push(`層：${c.L}層（比${c.hi.toFixed(1)}）` + (c.L === 'C' ? `　比区分：${c.c20}　※記録用` : ''));
  o.push(`入口：${c.L === 'A' ? 'A層固定' : c.L === 'B' ? 'B層固定' : `C層（序盤R：${c.early ? 'ゲート閉' : '通過'}${c.early ? '' : ' → 大穴フィルター：' + bandName(k)}）`}`);
  if (c.early) o.push(`本来の帯：${c.honrai}　※記録用`);
  o.push('', '①役割ゾーンごとの番号');
  const line = (z, lab) => { const hn = hideNote(J, z); if (hn) return `　${lab}＝${hn}`; if (!J.horses.length) return `　${lab}＝（オッズ一覧なし）`; const ns = J.nums[z]; return `　${lab}＝${ns.length ? ns.join('・') : '該当なし'}${(z === '大穴' || z === '超大穴') && ns.length ? (J.fukuUsed(z) ? '　※複勝オッズ昇順' + (J.horses.some(hh => hh.zone === z && hh.fukuRange) ? '（幅表示は下限で比較）' : '') : '　※単勝オッズ昇順（複勝なし）') : ''}`; };
  o.push(line('人気', '人気(A.B.C)'), line('中穴', '中穴(D.E.F)'), line('大穴', '大穴(G.H.I)'), line('超大穴', '超大穴(J.K.L)'));
  o.push(`　対象外：単勝13番人気以降${J.outside.length ? '（' + J.outside.join('・') + '）' : ''}`);
  o.push('', '②推奨買い目ゾーン');
  J.set.forEach((z, i) => { o.push(`　第${i + 1}　${z.label}${z.prov ? '　※暫定・同一ゾーン例外' : ''}`, `　　理由：${reasonOf(k, z)}`, `　　参考的中率：${refZone(J, i)}`); });
  o.push('　※参考的中率＝その区分でそのゾーンが実際に出た割合（掛け算はしていない）');
  const ht = T.hantei(K);
  o.push('', '③レース判定', `　区分：${c.L}層 × ${bandName(k)}`, K.n >= 5 ? `　人気→人気率：${pct(K.nn, K.n)}（n=${K.n}）　穴絡み率：${pct(K.ana, K.n)}（n=${K.n}）` : `　人気→人気率・穴絡み率：データ不足（n=${K.n}）`, `　判定：${ht.mark}${K.n < 5 ? '※データ不足' : ''}`, '　※払戻データ未取得のため、人気→人気の出現率を代理指標としています');
  o.push('', '④旧本線（記録用・買い目ではない）', `　${oldLineText(J)}`);
  if (c.L === 'C' && c.c20 === '比20以上' && (k === 'C1' || k === 'C2')) o.push('', `観測メモ：1着超大穴を観測中（${S.c20['比20以上'].sup1}/${S.c20['比20以上'].n}）※判定・ゾーンには使わない`);
  o.push(sep, '');
  
  o.push(sep, '■STEP T1　3着区分の確認', `区分：【${({ A: 'A層', B: 'B層', C0: 'C層・非該当（序盤R）', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}】`, `判定：${J.third ? '【3着2本へ】' : '【3着：見送り】'}`, sep, '');
  
  if (!J.third) {
    o.push(sep, `■STEP T3　3連単3着：見送り（${({ A: 'A層', B: 'B層', C0: 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}）`, `理由：${T.isCustom(k) ? 'この区分の買い目に3着を決めていないため（設定タブ）' : c.early ? 'C層の序盤R（1〜3R）のため' : 'C層で大穴フィルターが不作動のため'}`, sep);
  } else {
    const cus = T.isCustom(k);
    o.push(sep, '■STEP T3　テンゲルⅢ　3連単3着 最終判定');
    if (refL) o.push(`【参考判定】${J.venue}${x.r}R／参考値はすべて${J.mother}${n3All}走の実測`);
    o.push(`レース：${x.r}R（距離${x.dist}m／馬場${x.baba}／${x.n}頭）`, `区分：【${({ A: 'A層', B: 'B層', C0: 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}】（比${c.hi.toFixed(1)}／${x.n}頭）`, '', '①3着ゾーンの番号');
    const tl = { 人気: '人気(A.B.C)', 中穴: '中穴(D.E.F)', 大穴: '大穴(G.H.I)', 超大穴: '超大穴(J.K.L)' };
    t3show(k).forEach(z => { const ns = J.horses.length ? (J.nums[z].join('・') || '該当なし') : '（オッズ一覧なし）'; o.push(`　${tl[z]}＝${ns}${z === '人気' ? '　※1・2着に使った人気馬は除いて読む' : ''}${(z === '大穴' || z === '超大穴') && J.horses.length ? (J.fukuUsed(z) ? '　※複勝オッズ昇順' : '　※単勝オッズ昇順') : ''}`); });
    o.push('', cus ? '②馬単ゾーンごとの3着' : '②馬単ゾーンごとの3着2本');
    J.set.forEach((z, i) => {
      const tz = J.third[i] || [];
      if (!tz.length) { o.push(`　馬単 第${i + 1}（${z.label}）の3着：見送り（馬単だけ）`); return; }
      const p = T.THIRD_PROV[k] && T.THIRD_PROV[k][i];
      o.push(`　馬単 第${i + 1}（${z.label}）の3着：${tz.join('・')}${p ? '　※暫定' : ''}`, `　　参考的中率：${ref3(J, i)}${tz.includes('人気') ? '※人気は配当低めになりやすい' : ''}`, `　　馬単的中時の3着：${K.tri3[i]}/${K.hit3n[i]}`);
    });
    o.push('', '③3連単の形（ゾーンのみ・組番は作らない）');
    J.set.forEach((z, i) => { const tz = J.third[i] || []; o.push(`　第${i + 1}：${z.label}→${tz.length ? '（' + tz.join('・') + '）' : '（3着見送り）'}`); });
    o.push(`　3連単ゾーン的中：${pct(K.triTot, K.n3)}（${T.KUBUN_LABEL[k].replace('（固定）', '')}／${K.triTot}/${K.n3}）　馬単的中時の3着的中率：${pct(K.triTot, K.hitIn3)}（${K.triTot}/${K.hitIn3}）`);
    o.push('', `④3着判定：3着【${cus ? t3show(k).join('・') : ({ A: '人気・中穴', B: '人気・大穴', C1: '大穴帯', C2: '超大穴帯' })[k]}】`, '　※払戻データ未取得のため、回収率は未計算です', sep);
  }
  return o.join('\n');
}

async function copyText(text, btn, pre) {
  try { await navigator.clipboard.writeText(text); toast('コピーしたよ'); }
  catch {
    if (pre) { const d = pre.closest('details'); if (d) d.open = true; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('コピーできなかったので文章を選択したよ。長押しでコピーしてね', 3600);
  }
}

function omakase(J) {
  const hp = {};
  const some = all => { const a = all.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } const s = a.slice(0, 1 + Math.floor(Math.random() * all.length)); return all.filter(n => s.includes(n)); };
  J.set.forEach(z => { const key = setKey(z), zk = {}; for (const side of ['a', 'b', 't']) { const all = hpAll(J, key, side); if (!all.length) continue; const s = some(all); if (s.length < all.length) zk[side] = s; } if (Object.keys(zk).length) hp[key] = zk; });
  st.form.hp = Object.keys(hp).length ? hp : null; storeSet('tengel.form', st.form); renderResult();
  toast('🎲 テンゲルにお任せで選んだよ（押すたびに変わるよ・自分で直してもOK）', 3000);
}


function sideRanks(J, i, side) {
  const C = CRate(), z = J.set[i], key = setKey(z), all = hpAll(J, key, side), sel = hpSel(st.form.hp, key, side, all);
  const names = side === 'a' ? z.a : side === 'b' ? z.b.join('／') : ((J.third && J.third[i]) || []).join('・');
  if (!names) return null;
  return sel.length === all.length ? C.zoneRanks(names) : C.ranksOf(J.horses, sel);
}
function customPctHTML(J, i) {
  const C = CRate(); if (!C || !J.horses.length || st.w5edit) return '';
  const a = sideRanks(J, i, 'a'), b = sideRanks(J, i, 'b'), t = sideRanks(J, i, 't');
  const r = C.rate(st.derived, J.c.kubun, { a, b, t }, J.excludedId);
  if (r.n < C.MIN_N) return `<div class="zref">選んだ馬で：データ不足（n=${r.n}）</div>`;
  const key = setKey(J.set[i]), allSel = ['a', 'b', 't'].every(side => { const all = hpAll(J, key, side); return hpSel(st.form.hp, key, side, all).length === all.length; });

}


const RSV_DEF_TYPES = J => ['馬単'].concat(J.third && J.third.some(t => t && t.length) ? ['3連単'] : []);
function rsvDraftOf(J) {
  const id = J.id || '_';
  if (!st.rsvDraft[id]) {
    
    const rs = (st.bets.get(id) || {}).rsv, keys = J.set.map(setKey);
    const d = rs && Array.isArray(rs.types) && rs.types.length ? { types: BET_TYPES.filter(t => rs.types.includes(t) && !typeLocked(t)), off: Array.isArray(rs.zones) ? keys.filter(k => !rs.zones.includes(k)) : [] } : { types: RSV_DEF_TYPES(J).filter(t => !typeLocked(t)), off: [] };
    if (!d.types.length) d.types = ['馬単'];
    if (st.betState !== 'on') return d;   
    st.rsvDraft[id] = d;
  }
  if (!st.rsvDraft[id].types.length) st.rsvDraft[id].types = ['馬単'];
  return st.rsvDraft[id];
}
function zoneSides(J) {   
  return J.set.map((z, i) => { const key = setKey(z), sel = side => hpSel(st.form.hp, key, side, hpAll(J, key, side)); return { key, label: z.label, a: sel('a'), b: sel('b'), t: J.third && J.third[i] && J.third[i].length ? sel('t') : null }; });
}
function rsvBuild(J, d) { const zs = zoneSides(J).filter(z => !d.off.includes(z.key)); return { zones: zs.map(z => z.key), bets: Reserve().build(zs, d.types, +J.x.n || J.maxNo) }; }

    const cs = list.map(c => { const k = c.join('-'), hit = !!(per && per.hit.some(h => h.join('-') === k)), ref = !!(per && per.refund.some(h => h.join('-') === k)); return `<span class="${hit ? 'hitc' : ref ? 'refc' : ''}">${R.label(t, c)}</span>`; }).join('　');

  }).join('');
  return `<div class="betlist">${rows}</div><div class="rsvnote">合計 ${total}点${total ? `（1点100円なら ${yen(total * 100)}円）` : ''}</div>`;

async function reserveRace(J, giveUp) {
  if (!st.db) return toast(st.dbState === 'connecting' ? 'まだデータに接続中だよ。数秒待ってもう一度押してね' : 'データに接続できないよ', 3600);
  if (st.form.example) return toast('入力例は予約できないよ。本番のレースを入れてね');
  const id = J.id; if (!id) return toast('日付とレース番号を入れてね');
  const prev = st.bets.get(id) || null;
  if (prev && prev.rsv && prev.rsv.state === 'done') return toast('結果を記録したレースは上書きしないよ（記録タブで直してね）', 3600);
  const R = Reserve(), d = rsvDraftOf(J), now = new Date().toISOString(), f = st.form;
  const key = [f.date, (f.rname || '').trim(), f.dist, f.start].join('|');
  let rsv, fields;
  if (giveUp) {
    rsv = { state: 'given', at: now, key, start: f.start || '' };
    fields = { types: [], amt: {}, stake: null, payout: null, other: '', buyZ: [], p1: null, p2: null, p3: null, n1: null, n2: null, n3: null };
  } else {
    if (!J.horses.length) return toast('買い目を作るには馬番（オッズの一覧）が必要だよ', 3200);
    const built = rsvBuild(J, d), total = R.count(built.bets);
    if (!total) return toast('買い目が1つもないよ。券種とゾーン・馬を選んでね', 3200);
    rsv = { state: 'reserved', at: now, key, start: f.start || '', types: d.types.slice(), zones: built.zones, bets: built.bets, points: total, hp: f.hp || null };
    const amt = {}; d.types.forEach(t => { amt[t] = { stake: (built.bets[t] || []).length * 100, payout: null }; });
    fields = { types: d.types.slice(), amt, stake: total * 100, payout: null, other: '', buyZ: built.zones, p1: null, p2: null, p3: null, n1: null, n2: null, n3: null };
  }
  const doc = { ...raceBase(J), judgeText: buildText(J), ...fields, rsv, note: prev ? (prev.note || '') : '', updatedAt: now };
  try {
    await writeBet(id, prev ? doc : { ...doc, createdAt: now }, !prev);
    countMission({ ...doc, id });

  async function makeBackup(auto) {
    const bets = Array.from(TengelLocal.mem.bets.values());
    const zones = await TengelLocal.getSetting('zones').catch(() => undefined);
    const meta = await TengelLocal.motherMeta().catch(() => null);
    const data = { app: 'tengel3', appVer: APP_VER, at: new Date().toISOString(), bets, settings: { zones: zones === undefined ? null : zones } };
    if (meta && meta.source !== 'app') data.mother = { meta, rows: L().rows(1) };
    else { const add = L().rows(1).filter(r => r && r.src); if (add.length) data.motherAdd = add; }   
    data.slots = { names: L().names(), active: L().active(), data: {} };
    [2, 3].forEach(n => { const doc = L().doc(n); if (doc && doc.rows && doc.rows.length) data.slots.data[n] = doc; });
    if (auto && window.TengelWallet) { const w = window.TengelWallet.snapshot(); if (w) data.wallet = w; }
    return { data, zones, nSlots: Object.keys(data.slots.data).length };

  async function restoreFromData(d) {
    const list = Array.isArray(d) ? d : d && d.bets;
    if (!Array.isArray(list)) throw new Error('テンゲルのバックアップじゃないみたい');
    const cur = TengelLocal.mem.bets;
    const add = list.filter(b => { if (!b || !b.id) return false; const o = cur.get(b.id); return !o || String(b.updatedAt || '') >= String(o.updatedAt || ''); });
    await TengelLocal.putBets(add);
    const msg = [`記録${add.length}件を戻したよ（同じレースは新しい方を残したよ）`];
    if (d.settings && Object.prototype.hasOwnProperty.call(d.settings, 'zones')) {
      document.dispatchEvent(new CustomEvent('tengel:zones', { detail: d.settings.zones }));
      msg.push(d.settings.zones ? '買い目の設定も戻したよ' : '買い目は初期の設定にしたよ');
    }
    const last = rs => rs.reduce((m, r) => r.date > m ? r.date : m, '');
    
    if (d.wallet && d.auto && window.TengelWallet) {
      const w = window.TengelWallet;
      if (w.isEmpty()) { const ok = await w.restore(d.wallet).catch(() => false); if (ok) msg.push(`ポイント（${w.total().toLocaleString('ja-JP')}P）も戻したよ`); }
    }
    if (d.slots) {
      for (const n of [1, 2, 3]) if (d.slots.names && d.slots.names[n]) await L().rename(n, d.slots.names[n]);
      for (const n of [2, 3]) {
        const doc = d.slots.data && d.slots.data[n]; if (!doc || !Array.isArray(doc.rows) || !doc.rows.length) continue;
        if (slotLocked(n)) { msg.push(`「${L().names()[n]}」の枠は解放していないので、そのデータは入れなかったよ`); continue; }
        const cur = L().rows(n), bl = last(doc.rows), cl = last(cur);
        if (!cur.length || bl > cl || (bl === cl && doc.rows.length > cur.length)) { await L().replace(n, doc.rows, { source: doc.source || 'excel', file: doc.file || '' }); msg.push(`「${L().names()[n]}」のデータ${doc.rows.length}走も戻したよ`); }
      }
    }
    if (Array.isArray(d.motherAdd) && d.motherAdd.length) {
      const have = new Set(L().rows(1).map(r => r.id));
      const add = d.motherAdd.filter(r => r && r.id && r.date && r.r && !have.has(r.id));
      if (add.length) { await L().upsert(1, add); msg.push(`「${L().names()[1]}」に、自分で入れたレース${add.length}走も戻したよ`); }
    }
    if (d.mother && Array.isArray(d.mother.rows) && d.mother.rows.length) {
      const curRows = L().rows(1);
      const bl = last(d.mother.rows), cl = last(curRows);
      if (bl > cl || (bl === cl && d.mother.rows.length > curRows.length)) {
        await TengelLocal.replaceRaces(d.mother.rows, { source: (d.mother.meta && d.mother.meta.source) || 'excel', file: (d.mother.meta && d.mother.meta.file) || '' });
        msg.push(`「${L().names()[1]}」のデータも${d.mother.rows.length}走に戻したよ`);
      }
    }
    return msg;
  }

      g.className = 'splash'; g.innerHTML = `<div class="glogo">テンゲル<em>Ⅲ</em></div><p class="gline">${esc(GATE.short)}</p><p class="gtap">タップでとばせるよ</p>`;
      const t = setTimeout(gateClose, 2000);
      g.addEventListener('click', () => { clearTimeout(t); gateClose(); }, { once: true });
    }
  }
  function gateClose() {
    const g = $('#gate'); if (!g || g.hidden) return;
    const done = () => { g.hidden = true; g.innerHTML = ''; g.className = ''; document.documentElement.classList.remove('gateon'); lockZoom(false); try { document.dispatchEvent(new CustomEvent('tengel:gate')); } catch (e) {   } };
    if (reduced()) return done();
    g.classList.add('fade'); setTimeout(done, 380);
  }
  
  function aboutGate() {
    const ab = $('#setAbout'); if (!ab || $('#abGate')) return;
    const d = document.createElement('details'); d.id = 'abGate';
    d.innerHTML = `<summary>はじめに（競馬の注意・アプリの注意・楽しみ方）</summary><div><h3>競馬の注意</h3><ul>${GATE.keiba.map(t => `<li>${esc(t)}</li>`).join('')}</ul><h3>アプリの注意</h3><ul>${GATE.app.map(t => `<li>${esc(t)}</li>`).join('')}</ul><h3>テンゲルの楽しみ方</h3><ul>${GATE.fun.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
    const first = ab.querySelector('details'); if (first) ab.insertBefore(d, first); else ab.appendChild(d);
  }

  
  let resolveReady; const walletReady = new Promise(r => { resolveReady = r; });
  async function boot() {
    gateOpen();
    cards();
    try {
      await TL.ready;
      const doc = await TL.getMeta('wallet').catch(() => null);
      W = normalize(doc);
      if (!doc) await save();
    } catch (e) { W = normalize(null); }
    resolveReady();
    paintAll();
    try { await giftCheck(); } catch (e) {   }
    pullTransactions().catch(() => {});
    refreshSubStatus().catch(() => {});
  }
  window.TengelWallet = {
    on: true, ready: walletReady, COST: P.COST,
    balance: () => B(), total, events: () => (W ? W.events.slice() : []), countedN,
    readCharge, countRace, unlocked, typeLocked, slotUnlocked, unlock, claim, goSettings, lockZoom, gateOpen, gateClose,
    
    snapshot: () => (W ? JSON.parse(JSON.stringify(W)) : null),
    restore: async snap => { await walletReady; if (!snap || !Array.isArray(snap.events)) return false; const cur = W.events.length; W = normalize(snap); await save(); await giftCheck().catch(() => {}); return W.events.length !== cur; },
    
    isEmpty: () => !W || (!W.events.some(e => e.id !== 'gift-first') && !W.paid.length && !Object.keys(W.counted).length)
  };
  document.addEventListener('tengel:slots', () => { if (W) { paintCustom(); } });
  document.addEventListener('tengel:tab', e => { if (e.detail === 'set' && W) { paintAll(); aboutGate(); } });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setTimeout(aboutGate, 50);
})();

</script>
</body></html>
