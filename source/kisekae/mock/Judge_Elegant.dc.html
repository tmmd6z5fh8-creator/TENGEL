<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>判定画面・綺麗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&amp;family=Shippori+Mincho+B1:wght@600;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.ph{--bg:#100B0C;--ink:#F2E6E2;--sub:#C4A3A6;--card:#1A1214;--cardB:1px solid #4A1A20;--cardO:0 solid transparent;--cardS:inset 0 0 0 3px #1A1214,inset 0 0 0 4px #2E1418;--radius:4px;--rs:2px;--font:"Zen Kaku Gothic New";--dfont:"Shippori Mincho B1";--dw:800;--logo:#F4ECE8;--logoS:none;--iii:#E0303F;--iiiB:0 solid transparent;--iiiR:0;--hd:#0B0708;--hdInk:#F4ECE8;--mBg:transparent;--mLine:#C1121F;--mInk:#F4ECE8;--pill:rgba(193,18,31,.12);--pillLine:#7A1A24;--pillInk:#F2D6D6;--coin:#C1121F;--coinInk:#FFFFFF;--badge:#240A0F;--badgeInk:#FF5A67;--badgeB:1px solid #7A1A24;--tagBg:transparent;--tagInk:#E9CFCF;--tagLine:#5C1A20;--warnBg:#3A0E14;--warnInk:#FF9A9A;--znBg:transparent;--znInk:#FF6B77;--znB:1px solid #7A1A24;--znR:2px;--acc:#FF6B77;--nR:3px;--w2B:1.5px solid #9A8A8C;--sep:1px solid #3A1A20;--btn:#C1121F;--btnInk:#FFFFFF;--btnB:0 solid transparent;--btnR:2px;--btnS:none;--btn2:transparent;--btn2Ink:#F4ECE8;--btn2B:1px solid #C1121F;--tab:#0B0708;--tabB:1px solid #3A1A20;--tabInk:#9C8286;--tabOn:transparent;--tabOnInk:#FF6B77;--tabR:0}
.ph{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(ellipse at 50% 30%,#2A0A10,rgba(16,11,12,0) 65%);color:var(--ink);font-family:var(--font),sans-serif;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd{position:relative;z-index:2;flex:none;padding:10px 16px 12px;background:var(--hd);color:var(--hdInk);border-bottom:1px solid #C1121F;box-shadow:0 3px 0 -1px #0B0708,0 4px 0 -1px #7A1A24}
.hd-r1{display:flex;align-items:center;justify-content:space-between;height:42px}
.logo{display:flex;align-items:center;font-family:var(--dfont),serif;font-weight:var(--dw);font-size:26px;line-height:1;letter-spacing:.08em;color:var(--logo);text-shadow:var(--logoS)}
.iii{display:inline-flex;gap:3px;margin-left:4px}
.iii i{display:block;width:4.5px;height:21px;background:var(--iii);border:var(--iiiB);border-radius:var(--iiiR)}
.mbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--mLine);background:var(--mBg);color:var(--mInk);font-family:var(--dfont),serif;font-weight:600;font-size:14px;cursor:pointer}
.mbtn svg{width:18px;height:18px}
.hd-r2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--pill);border:1px solid var(--pillLine);color:var(--pillInk);font-weight:500;font-size:12.5px;white-space:nowrap}
.coin{width:17px;height:17px;border-radius:50%;background:var(--coin);color:var(--coinInk);display:inline-flex;align-items:center;justify-content:center;font:900 10px/1 "BIZ UDPGothic",sans-serif}
.gdot{width:8px;height:8px;border-radius:50%;background:#3CCB84;flex:none}
.bnr{flex:none;display:block;width:390px;height:160px;object-fit:cover;margin-top:4px}
.ct{flex:1;min-height:0;overflow:hidden;padding:14px 14px 0;display:flex;flex-direction:column;gap:12px}
.card{position:relative;flex:none;background:var(--card);border:var(--cardB);outline:var(--cardO);outline-offset:-7px;border-radius:var(--radius);box-shadow:var(--cardS);padding:16px}
.rose{position:absolute;top:10px;right:12px;width:30px;height:30px}
.vh{display:flex;gap:12px;align-items:flex-start}
.lb{flex:none;width:66px;height:80px;border-radius:var(--rs);background:var(--badge);color:var(--badgeInk);border:var(--badgeB);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lb b{font-family:var(--dfont),serif;font-weight:var(--dw);font-size:42px;line-height:1}
.lb small{font-family:var(--dfont),serif;font-size:12px;font-weight:600;margin-top:4px;color:#E9CFCF}
.vi{min-width:0;flex:1;padding-right:26px}
.vt{font-family:var(--dfont),serif;font-weight:var(--dw);font-size:20px;line-height:1.25;letter-spacing:.04em;margin:0;color:var(--ink)}
.vs{font-size:12px;line-height:1.6;color:var(--sub);margin:5px 0 8px}
.vs b{color:var(--ink);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:2px;font-size:11.5px;font-weight:500;background:var(--tagBg);color:var(--tagInk);border:1px solid var(--tagLine)}
.tag.warn{background:var(--warnBg);color:var(--warnInk);border-color:transparent}
.zs{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.z{border-top:1px solid #3A1A20;padding:12px 2px 4px}
.zh{display:flex;align-items:center;gap:10px}
.zn{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;border-radius:var(--znR);background:var(--znBg);color:var(--znInk);border:var(--znB);font-family:var(--dfont),serif;font-size:12px;font-weight:800;letter-spacing:.06em}
.zf{font-family:var(--dfont),serif;font-weight:var(--dw);font-size:19px;line-height:1.2;letter-spacing:.06em;color:var(--ink)}
.zf em{font-style:normal;color:var(--acc);padding:0 4px}
.nums{display:flex;align-items:center;gap:5px;margin-top:9px}
.ar{color:var(--acc);font-weight:700;padding:0 3px}
.zr{font-size:12px;line-height:1.5;color:var(--sub);margin-top:8px}
.zr b{color:var(--ink);font-size:13px}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:var(--nR);font:700 15px/1 "BIZ UDPGothic",sans-serif}
.w1{background:#FFFFFF;color:#1F1F1F;border:1.5px solid #9AA0A6}
.w2{background:#222222;color:#FFFFFF;border:var(--w2B)}
.w4{background:#1F5FC9;color:#FFFFFF}
.w5{background:#F3C316;color:#1F1F1F}
.w6{background:#1E8E3E;color:#FFFFFF}
.w7{background:#F08A1C;color:#1F1F1F}
.third{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:12px;border-top:var(--sep)}
.tl{font-family:var(--dfont),serif;font-size:13.5px;font-weight:800;color:var(--ink)}
.tl small{display:block;font-family:var(--font),sans-serif;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px}
.third .nums{margin-top:0;gap:4px}
.third .n{min-width:26px;height:26px;font-size:13px}
.sl{color:var(--sub);font-weight:700;padding:0 2px}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--btnR);border:var(--btnB);background:var(--btn);color:var(--btnInk);box-shadow:var(--btnS);font-family:var(--dfont),serif;font-weight:800;font-size:14px;letter-spacing:.06em;cursor:pointer}
.btn.sub{background:var(--btn2);color:var(--btn2Ink);border:var(--btn2B);box-shadow:none}
.btn svg{width:17px;height:17px}
.tb{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 6px 22px;background:var(--tab);border-top:var(--tabB)}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;margin:0;border:0;background:transparent;color:var(--tabInk);font-family:var(--font),sans-serif;font-size:10.5px;font-weight:500;border-radius:var(--tabR);cursor:pointer;white-space:nowrap}
.tb button.on{background:var(--tabOn);color:var(--tabOnInk);box-shadow:inset 0 -2px 0 #E0303F;font-weight:700}
.tb svg{width:23px;height:23px}
</style>
</helmet>
<div class="ph">

  <main class="ct">
    <section class="card">
      <svg class="rose" viewBox="0 0 30 30" aria-hidden="true"><path d="M8 26 C10 22 12 20 15 19" fill="none" stroke="#2F4A2C" stroke-width="1.6" stroke-linecap="round"></path><path d="M9 24 C5 24 3 21 4 19 C7 19 9 21 9 24 Z" fill="#2F4A2C"></path><circle cx="17" cy="12" r="8.5" fill="#A30F1A"></circle><path d="M12 13 A5 5 0 1 1 20 16" fill="none" stroke="#5E0710" stroke-width="1.5" stroke-linecap="round"></path><path d="M15 12 A2.6 2.6 0 1 1 19 13.5" fill="none" stroke="#5E0710" stroke-width="1.4" stroke-linecap="round"></path><path d="M11 8 A7 7 0 0 1 22 6.5" fill="none" stroke="#E0303F" stroke-width="1.1" stroke-linecap="round"></path></svg>

          <p class="vs">比 <b>8.8</b>（3連単1位 18.5 ÷ 単勝1位 2.1）・12頭・1400m ダ・良</p>
          <div class="tags"><span class="tag">マザー：マザーデータ1</span><span class="tag warn">【薄】</span></div>
        </div>
      </div>
      <ol class="zs">
        <li class="z">
          <div class="zh"><span class="zn">第1</span><span class="zf">人気<em>→</em>人気</span></div>
          <div class="nums"><span class="n w5">6</span><span class="n w2">2</span><span class="n w7">10</span><span class="ar">→</span><span class="n w5">6</span><span class="n w2">2</span><span class="n w7">10</span></div>

        </li>

          <div class="zr">参考的中率 <b>20.7%</b>（A層での実測／n=164）</div>
        </li>
      </ol>
      <div class="third">
        <div class="tl">3着：人気・中穴<small>2本で84.1%</small></div>
        <div class="nums"><span class="n w5">6</span><span class="n w2">2</span><span class="n w7">10</span><span class="sl">／</span><span class="n w6">7</span><span class="n w1">1</span><span class="n w4">4</span></div>
      </div>
      <div class="acts">
        <button class="btn sub" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="1"></rect><path d="M5 15.5V5.5a1.5 1.5 0 0 1 1.5-1.5H15"></path></svg>全文コピー</button>
        <button class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h11l3 3v12H5z"></path><path d="M8 4.5v5h7v-5M8 19.5v-5h8v5"></path></svg>判定と結果を保存</button>
      </div>
    </section>
  </main>
  <nav class="tb" aria-label="タブ">

    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h8l4 4v13h-12z"></path><path d="M14.5 3.5v4h4M9.5 12h6M9.5 16h6"></path></svg>記録</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7.5 16.5v-4M12 16.5V7.5M16.5 16.5v-6.5"></path></svg>実測・回収</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.5v2.6M12 17.9v2.6M3.5 12h2.6M17.9 12h2.6M6 6l1.8 1.8M16.2 16.2 18 18M6 18l1.8-1.8M16.2 7.8 18 6"></path></svg>設定</button>
