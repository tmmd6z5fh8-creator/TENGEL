<!doctype html>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&amp;family=Shippori+Mincho+B1:wght@600;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.ph{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#060203;color:#F3E7E5;font-family:"Zen Kaku Gothic New",sans-serif;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wall{position:absolute;left:0;top:0;width:390px;height:844px;object-fit:cover;z-index:0}
.shade{position:absolute;left:0;top:0;width:390px;height:844px;z-index:0;background:linear-gradient(180deg,rgba(5,1,2,.6) 0,rgba(5,1,2,0) 17%,rgba(5,1,2,0) 36%,rgba(5,1,2,.38) 46%,rgba(5,1,2,.72) 100%)}
.hd{position:relative;z-index:2;flex:none;padding:10px 16px 12px;background:rgba(6,2,3,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(224,48,63,.85);box-shadow:0 1px 14px rgba(224,48,63,.35)}
.hd-r1{display:flex;align-items:center;justify-content:space-between;height:42px}
.logo{display:flex;align-items:center;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:26px;line-height:1;letter-spacing:.08em;color:#F4ECE8;text-shadow:0 0 12px rgba(0,0,0,.6)}
.iii{display:inline-flex;gap:3px;margin-left:4px}
.iii i{display:block;width:4.5px;height:21px;background:#E0303F;box-shadow:0 0 8px rgba(255,40,50,.7)}
.mbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:1px solid #C1121F;background:rgba(10,3,4,.4);color:#F4ECE8;font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:14px;cursor:pointer}
.mbtn svg{width:18px;height:18px}
.hd-r2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:rgba(20,6,8,.62);border:1px solid rgba(224,48,63,.55);color:#F2D6D6;font-weight:500;font-size:12.5px;white-space:nowrap}
.coin{width:17px;height:17px;border-radius:50%;background:#C1121F;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font:900 10px/1 "BIZ UDPGothic",sans-serif;box-shadow:0 0 6px rgba(255,40,50,.6)}
.gdot{width:8px;height:8px;border-radius:50%;background:#3CCB84;flex:none}
.hero{position:relative;z-index:1;flex:none;height:236px}
.ct{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden;padding:12px 14px 0}
.card{position:relative;background:rgba(12,5,7,.8);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1);border:1px solid rgba(193,18,31,.8);border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 24px rgba(193,18,31,.3);padding:15px}
.vh{display:flex;gap:12px;align-items:flex-start}

.vi{min-width:0;flex:1}
.vt{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:.04em;margin:0;color:#F4ECE8}
.vs{font-size:12px;line-height:1.6;color:#C9A9AC;margin:5px 0 8px}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:2px;font-size:11.5px;font-weight:500;background:rgba(10,3,4,.5);color:#E9CFCF;border:1px solid #5C1A20}
.tag.warn{background:rgba(120,10,20,.5);color:#FFA3A3;border-color:transparent}
.zs{list-style:none;margin:13px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.z{border-top:1px solid rgba(122,26,36,.85);padding:11px 2px 4px}
.zh{display:flex;align-items:center;gap:10px}
.zn{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;border-radius:2px;color:#FF6B77;border:1px solid #7A1A24;font-family:"Shippori Mincho B1",serif;font-size:12px;font-weight:800;letter-spacing:.06em}
.zf{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px;line-height:1.2;letter-spacing:.06em;color:#F4ECE8}
.zf em{font-style:normal;color:#FF4A55;padding:0 4px;text-shadow:0 0 8px rgba(255,40,50,.6)}
.nums{display:flex;align-items:center;gap:5px;margin-top:9px}
.ar{color:#FF4A55;font-weight:700;padding:0 3px}
.zr{font-size:12px;line-height:1.5;color:#C9A9AC;margin-top:8px}
.zr b{color:#F4ECE8;font-size:13px}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:3px;font:700 15px/1 "BIZ UDPGothic",sans-serif}
.w1{background:#FFFFFF;color:#1F1F1F;border:1.5px solid #9AA0A6}
.w2{background:#222222;color:#FFFFFF;border:1.5px solid #9A8A8C}
.w4{background:#1F5FC9;color:#FFFFFF}
.w5{background:#F3C316;color:#1F1F1F}
.w6{background:#1E8E3E;color:#FFFFFF}
.w7{background:#F08A1C;color:#1F1F1F}
.third{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:11px;border-top:1px solid rgba(122,26,36,.85)}
.tl{font-family:"Shippori Mincho B1",serif;font-size:13.5px;font-weight:800;color:#F4ECE8}
.tl small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;font-weight:400;color:#C9A9AC;margin-top:2px}
.third .nums{margin-top:0;gap:4px}
.third .n{min-width:26px;height:26px;font-size:13px}
.sl{color:#C9A9AC;font-weight:700;padding:0 2px}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:2px;border:0;background:linear-gradient(180deg,#D8182A,#8E0B16);color:#FFFFFF;box-shadow:0 0 16px rgba(224,24,42,.4);font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:14px;letter-spacing:.06em;cursor:pointer}
.btn.sub{background:rgba(10,3,4,.5);color:#F4ECE8;border:1px solid #C1121F;box-shadow:none}
.btn svg{width:17px;height:17px}
.tb{position:absolute;left:0;right:0;bottom:0;z-index:3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 6px 22px;background:rgba(6,2,3,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(224,48,63,.6)}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;margin:0;border:0;background:transparent;color:#A68A8E;font-family:"Zen Kaku Gothic New",sans-serif;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.tb button.on{color:#FF5A66;font-weight:700;box-shadow:inset 0 -2px 0 #E0303F}
.tb svg{width:23px;height:23px}
.tb button.on svg{filter:drop-shadow(0 0 5px rgba(255,40,50,.7))}

        </li>
      </ol>

      <div class="acts">

  </main>
