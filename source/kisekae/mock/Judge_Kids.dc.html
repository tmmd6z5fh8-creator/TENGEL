<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>判定画面・子供向け</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&amp;family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.ph{--bg:#FBFAF6;--ink:#4E3520;--sub:#7E6248;--card:#FFFDF8;--cardB:2px solid #E8D9B5;--cardO:2px dashed #C9A27A;--cardS:0 3px 0 #EFE4CB;--radius:20px;--rs:16px;--font:"Zen Maru Gothic";--dfont:"Mochiy Pop One";--dw:400;--logo:#5B3A1E;--logoS:0 2px 0 #FFFFFF,2px 0 0 #FFFFFF,-2px 0 0 #FFFFFF,0 -2px 0 #FFFFFF,1.5px 1.5px 0 #FFFFFF,-1.5px 1.5px 0 #FFFFFF,1.5px -1.5px 0 #FFFFFF,-1.5px -1.5px 0 #FFFFFF;--iii:#F7A8C0;--iiiB:1.5px solid #8A5A35;--iiiR:3px;--hdInk:#5B3A1E;--mBg:#FFFFFF;--mLine:#B88A5A;--mInk:#5B3A1E;--pill:#FFFFFF;--pillLine:#D9B98A;--pillInk:#6B4A2B;--coin:#FFD966;--coinInk:#5B3A1E;--badge:#FFF1A8;--badgeInk:#6B4A2B;--badgeB:2px dashed #C9A27A;--tagBg:#FFFFFF;--tagInk:#6B4A2B;--tagLine:#E0CBA0;--warnBg:#FFE3D6;--warnInk:#A0461A;--zBg:#FFFBEA;--zB:2px dashed #DCC496;--znBg:#A9DCF3;--znInk:#24465A;--znB:1.5px dashed #5E8FAA;--znR:8px;--acc:#7A4A22;--nR:9px;--w2B:0 solid transparent;--sep:2px dashed #E0CBA0;--btn:#FFE58A;--btnInk:#5B3A1E;--btnB:2px dashed #B88A5A;--btnR:14px;--btnS:0 3px 0 #E8CF6A;--btn2:#FFFFFF;--btn2Ink:#5B3A1E;--btn2B:2px dashed #C9A27A;--tab:#FBFAF6;--tabB:2px dashed #D9B98A;--tabInk:#8E7458;--tabOn:#FFF1A8;--tabOnInk:#5B3A1E;--tabR:14px}
.ph{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(rgba(201,162,122,.16) 1px,transparent 1.4px);background-size:7px 7px;color:var(--ink);font-family:var(--font),sans-serif;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd{position:relative;z-index:2;flex:none;padding:10px 16px 14px;background:#FFF3B8 url(/_blob/6656b0f19559a587df356e2178631b83) 0 0/12px 10px repeat;color:var(--hdInk);border-bottom:3px solid #E8D9B5}
.hd::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;border-top:2px dashed #B88A5A}
.hd-r1{display:flex;align-items:center;justify-content:space-between;height:42px}
.logo{display:flex;align-items:center;font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:25px;line-height:1;color:var(--logo);text-shadow:var(--logoS)}
.iii{display:inline-flex;gap:3px;margin-left:6px}
.iii i{display:block;width:6.5px;height:21px;background:var(--iii);border:var(--iiiB);border-radius:var(--iiiR)}
.mbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:2px dashed var(--mLine);background:var(--mBg);color:var(--mInk);font-family:var(--font),sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.mbtn svg{width:18px;height:18px}
.hd-r2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--pill);border:1.5px solid var(--pillLine);color:var(--pillInk);font-weight:700;font-size:12.5px;white-space:nowrap}
.coin{width:17px;height:17px;border-radius:50%;background:var(--coin);color:var(--coinInk);border:1px solid #B88A5A;display:inline-flex;align-items:center;justify-content:center;font:900 10px/1 "BIZ UDPGothic",sans-serif}
.gdot{width:8px;height:8px;border-radius:50%;background:#3CCB84;flex:none}
.bnr{flex:none;display:block;width:390px;height:160px;object-fit:cover}
.ct{flex:1;min-height:0;overflow:hidden;padding:14px 14px 0;display:flex;flex-direction:column;gap:12px}
.card{position:relative;flex:none;background:var(--card);border:var(--cardB);outline:var(--cardO);outline-offset:-7px;border-radius:var(--radius);box-shadow:var(--cardS);padding:14px 15px}
.felt{position:absolute;top:-12px;right:14px;width:40px;height:40px}
.vh{display:flex;gap:12px;align-items:flex-start}
.lb{flex:none;width:66px;height:80px;border-radius:var(--rs);background:var(--badge);color:var(--badgeInk);border:var(--badgeB);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lb b{font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:38px;line-height:1}
.lb small{font-size:12px;font-weight:700;margin-top:4px}
.vi{min-width:0;flex:1;padding-right:18px}
.vt{font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:19px;line-height:1.25;margin:0;color:var(--ink)}
.vs{font-size:12px;line-height:1.55;color:var(--sub);margin:4px 0 7px}
.vs b{color:var(--ink);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--tagBg);color:var(--tagInk);border:1.5px solid var(--tagLine)}
.tag.warn{background:var(--warnBg);color:var(--warnInk);border-color:transparent}
.zs{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.z{background:var(--zBg);border:var(--zB);border-radius:var(--rs);padding:10px 12px}
.zh{display:flex;align-items:center;gap:10px}
.zn{display:inline-flex;align-items:center;justify-content:center;height:23px;padding:0 9px;border-radius:var(--znR);background:var(--znBg);color:var(--znInk);border:var(--znB);font-size:12px;font-weight:700}
.zn.p2{background:#FFD1DC;color:#6B2A3A;border-color:#C9768A}
.zf{font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:17px;line-height:1.2;color:var(--acc)}
.nums{display:flex;align-items:center;gap:5px;margin-top:8px}
.ar{color:var(--sub);font-weight:700;padding:0 3px}
.zr{font-size:12px;line-height:1.5;color:var(--sub);margin-top:7px}
.zr b{color:var(--ink);font-size:13px}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:var(--nR);font:700 15px/1 "BIZ UDPGothic",sans-serif}
.w1{background:#FFFFFF;color:#1F1F1F;border:1.5px solid #9AA0A6}
.w2{background:#222222;color:#FFFFFF;border:var(--w2B)}
.w4{background:#1F5FC9;color:#FFFFFF}
.w5{background:#F3C316;color:#1F1F1F}
.w6{background:#1E8E3E;color:#FFFFFF}
.w7{background:#F08A1C;color:#1F1F1F}
.third{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:11px;border-top:var(--sep)}
.tl{font-size:13px;font-weight:700;color:var(--ink)}
.tl small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:2px}
.third .nums{margin-top:0;gap:4px}
.third .n{min-width:26px;height:26px;font-size:13px}
.sl{color:var(--sub);font-weight:700;padding:0 2px}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--btnR);border:var(--btnB);background:var(--btn);color:var(--btnInk);box-shadow:var(--btnS);font-family:var(--font),sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.btn.sub{background:var(--btn2);color:var(--btn2Ink);border:var(--btn2B);box-shadow:none}
.btn svg{width:17px;height:17px}
.tb{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 6px 22px;background:var(--tab);border-top:var(--tabB)}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;margin:0;border:0;background:transparent;color:var(--tabInk);font-family:var(--font),sans-serif;font-size:10.5px;font-weight:700;border-radius:var(--tabR);cursor:pointer;white-space:nowrap}
.tb button.on{background:var(--tabOn);color:var(--tabOnInk);outline:1.5px dashed #B88A5A;outline-offset:-3px}
.tb svg{width:23px;height:23px}
</style>
</helmet>
<div class="ph">
  <header class="hd">
    <div class="hd-r1">
      <div class="logo">テンゲル<span class="sr">Ⅲ</span><span class="iii" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <button class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h6a2.5 2.5 0 0 1 2.5 2.5v11a2 2 0 0 0-2-2H3.5z"></path><path d="M20.5 5.5h-6A2.5 2.5 0 0 0 12 8v11a2 2 0 0 1 2-2h6.5z"></path></svg>説明書</button>
    </div>
    <div class="hd-r2">
      <span class="pill"><span class="coin">P</span>1,100 P</span>
      <span class="pill"><span class="gdot"></span>マザーデータ1 290走・記録 0件</span>
    </div>
  </header>
  <img class="bnr" src="/_blob/e945e568f65a819f860a9a16e13beefa" alt="毛糸の編み目の背景に、ぬいぐるみの馬と手をふるロボット、毛糸玉のイラスト">
  <main class="ct">
    <section class="card">
      <svg class="felt" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L24.8 14 L36.6 14.6 L27.4 22 L30.6 33.6 L20 27 L9.4 33.6 L12.6 22 L3.4 14.6 L15.2 14 Z" fill="#FFD966" stroke="#8A5A35" stroke-width="1.8" stroke-linejoin="round"></path><path d="M20 8.5 L23.4 16.2 L31.6 16.7 L25.2 21.8 L27.4 29.8 L20 25.2 L12.6 29.8 L14.8 21.8 L8.4 16.7 L16.6 16.2 Z" fill="none" stroke="#8A5A35" stroke-width="1.2" stroke-dasharray="2.4 2" stroke-linejoin="round"></path></svg>
      <div class="vh">
        <div class="lb"><b>A</b><small>堅</small></div>
        <div class="vi">
          <h2 class="vt">9R　A層（固定）</h2>
          <p class="vs">比 <b>8.8</b>（3連単1位 18.5 ÷ 単勝1位 2.1）・12頭・1400m ダ・良</p>
          <div class="tags"><span class="tag">マザー：マザーデータ1</span><span class="tag warn">【薄】</span></div>
        </div>
      </div>
      <ol class="zs">
        <li class="z">
          <div class="zh"><span class="zn">第1</span><span class="zf">人気 → 人気</span></div>
          <div class="nums"><span class="n w5">6</span><span class="n w2">2</span><span class="n w7">10</span><span class="ar">→</span><span class="n w5">6</span><span class="n w2">2</span><span class="n w7">10</span></div>
          <div class="zr">参考的中率 <b>56.1%</b>（A層での実測／n=164）</div>
        </li>
        <li class="z">
          <div class="zh"><span class="zn p2">第2</span><span class="zf">人気 → 中穴</span></div>
          <div class="nums"><span class="n w5">6</span><span class="n w2">2</span><span class="n w7">10</span><span class="ar">→</span><span class="n w6">7</span><span class="n w1">1</span><span class="n w4">4</span></div>
          <div class="zr">参考的中率 <b>20.7%</b>（A層での実測／n=164）</div>
        </li>
      </ol>
      <div class="third">
        <div class="tl">3着：人気・中穴<small>2本で84.1%</small></div>
        <div class="nums"><span class="n w5">6</span><span class="n w2">2</span><span class="n w7">10</span><span class="sl">／</span><span class="n w6">7</span><span class="n w1">1</span><span class="n w4">4</span></div>
      </div>
      <div class="acts">
        <button class="btn sub" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2.5"></rect><path d="M5 15.5V5.5a1.5 1.5 0 0 1 1.5-1.5H15"></path></svg>全文コピー</button>
        <button class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h11l3 3v12H5z"></path><path d="M8 4.5v5h7v-5M8 19.5v-5h8v5"></path></svg>判定と結果を保存</button>
      </div>
    </section>
  </main>
  <nav class="tb" aria-label="タブ">
    <button type="button" class="on" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"></path></svg>判定</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7h17v3a2 2 0 0 0 0 4v3h-17v-3a2 2 0 0 0 0-4z"></path><path d="M14.5 7.5v9" stroke-dasharray="1.6 2"></path></svg>単勝5連予想</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h8l4 4v13h-12z"></path><path d="M14.5 3.5v4h4M9.5 12h6M9.5 16h6"></path></svg>記録</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7.5 16.5v-4M12 16.5V7.5M16.5 16.5v-6.5"></path></svg>実測・回収</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.5v2.6M12 17.9v2.6M3.5 12h2.6M17.9 12h2.6M6 6l1.8 1.8M16.2 16.2 18 18M6 18l1.8-1.8M16.2 7.8 18 6"></path></svg>設定</button>
  </nav>
</div>
