<style>
body{margin:0}
*{box-sizing:border-box}
.ph{--bg:#F3F8E6;--ink:#2B3A18;--sub:#5A6A42;--card:#FFFFFF;--cardB:2px solid #CFE6A8;--cardO:0 solid transparent;--cardS:0 3px 0 #DCEBC0;--radius:18px;--rs:14px;--font:"Zen Maru Gothic";--dfont:"Zen Maru Gothic";--dw:900;--logo:#24470C;--logoS:0 2px 0 rgba(255,255,255,.55);--iii:#8A5A2B;--iiiB:0 solid transparent;--iiiR:2px;--hd:linear-gradient(180deg,#A9DA5E,#86C23C);--hdInk:#24470C;--mBg:#FFF9E6;--mLine:#A8743F;--mInk:#5A3A1A;--pill:#FFF9E6;--pillLine:#E4D3A8;--pillInk:#5A3A1A;--coin:#FFD84A;--coinInk:#5A3A1A;--badge:#E5F4CC;--badgeInk:#3D7A16;--badgeB:2px solid #CFE6A8;--tagBg:#F7FBEF;--tagInk:#3D5A1E;--tagLine:#CFE6A8;--warnBg:#FFE9D6;--warnInk:#A0461A;--zBg:#F7FBEF;--zB:1.5px solid #DDEDC0;--znBg:#A8743F;--znInk:#FFF8E8;--znB:0 solid transparent;--znR:4px;--acc:#2F6A12;--nR:8px;--w2B:0 solid transparent;--sep:2px dotted #CFE6A8;--btn:#3E7B1E;--btnInk:#FFFFFF;--btnB:0 solid transparent;--btnR:14px;--btnS:0 3px 0 #2A5A10;--btn2:#FFFFFF;--btn2Ink:#3E7B1E;--btn2B:2px solid #A9D46A;--tab:#FFFBEA;--tabB:4px solid #A8743F;--tabInk:#7A6A4F;--tabOn:#DDF0BC;--tabOnInk:#2F6A12;--tabR:14px}
.ph{--pushA:#E8382F;--pushB:#A51A12;--pushC:#FF9A8A;--rim:#F6E7B8;--rimD:#B98A3A;--bFrame:#8A5A2B;--bFace:#FFFDF5;--bInk:#3A2414;--hitRed:#E8382F;--ray:rgba(255,236,170,.55);
  --pushFace:radial-gradient(72% 40% at 50% 14%,rgba(255,255,255,.9),rgba(255,255,255,.3) 58%,rgba(255,255,255,0) 100%),linear-gradient(180deg,var(--pushC) 0%,var(--pushA) 40%,var(--pushB) 86%,#5E0A05 100%)}
.ph{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(#E1EFC4 1.6px,transparent 2px);background-size:18px 18px;color:var(--ink);font-family:var(--font),sans-serif;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd{position:relative;z-index:2;flex:none;padding:10px 16px 12px;background:var(--hd);color:var(--hdInk);border-bottom:4px solid #A8743F}
.hd-r1{display:flex;align-items:center;justify-content:space-between;height:42px}
.logo{display:flex;align-items:center;font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:26px;line-height:1;color:var(--logo);text-shadow:var(--logoS)}
.iii{display:inline-flex;gap:3px;margin-left:6px}

.mbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--mLine);background:var(--mBg);color:var(--mInk);font-family:var(--font),sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.mbtn svg{width:18px;height:18px}
.bnr{flex:none;display:block;width:390px;height:120px;object-fit:cover;object-position:50% 70%}
.ct{flex:1;min-height:0;overflow:hidden;padding:14px 14px 0}
.card{position:relative;background:var(--card);border:var(--cardB);border-radius:var(--radius);box-shadow:var(--cardS);padding:14px}
.ch{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--sub)}
.rh{display:flex;align-items:baseline;gap:10px}
.rk{font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:22px;color:var(--ink)}
.rs{font-size:12px;color:var(--sub)}
.lab{margin:12px 0 6px;font-size:12px;font-weight:700;color:var(--sub)}
.fin{display:flex;align-items:center;gap:8px}
.fin span.k{font-size:12px;font-weight:700;color:var(--sub)}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:var(--nR);font:700 15px/1 "BIZ UDPGothic",sans-serif}
.w1{background:#FFFFFF;color:#1F1F1F;border:1.5px solid #9AA0A6}
.w2{background:#222222;color:#FFFFFF}
.w4{background:#1F5FC9;color:#FFFFFF}
.w5{background:#F3C316;color:#1F1F1F}
.w6{background:#1E8E3E;color:#FFFFFF}
.w7{background:#F08A1C;color:#1F1F1F}
.ar{color:var(--sub);font-weight:700;padding:0 2px}
.bets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bets li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);background:var(--zBg);border:var(--zB)}
.bt{flex:none;min-width:46px;height:24px;padding:0 8px;border-radius:999px;background:var(--znBg);color:var(--znInk);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.bc{display:flex;align-items:center;gap:3px;flex:1}

.pay{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 12px;border-radius:var(--rs);border:1.5px dashed var(--tagLine);font-size:13px;font-weight:700;color:var(--ink)}
.pay b{font-size:17px}
.rec{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:14px;border:0;border-radius:var(--btnR);background:var(--btn);color:var(--btnInk);box-shadow:var(--btnS);font-family:var(--font),sans-serif;font-weight:800;font-size:17px;cursor:pointer}
.rec svg{width:20px;height:20px}

/* ---------- 重ねる画面 ---------- */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(24,14,4,.62);animation:fadeIn .25s ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* PUSHボタン（横長の長方形・角は丸い） */
.pbox{position:relative;display:flex;flex-direction:column;align-items:center}
.push{--pr:26px;position:relative;z-index:2;width:200px;height:100px;border-radius:var(--pr);border:0;padding:0;cursor:pointer;background:var(--pushFace);
  box-shadow:inset 0 -9px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.55),0 0 0 8px var(--rim),0 0 0 13px var(--rimD),0 10px 0 13px #6E4E1A,0 22px 34px rgba(0,0,0,.5);
  animation:bob .9s ease-in-out infinite,popIn .35s cubic-bezier(.2,1.6,.4,1) both}
.push span{position:relative;font:400 40px/1 "Dela Gothic One",sans-serif;color:#FFFFFF;letter-spacing:.04em;text-shadow:0 3px 0 var(--pushB),0 0 14px rgba(255,255,255,.55)}
.push::after{content:"";position:absolute;inset:-18px;border-radius:calc(var(--pr) + 18px);border:3px solid rgba(255,232,150,.95);animation:ring 1.2s ease-out infinite}
.pshadow{width:200px;height:22px;margin-top:22px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px);animation:shad .9s ease-in-out infinite}
.tap{margin:16px 0 0;font:400 20px/1 "Dela Gothic One",sans-serif;color:#FFF3C8;letter-spacing:.1em;animation:blink 1s steps(2) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes shad{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.72);opacity:.3}}
@keyframes ring{0%{transform:scale(.88);opacity:.95}100%{transform:scale(1.4);opacity:0}}
@keyframes popIn{from{scale:.2}to{scale:1}}
@keyframes blink{0%{opacity:1}100%{opacity:.35}}
@keyframes raysIn{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@keyframes spin{to{rotate:360deg}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* 買い目の行は0.15秒おき（--i＝何行目か）。合計と「とじる」は最後の行のあと（--n＝行の数。3行より少なくても3行ぶん待つ） */
.ov .brows li{animation:rowIn .35s ease-out both;animation-delay:calc(var(--t0) + var(--i) * .15s)}
.ov .btot{animation:rowIn .35s ease-out both;animation-delay:calc(var(--t0) + max(var(--n), 3) * .15s)}
.ov .close{animation-delay:calc(var(--t0) + max(var(--n), 3) * .15s + var(--tc))}
/* 押したあと（PUSHがあった所から光ってはじける） */
.pressed{position:absolute;z-index:3;left:50%;top:calc(50% - 40px);width:200px;height:100px;margin:-50px 0 0 -100px;border-radius:26px;background:var(--pushFace);
  box-shadow:0 0 0 8px var(--rim),0 0 0 13px var(--rimD);animation:press .45s ease-in both}
@keyframes press{0%{transform:scale(1)}35%{transform:scale(.82);filter:brightness(1.4)}100%{transform:scale(1.9);opacity:0;filter:brightness(3)}}
/* 結果のボード（壁紙のテーマのボード・boards.py）を入れる箱：この箱が動く（下から出る・落ちてくる・炎の中からドン）。馬は出さない */
.hb{position:absolute;z-index:6;left:50%;top:196px;width:350px;margin-left:-175px}
.close{position:absolute;z-index:8;left:50%;bottom:64px;transform:translateX(-50%);height:46px;padding:0 34px;border-radius:999px;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);color:#FFFFFF;font-family:var(--font),sans-serif;font-weight:800;font-size:15px;cursor:pointer;animation:fadeUp .4s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
/* 紙ふぶき */
.conf{position:absolute;inset:0;z-index:7;pointer-events:none}
.conf i{position:absolute;left:var(--x);top:-30px;width:var(--w);height:var(--h);background:var(--c);border-radius:2px;opacity:0;animation:fall var(--t) linear var(--d) infinite}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(900px) rotate(var(--r))}}
/* 視差効果を減らす：上下・回転・広がる光・紙ふぶきを止めて、ボードはふわっと出す */
@media (prefers-reduced-motion:reduce){.push,.pshadow,.push::after,.halo b,.tap,.conf i,.rays,.rbow,.ring,.glow,.spk b{animation:none!important}.conf,.pressed,.push::after{display:none}.hb{animation:fadeIn .5s ease-out .2s both!important}}

/* ---------- 的中：あたたかい光 → ボードが下から出る ---------- */
.rays{position:absolute;z-index:4;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;
  background:repeating-conic-gradient(var(--ray) 0 7deg,transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0 18%,transparent 62%);mask-image:radial-gradient(circle,#000 0 18%,transparent 62%);
  animation:raysIn .6s ease-out .2s both,spin 22s linear infinite}
.hit .hb{animation:riseUp .7s cubic-bezier(.2,1.35,.4,1) .3s both}
@keyframes riseUp{from{transform:translateY(720px)}to{transform:translateY(0)}}
.hit .bh{animation:pop .5s cubic-bezier(.2,1.8,.4,1) .95s both}
.hit{--t0:1.15s;--tc:.2s}
.ph{--bg:#0A1B22;--ink:#E8F0F1;--sub:#A6BEC3;--card:linear-gradient(160deg,#153B47,#10303A);--cardB:1px solid rgba(217,180,90,.42);--cardO:1px solid rgba(217,180,90,.14);--cardS:0 18px 40px rgba(0,0,0,.38);--radius:16px;--rs:12px;--font:"BIZ UDPGothic";--dfont:"Dela Gothic One";--dw:400;--logo:#E9C873;--logoS:none;--iii:#D9B45A;--iiiB:0 solid transparent;--iiiR:1px;--hd:#0A1B22;--hdInk:#E8F0F1;--hdB:1px solid rgba(217,180,90,.20);--mBg:rgba(217,180,90,.08);--mLine:rgba(217,180,90,.42);--mInk:#F4DC96;--pill:rgba(217,180,90,.08);--pillLine:rgba(217,180,90,.42);--pillInk:#F4DC96;--coin:linear-gradient(180deg,#FBE9B0,#D9B45A);--coinInk:#0A1B22;--badge:linear-gradient(145deg,#17414D,#0E2932);--badgeInk:#F4DC96;--badgeB:1px solid rgba(217,180,90,.42);--tagBg:rgba(217,180,90,.08);--tagInk:#F4DC96;--tagLine:rgba(217,180,90,.42);--warnBg:rgba(243,169,95,.14);--warnInk:#F3A95F;--zBg:#0D242D;--zB:1px solid rgba(217,180,90,.20);--znBg:linear-gradient(180deg,#FBE9B0,#D9B45A);--znInk:#0A1B22;--znB:0 solid transparent;--znR:6px;--znS:none;--acc:#F4DC96;--nR:7px;--w2B:1.5px solid #6F8C93;--sep:1px solid rgba(217,180,90,.20);--btn:linear-gradient(180deg,#FBE9B0,#D9B45A);--btnInk:#0A1B22;--btnB:0 solid transparent;--btnR:12px;--btnS:0 6px 16px rgba(0,0,0,.35);--btn2:rgba(217,180,90,.08);--btn2Ink:#F4DC96;--btn2B:1px solid rgba(217,180,90,.42);--tab:#0A1B22;--tabB:1px solid rgba(217,180,90,.20);--tabInk:#A6BEC3;--tabOn:rgba(217,180,90,.14);--tabOnInk:#F4DC96;--tabR:12px;--sel:#D9B45A;--selInk:#0A1B22;--h1:#F4DC96;--pageInk:#E8F0F1;--pageSub:#A6BEC3;--pageAcc:#F4DC96}
.ph{background-image:radial-gradient(70% 28% at 50% 12%,rgba(92,202,214,.13),transparent 70%),repeating-linear-gradient(90deg,rgba(217,180,90,.045) 0 1px,transparent 1px 36px)}
.ph .logo{background:linear-gradient(180deg,#FBE9B0 0%,#E2BF66 46%,#A47A2C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph .bnr{border-bottom:1px solid rgba(217,180,90,.42)}
.ph .ch{color:#D9B45A;letter-spacing:.14em}
.ph .lb{box-shadow:inset 0 1px 0 rgba(244,220,150,.22)}
.ph .seg{color:#A6BEC3}
.ph .bnr{height:160px;object-position:50% 50%}
.ph .hd{border-bottom:var(--hdB)}

/* ---------- マスター帯の的中ボタン：テンゲルのアイコンのPUSHが 緑の雷を まとう（まさちゃんの指定） ----------
   ボタンは アプリのアイコンのような 正方形（156px・角の丸み35）：テンゲルのアイコン（盾のエンブレム）・下の TENGER の所に 金の「PUSH」。
   金の細いふち・紺のふち・金のふち・こい金の厚み・まわりに 緑の光。緑の雷が ボタンを まく（ぎざぎざの輪2本・外へ のびる枝・角を こえて 面に かかる いなずま）：
   形が 0.07秒ごとに かわって ビリビリ・火花が 外へ とぶ。上下の動きは的中と同じ。
   押すと ぎゅっと ちぢんで ふくらみ（強く光らせない）、緑の いなずまが まわりへ ほとばしり（2回 ちらっ）、緑と白の 火花・緑の 光の輪が 2重に広がる */
.tg{--pr:35px;--pushA:#E9C873;--pushB:#0A1B22;--pushC:#F4DC96;--rim:#E9C873;--rimD:#0A1B22;--pushFace:#0A1C23}
.push.tg{width:156px;height:156px;box-shadow:0 0 0 2px #E9C873,0 0 0 4.5px #0A1B22,0 0 0 6px #B48A3A,0 7px 0 6px #6E5216,0 8.5px 0 6px #0A1B22,
  0 0 22px 8px rgba(38,255,130,.42),0 0 54px 18px rgba(38,255,130,.2),0 22px 34px rgba(0,0,0,.5)}
.push.tg span{color:transparent;text-shadow:none}
.push.tg::after{border-color:rgba(107,255,174,.9)}
.pshadow.tg{width:156px}
.tg .tgf{position:absolute;left:0;top:0;width:156px;height:156px;border-radius:35px;overflow:hidden;pointer-events:none;font-style:normal}
.tg .tgf svg{display:block;width:156px;height:156px}
.tg .tgd{position:absolute;left:-50px;top:-50px;width:256px;height:256px;pointer-events:none;z-index:3;font-style:normal}
.tg .tgd svg{display:block;width:256px;height:256px;overflow:visible}
.tg .tgV{visibility:hidden;animation:tgV0 .28s step-end infinite}
.tg .tgV1{animation-name:tgV1}.tg .tgV2{animation-name:tgV2}.tg .tgV3{animation-name:tgV3}
@keyframes tgV0{0%{visibility:visible}25%,100%{visibility:hidden}}
@keyframes tgV1{0%{visibility:hidden}25%{visibility:visible}50%,100%{visibility:hidden}}
@keyframes tgV2{0%{visibility:hidden}50%{visibility:visible}75%,100%{visibility:hidden}}
@keyframes tgV3{0%{visibility:hidden}75%{visibility:visible}100%{visibility:visible}}
.tg .tgH{animation:tgH 1.4s ease-in-out infinite alternate}
@keyframes tgH{from{opacity:.14}to{opacity:.32}}
.tg .tgs{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:tgS 1.7s ease-out infinite}
@keyframes tgS{0%{opacity:0;transform:translate(0,0) scale(1)}6%{opacity:1}40%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.tap.tg{color:#F4DC96;text-shadow:0 2px 0 #0A1B22,0 0 12px rgba(38,255,130,.85)}
.pressed.tg{width:156px;height:156px;margin:-78px 0 0 -78px;border-radius:35px;background:#0A1C23;box-shadow:0 0 0 2px #E9C873,0 0 0 4.5px #0A1B22,0 0 0 6px #B48A3A,0 7px 0 6px #6E5216,0 0 22px 8px rgba(38,255,130,.42);animation-name:tgPress}
@keyframes tgPress{0%{transform:scale(1)}22%{transform:scale(.92)}45%{transform:scale(1.06)}100%{transform:scale(1.45);opacity:0}}   /* 強く光らせない */
.clips.tg{position:absolute;z-index:4;left:50%;top:calc(50% - 40px);width:0;height:0}
.clips.tg .tgb{position:absolute;left:-200px;top:-200px;width:400px;height:400px;overflow:visible;visibility:hidden;animation:tgBolt .5s step-end .06s both}
@keyframes tgBolt{0%{visibility:visible}16%{visibility:hidden}24%{visibility:visible}52%,100%{visibility:hidden}}
.clips.tg i{position:absolute;opacity:0;left:calc(var(--z) / -2);top:calc(var(--z) / -2);width:var(--z);height:var(--z);border-radius:50%;animation:tgFly 1.1s cubic-bezier(.15,.7,.3,1) calc(var(--d) + .08s) both}
.clips.tg .s{background:radial-gradient(circle,#F4FFF8 0 30%,rgba(107,255,174,.9) 50%,rgba(38,255,130,0) 72%)}
.clips.tg .w{background:radial-gradient(circle,#FFFFFF 0 35%,rgba(244,255,248,.6) 55%,rgba(244,255,248,0) 72%)}
.clips.tg .lf{left:-110px;top:-2px;width:220px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(107,255,174,0),#F4FFF8 50%,rgba(107,255,174,0));animation:tgLf .45s ease-out .06s both}
.clips.tg .ring{left:-80px;top:-80px;width:160px;height:160px;border-radius:50%;border:4px solid rgba(107,255,174,.9);box-shadow:0 0 18px rgba(38,255,130,.6);animation:tgRing .8s ease-out .1s forwards}
.clips.tg .ring.b{border-width:2.5px;animation-delay:.26s}
@keyframes tgFly{0%{opacity:0;transform:translate(0,0) scale(.4)}10%{opacity:1}60%{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}100%{opacity:0;transform:translate(calc(var(--x) * 1.1),calc(var(--y) + 40px)) scale(.6)}}
@keyframes tgLf{0%{opacity:0;transform:scaleX(.1)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.3)}}
@keyframes tgRing{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.1)}}
@media (prefers-reduced-motion:reduce){.tg .tgV,.tg .tgH,.tg .tgs{animation:none}.tg .tgV1,.tg .tgV2,.tg .tgV3,.tg .tgs,.clips.tg{display:none}.tg .tgV0{visibility:visible}}

/* ===== 結果のボード（テーマの判定画面と同じ見た目・馬は出さない） =====
   ふち（.rb）＝テーマの背景のもよう → 上の帯（.hd）＝見出し → カード（.card）＝買い目。すみにテーマの飾り（.orn） */
.rb{position:relative;width:350px;padding:8px;border-radius:calc(var(--radius) + 8px);background-color:var(--bg);color:var(--ink);text-align:left;
  font-family:var(--font),"BIZ UDPGothic",sans-serif;-webkit-font-smoothing:antialiased;box-shadow:0 0 0 1.5px rgba(255,255,255,.6),0 18px 38px rgba(0,0,0,.45)}
.rb .hd{position:relative;z-index:1;display:block;flex:none;padding:13px 12px 14px;border-radius:var(--radius);background:var(--hd);color:var(--hdInk);border-bottom:var(--hdB);text-align:center}
.rb .bh{display:inline-block;max-width:100%;margin:0;font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:34px;line-height:1.12;color:var(--logo);text-shadow:var(--logoS);white-space:nowrap}
/* 見出しの大きさはそろえる（テーマのロゴの大きさの決まりより強く） */
.rb.rb .hd .bh{font-size:34px}
.rb.rb.miss .hd .bh,.rb.rb.fz .hd .bh{font-size:30px}
.rb .bh .bx3{margin-left:-.18em;letter-spacing:-.42em}
.rb .bsub{display:block;margin-top:6px;font-size:12.5px;font-weight:700;line-height:1.3;color:var(--hdInk);white-space:nowrap}
.rb .card{position:relative;flex:none;margin-top:9px;padding:13px 11px 12px;background:var(--card);border:var(--cardB);outline:var(--cardO);outline-offset:-7px;border-radius:var(--radius);box-shadow:var(--cardS)}
.rb .orn{position:absolute;top:-15px;right:12px;width:44px;height:44px;pointer-events:none;overflow:visible;z-index:2}
.rb .orn.o34{height:34px;top:-12px}
.rb .orn.o40{width:40px;height:40px;top:-13px}
.rb .brows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rb .brows li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:6px 8px;border-radius:var(--rs);background:var(--zBg);border:var(--zB);white-space:nowrap}
/* 払戻が長くて入らないときは、払戻だけ次の行へ（右によせる） */
.rb .bt{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:22px;padding:0 8px;border-radius:999px;background:var(--tagBg);color:var(--tagInk);border:1px solid var(--tagLine);font-size:11.5px;font-weight:800}
.rb .bc{display:flex;align-items:center;gap:2px;flex:none}
.rb .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border-radius:var(--nR);font:700 12.5px/1 "BIZ UDPGothic",sans-serif}
.rb .w1{background:#FFFFFF;color:#1F1F1F;border:1.5px solid #9AA0A6}
.rb .w2{background:#222222;color:#FFFFFF;border:var(--w2B)}
.rb .w3{background:#E0322B;color:#FFFFFF}
.rb .w4{background:#1F5FC9;color:#FFFFFF}
.rb .w5{background:#F3C316;color:#1F1F1F}
.rb .w6{background:#1E8E3E;color:#FFFFFF}
.rb .w7{background:#F08A1C;color:#1F1F1F}
.rb .w8{background:#F27BB0;color:#1F1F1F}
.rb .ar{color:var(--sub);font-weight:700;padding:0 1px}
.rb .by{font-size:11px;color:var(--sub)}
.rb .bp{margin-left:auto;font-size:14.5px;font-weight:800;color:var(--acc)}
.rb .btot{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:9px;border-top:var(--sep);font-size:12.5px;font-weight:700;color:var(--sub)}
.rb .btot b{font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:24px;line-height:1;color:var(--ink)}
/* ハズレ：見出しは上の帯の文字の色で静かに・払戻は0円（うすく） */
.rb.miss .bh{color:var(--hdInk);text-shadow:none}
.rb.miss .bp,.rb.miss .btot b{color:var(--sub)}
.rb.miss .bp{font-weight:700}
/* デカ的中：まわりが光る・見出しは虹色（黒いふち）・3連単の行は虹色のふち */
.rb.big{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 26px 6px rgba(255,236,160,.85),0 18px 38px rgba(0,0,0,.45)}
.rb.big .bh,.rb.fz .bh{background:linear-gradient(90deg,#FF3B3B,#FF9F1A,#FFD21A,#2DBB55,#1FA8E0,#4C6BFF,#B34CFF,#FF3BB8,#FF3B3B);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(1.5px 0 0 #1E1030) drop-shadow(-1.5px 0 0 #1E1030) drop-shadow(0 1.5px 0 #1E1030) drop-shadow(0 -1.5px 0 #1E1030) drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.rb.big .brows li.top,.rb.fz .brows li.top{position:relative;background:linear-gradient(var(--zBg),var(--zBg)) padding-box,linear-gradient(var(--rbFace),var(--rbFace)) padding-box,
  linear-gradient(90deg,#FF3B3B,#FFE53B,#3BE26A,#2FD6FF,#B34CFF,#FF3BB8) border-box;border:2px solid transparent;gap:2px 3px;padding:4px 5px}
/* ど的中・隠れど的中：枠は虹色（回さない）・炎に光る・見出しの下に帯（超大穴の馬／デカ的中が化けた） */
.rb.fz{padding:11px;box-shadow:0 0 0 3px #FFFFFF,0 0 28px 8px rgba(255,236,170,.9),0 0 64px 18px rgba(255,120,0,.6),0 12px 24px rgba(0,0,0,.35)}
.rb.fz::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:4px;pointer-events:none;
  background:conic-gradient(from 200deg,#FF3B3B,#FF9F1A,#FFE53B,#3BE26A,#2FD6FF,#4C6BFF,#B34CFF,#FF3BB8,#FF3B3B);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.rb.fz .brows li.top::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 70%) -130% 0/50% 100% no-repeat}
.rb.fz .btot b{background:linear-gradient(90deg,#FF3B3B,#FFE53B,#3BE26A,#2FD6FF,#B34CFF,#FF3BB8) 0 100%/100% 3px no-repeat;padding-bottom:4px}
.rb .zrib{display:flex;align-items:center;justify-content:center;gap:6px;width:max-content;max-width:100%;margin:8px auto 0;padding:3px 10px 3px 4px;border-radius:999px;background:#2A1259;color:#FFFFFF;
  font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 0 0 2px #FFFFFF,0 0 12px rgba(179,76,255,.7)}
.rb .zrib .zt{padding:3px 8px;border-radius:999px;background:linear-gradient(180deg,#FFF3B0,#FFC21A);color:#2A1259;font-weight:800;font-size:11.5px}
.rb .zrib .n{min-width:22px;height:22px;font-size:12px}
.rb .n.zx{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px #FF3BB8,0 0 10px 4px rgba(255,59,184,.6)}

.rb.t-tengel{--hdB:1px solid rgba(217,180,90,.20);--cardO:1px solid rgba(217,180,90,.14);--zBg:#0D242D;--zB:1px solid rgba(217,180,90,.20);--sep:1px solid rgba(217,180,90,.20);--rs:12px;--nR:7px;--w2B:1.5px solid #6F8C93;--tagBg:rgba(217,180,90,.08);--tagInk:#F4DC96;--tagLine:rgba(217,180,90,.42);--bg:#0A1B22;--ink:#E8F0F1;--sub:#A6BEC3;--card:linear-gradient(160deg,#153B47,#10303A);--cardB:1px solid rgba(217,180,90,.42);--cardS:0 18px 40px rgba(0,0,0,.38);--radius:16px;--font:"BIZ UDPGothic";--dfont:"Dela Gothic One";--dw:400;--logo:#E9C873;--logoS:none;--hd:#0A1B22;--hdInk:#E8F0F1;--acc:#F4DC96;--h1:#F4DC96;--coin:linear-gradient(180deg,#FBE9B0,#D9B45A);--coinInk:#0A1B22;--rbFace:#153B47}
