body{margin:0}

.ph{--pushA:#E8382F;--pushB:#A51A12;--pushC:#FF9A8A;--rim:#F6E7B8;--rimD:#B98A3A;--bFrame:#8A5A2B;--bFace:#FFFDF5;--bInk:#3A2414;--hitRed:#E8382F;--ray:rgba(255,236,170,.55);
  --pushFace:radial-gradient(72% 40% at 50% 14%,rgba(255,255,255,.9),rgba(255,255,255,.3) 58%,rgba(255,255,255,0) 100%),linear-gradient(180deg,var(--pushC) 0%,var(--pushA) 40%,var(--pushB) 86%,#5E0A05 100%)}

/* ---------- 重ねる画面 ---------- */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(24,14,4,.62);animation:fadeIn .25s ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* PUSHボタン（横長の長方形・角は丸い） */
.pbox{position:relative;display:flex;flex-direction:column;align-items:center}
.push{--pr:26px;position:relative;z-index:2;width:200px;height:100px;border-radius:var(--pr);border:0;padding:0;cursor:pointer;background:var(--pushFace);
  box-shadow:inset 0 -9px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.55),0 0 0 8px var(--rim),0 0 0 13px var(--rimD),0 10px 0 13px #6E4E1A,0 22px 34px rgba(0,0,0,.5);
  animation:bob .9s ease-in-out infinite,popIn .35s cubic-bezier(.2,1.6,.4,1) both}
.push span{position:relative;font:400 40px/1 "Dela Gothic One",sans-serif;color:#FFFFFF;letter-spacing:.04em;text-shadow:0 3px 0 var(--pushB),0 0 14px rgba(255,255,255,.55)}
.push::after{content:"";position:absolute;inset:-18px;border-radius:calc(var(--pr) + 18px);border:3px solid rgba(255,232,150,.95);animation:ring 1.2s ease-out infinite}
.pshadow{width:200px;height:22px;margin-top:22px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px);animation:shad .9s ease-in-out infinite}
.tap{margin:16px 0 0;font:400 20px/1 "Dela Gothic One",sans-serif;color:#FFF3C8;letter-spacing:.1em;animation:blink 1s steps(2) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes shad{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.72);opacity:.3}}
@keyframes ring{0%{transform:scale(.88);opacity:.95}100%{transform:scale(1.4);opacity:0}}
@keyframes popIn{from{scale:.2}to{scale:1}}
@keyframes blink{0%{opacity:1}100%{opacity:.35}}
@keyframes raysIn{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@keyframes spin{to{rotate:360deg}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* 買い目の行は0.15秒おき（--i＝何行目か）。合計と「とじる」は最後の行のあと（--n＝行の数。3行より少なくても3行ぶん待つ） */
.ov .brows li{animation:rowIn .35s ease-out both;animation-delay:calc(var(--t0) + var(--i) * .15s)}
.ov .btot{animation:rowIn .35s ease-out both;animation-delay:calc(var(--t0) + max(var(--n), 3) * .15s)}
.ov .close{animation-delay:calc(var(--t0) + max(var(--n), 3) * .15s + var(--tc))}
/* 押したあと（PUSHがあった所から光ってはじける） */
.pressed{position:absolute;z-index:3;left:50%;top:calc(50% - 40px);width:200px;height:100px;margin:-50px 0 0 -100px;border-radius:26px;background:var(--pushFace);
  box-shadow:0 0 0 8px var(--rim),0 0 0 13px var(--rimD);animation:press .45s ease-in both}
@keyframes press{0%{transform:scale(1)}35%{transform:scale(.82);filter:brightness(1.4)}100%{transform:scale(1.9);opacity:0;filter:brightness(3)}}
/* 結果のボード（壁紙のテーマのボード・boards.py）を入れる箱：この箱が動く（下から出る・落ちてくる・炎の中からドン）。馬は出さない */
.hb{position:absolute;z-index:6;left:50%;top:196px;width:350px;margin-left:-175px}
.close{position:absolute;z-index:8;left:50%;bottom:64px;transform:translateX(-50%);height:46px;padding:0 34px;border-radius:999px;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);color:#FFFFFF;font-family:var(--font),sans-serif;font-weight:800;font-size:15px;cursor:pointer;animation:fadeUp .4s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
/* 紙ふぶき */
.conf{position:absolute;inset:0;z-index:7;pointer-events:none}
.conf i{position:absolute;left:var(--x);top:-30px;width:var(--w);height:var(--h);background:var(--c);border-radius:2px;opacity:0;animation:fall var(--t) linear var(--d) infinite}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(900px) rotate(var(--r))}}
/* 視差効果を減らす：上下・回転・広がる光・紙ふぶきを止めて、ボードはふわっと出す */
@media (prefers-reduced-motion:reduce){.push,.pshadow,.push::after,.halo b,.tap,.conf i,.rays,.rbow,.ring,.glow,.spk b{animation:none!important}.conf,.pressed,.push::after{display:none}.hb{animation:fadeIn .5s ease-out .2s both!important}}

/* ---------- 的中：あたたかい光 → ボードが下から出る ---------- */
.rays{position:absolute;z-index:4;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;
  background:repeating-conic-gradient(var(--ray) 0 7deg,transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0 18%,transparent 62%);mask-image:radial-gradient(circle,#000 0 18%,transparent 62%);
  animation:raysIn .6s ease-out .2s both,spin 22s linear infinite}
.hit .hb{animation:riseUp .7s cubic-bezier(.2,1.35,.4,1) .3s both}
@keyframes riseUp{from{transform:translateY(720px)}to{transform:translateY(0)}}
.hit .bh{animation:pop .5s cubic-bezier(.2,1.8,.4,1) .95s both}
.hit{--t0:1.15s;--tc:.2s}
.ph{--bg:#1D2B53;--ink:#1D2B53;--sub:#4A433C;--card:#FFF1E8;--cardB:0 solid transparent;--cardO:0 solid transparent;--cardS:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,6px 10px 0 0 rgba(0,0,0,.35);--radius:0;--rs:0;--font:"DotGothic16";--dfont:"DotGothic16";--dw:400;--logo:#FFEC27;--logoS:3px 3px 0 #FF004D;--iii:#00E436;--iiiB:0 solid transparent;--iiiR:0;--hd:#000000;--hdInk:#FFF1E8;--hdB:4px solid #29ADFF;--mBg:transparent;--mLine:#FFF1E8;--mInk:#FFF1E8;--pill:#1D2B53;--pillLine:#29ADFF;--pillInk:#FFF1E8;--coin:#FFEC27;--coinInk:#000000;--badge:#FFEC27;--badgeInk:#000000;--badgeB:0 solid transparent;--tagBg:#C2C3C7;--tagInk:#000000;--tagLine:#000000;--warnBg:#FFA300;--warnInk:#000000;--zBg:#FFFFFF;--zB:2px solid #1D2B53;--znBg:#1D2B53;--znInk:#FFEC27;--znB:0 solid transparent;--znR:0;--znS:none;--acc:#7E2553;--nR:0;--w2B:0 solid transparent;--sep:2px dashed #83769C;--btn:#00E436;--btnInk:#000000;--btnB:0 solid transparent;--btnR:0;--btnS:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset -3px -3px 0 0 #008751;--btn2:#FFF1E8;--btn2Ink:#1D2B53;--btn2B:0 solid transparent;--tab:#000000;--tabB:4px solid #29ADFF;--tabInk:#C2C3C7;--tabOn:#29ADFF;--tabOnInk:#000000;--tabR:0;--sel:#FFEC27;--selInk:#000000;--h1:#FFEC27;--pageInk:#FFF1E8;--pageSub:#C2C3C7;--pageAcc:#FFEC27}
.ph{background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px);background-size:16px 16px}
.ph .mbtn,.ph .pill,.ph .seg,.ph .tag,.ph .coin,.ph .ocr{border-radius:0}
.ph .ct{padding:18px 18px 0;gap:18px}
.ph .seg{border:2px solid #1D2B53}
.ph .seg.on{background:#29ADFF;color:#000000;border-color:#000000}
.ph .btn.sub{box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset -3px -3px 0 0 #C2C3C7}
.ph .acts{gap:14px;margin-top:16px}
.ph .lb{box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.ph .n{border-radius:0}
.ph .bnr{height:160px;object-position:50% 50%}
.ph .hd{border-bottom:var(--hdB)}

/* ---------- ドット絵の的中ボタン：ドットでできたPUSH（まさちゃんの指定） ----------
   ぜんぶ 5px の四角いドット（テーマと同じ16色）で描いた昔のゲームのボタン：灰色の台（白い上と左・むらさきの下と右・黒いふち）に、
   赤いボタン（上と左はピンク・下と右は市松のちらし・厚み・黒いふち・左上に白い光）。「PUSH」は太いドットの字（上は白・下は黄色・こい影）。
   面の上を ななめの光が ドットずつ通る（2.6秒に1回）。左に ▶ のカーソル（右へ ちょんちょん）・左上に回る金貨・右上と右下に きらっ。
   上下の動きも ドットずつ（6コマ）。わくの光の輪も 四角でカクカク広がる。押すと ボタンが へこんで（カチッ）、カクカク大きくなって消え（強く光らせない）、
   金貨・ハート・きらっ・ブロックが はじけて飛んで、さいごは ちかちか点めつして消える */
.dp{--pr:0px;--pushA:#FF004D;--pushB:#7E2553;--pushC:#FF77A8;--rim:#C2C3C7;--rimD:#000000;--pushFace:#FF004D}
.push.dp{background:none;box-shadow:none;border-radius:0;animation:dpBob .9s step-end infinite,dpPop .36s step-end both}
.push.dp span{color:transparent;text-shadow:none}
.push.dp::after{inset:-34px -34px -44px;border:0;border-radius:0;
  background:linear-gradient(#FFEC27,#FFEC27) 5px 0/calc(100% - 10px) 5px no-repeat,linear-gradient(#FFEC27,#FFEC27) 5px 100%/calc(100% - 10px) 5px no-repeat,
    linear-gradient(#FFEC27,#FFEC27) 0 5px/5px calc(100% - 10px) no-repeat,linear-gradient(#FFEC27,#FFEC27) 100% 5px/5px calc(100% - 10px) no-repeat;
  animation:dpRing 1.2s steps(4) infinite}
@keyframes dpRing{0%{transform:scale(.94);opacity:1}100%{transform:scale(1.22);opacity:0}}
@keyframes dpBob{0%,100%{transform:translateY(0)}16.6%{transform:translateY(-5px)}33.3%{transform:translateY(-10px)}50%{transform:translateY(-15px)}
  66.6%{transform:translateY(-10px)}83.3%{transform:translateY(-5px)}}
@keyframes dpPop{0%{scale:.25}25%{scale:.5}50%{scale:.8}75%{scale:1.08}100%{scale:1}}
.dp .dpf{position:absolute;left:-20px;top:-20px;width:240px;height:150px;pointer-events:none;font-style:normal}
.dp .dpf svg,.dp .dpd svg{display:block;overflow:visible}
.dp .dpd{position:absolute;left:-70px;top:-60px;width:340px;height:230px;pointer-events:none;z-index:3;font-style:normal}
.dp .dps{animation:dpShine 2.6s steps(60) .4s infinite}
@keyframes dpShine{0%{transform:translateX(0)}35%,100%{transform:translateX(300px)}}
.dp .dpc{animation:dpCur .8s step-end infinite}
@keyframes dpCur{0%,100%{transform:none}50%{transform:translateX(5px)}}
.dp .dpm0,.dp .dpm1,.dp .dpm2{opacity:0}
.dp .dpm0{opacity:1;animation:dpM0 1.8s step-end infinite}
.dp .dpm1{animation:dpM1 1.8s step-end infinite}
.dp .dpm2{animation:dpM2 1.8s step-end infinite}
@keyframes dpM0{0%,100%{opacity:1}8.3%{opacity:0}33.3%{opacity:1}}
@keyframes dpM1{0%,100%{opacity:0}8.3%{opacity:1}16.7%{opacity:0}25%{opacity:1}33.3%{opacity:0}}
@keyframes dpM2{0%,100%{opacity:0}16.7%{opacity:1}25%{opacity:0}}
.dp .dpk0,.dp .dpk1,.dp .dpk2{opacity:0;animation:1.6s step-end infinite;animation-delay:inherit}
.dp .dpk0{animation-name:dpK0}
.dp .dpk1{animation-name:dpK1}
.dp .dpk2{animation-name:dpK2}
@keyframes dpK0{0%,25%,100%{opacity:0}12.5%{opacity:1}62.5%{opacity:1}75%{opacity:0}}
@keyframes dpK1{0%,100%{opacity:0}25%{opacity:1}37.5%{opacity:0}50%{opacity:1}62.5%{opacity:0}}
@keyframes dpK2{0%,100%{opacity:0}37.5%{opacity:1}50%{opacity:0}}
.pshadow.dp{width:220px;height:15px;margin-top:44px;border-radius:0;filter:none;background:rgba(0,0,0,.42);
  clip-path:polygon(15px 0,calc(100% - 15px) 0,calc(100% - 15px) 5px,100% 5px,100% 10px,calc(100% - 15px) 10px,calc(100% - 15px) 15px,15px 15px,15px 10px,0 10px,0 5px,15px 5px);
  animation:dpShad .9s step-end infinite}
@keyframes dpShad{0%,100%{transform:scale(1)}16.6%{transform:scale(.92)}33.3%{transform:scale(.84)}50%{transform:scale(.76)}66.6%{transform:scale(.84)}83.3%{transform:scale(.92)}}
.tap.dp{font-family:"DotGothic16",sans-serif;font-size:22px;color:#FFEC27;text-shadow:3px 3px 0 #FF004D}
.pressed.dp{background:none;box-shadow:none;border-radius:0;animation:dpPress .5s step-end both}
@keyframes dpPress{0%{transform:none;opacity:1}20%{transform:scale(1.08);opacity:1}40%{transform:scale(1.2);opacity:.75}60%{transform:scale(1.34);opacity:.5}
  80%{transform:scale(1.48);opacity:.25}100%{transform:scale(1.6);opacity:0}}   /* へこむ → カクカク大きくなって消える（強く光らせない） */
.pressed.dp .dps{display:none}
.clips.dp{position:absolute;z-index:4;left:50%;top:calc(50% - 40px);width:0;height:0}

  .pshadow.dp{animation:none}.clips.dp{display:none}}

/* ===== 結果のボード（テーマの判定画面と同じ見た目・馬は出さない） =====
   ふち（.rb）＝テーマの背景のもよう → 上の帯（.hd）＝見出し → カード（.card）＝買い目。すみにテーマの飾り（.orn） */
.rb{position:relative;width:350px;padding:8px;border-radius:calc(var(--radius) + 8px);background-color:var(--bg);color:var(--ink);text-align:left;
  font-family:var(--font),"BIZ UDPGothic",sans-serif;-webkit-font-smoothing:antialiased;box-shadow:0 0 0 1.5px rgba(255,255,255,.6),0 18px 38px rgba(0,0,0,.45)}
.rb .hd{position:relative;z-index:1;display:block;flex:none;padding:13px 12px 14px;border-radius:var(--radius);background:var(--hd);color:var(--hdInk);border-bottom:var(--hdB);text-align:center}
.rb .bh{display:inline-block;max-width:100%;margin:0;font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:34px;line-height:1.12;color:var(--logo);text-shadow:var(--logoS);white-space:nowrap}
/* 見出しの大きさはそろえる（テーマのロゴの大きさの決まりより強く） */
.rb.rb .hd .bh{font-size:34px}
.rb.rb.miss .hd .bh,.rb.rb.fz .hd .bh{font-size:30px}
.rb .bh .bx3{margin-left:-.18em;letter-spacing:-.42em}
/* 見出しの字を まん中に（まさちゃん「全部の結果ボードの的中の、文字が若干左よりになってる 中心に合わせて」）：
   最後の字（.bz）の うしろに 字間を つけない・全角の「！」（.bzx）は 字の はばの 右の あき（約0.35字）を つめる（全角の「！」は 字の まん中に 細く 書いてあるので） */
.rb .bh .bz{letter-spacing:0}
.rb .bh .bzx{margin-right:-.35em}
.rb .bsub{display:block;margin-top:6px;font-size:12.5px;font-weight:700;line-height:1.3;color:var(--hdInk);white-space:nowrap}
.rb .card{position:relative;flex:none;margin-top:9px;padding:13px 11px 12px;background:var(--card);border:var(--cardB);outline:var(--cardO);outline-offset:-7px;border-radius:var(--radius);box-shadow:var(--cardS)}
.rb .orn{position:absolute;top:-15px;right:12px;width:44px;height:44px;pointer-events:none;overflow:visible;z-index:2}
.rb .orn.o34{height:34px;top:-12px}
.rb .orn.o40{width:40px;height:40px;top:-13px}
.rb .brows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rb .brows li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:6px 8px;border-radius:var(--rs);background:var(--zBg);border:var(--zB);white-space:nowrap}
/* 払戻が長くて入らないときは、払戻だけ次の行へ（右によせる） */
.rb .bt{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:22px;padding:0 8px;border-radius:999px;background:var(--tagBg);color:var(--tagInk);border:1px solid var(--tagLine);font-size:11.5px;font-weight:800}
.rb .bc{display:flex;align-items:center;gap:2px;flex:none}
.rb .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border-radius:var(--nR);font:700 12.5px/1 "BIZ UDPGothic",sans-serif}
.rb .w1{background:#FFFFFF;color:#1F1F1F;border:1.5px solid #9AA0A6}
.rb .w2{background:#222222;color:#FFFFFF;border:var(--w2B)}
.rb .w3{background:#E0322B;color:#FFFFFF}
.rb .w4{background:#1F5FC9;color:#FFFFFF}
.rb .w5{background:#F3C316;color:#1F1F1F}
.rb .w6{background:#1E8E3E;color:#FFFFFF}
.rb .w7{background:#F08A1C;color:#1F1F1F}
.rb .w8{background:#F27BB0;color:#1F1F1F}
.rb .ar{color:var(--sub);font-weight:700;padding:0 1px}
.rb .by{font-size:11px;color:var(--sub)}
.rb .bp{margin-left:auto;font-size:14.5px;font-weight:800;color:var(--acc)}
.rb .btot{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:9px;border-top:var(--sep);font-size:12.5px;font-weight:700;color:var(--sub)}
.rb .btot b{font-family:var(--dfont),sans-serif;font-weight:var(--dw);font-size:24px;line-height:1;color:var(--ink)}
/* ハズレ：見出しは上の帯の文字の色で静かに・払戻は0円（うすく） */
.rb.miss .bh{color:var(--hdInk);text-shadow:none}
.rb.miss .bp,.rb.miss .btot b{color:var(--sub)}
.rb.miss .bp{font-weight:700}
/* デカ的中：まわりが光る・見出しは虹色（黒いふち）・3連単の行は虹色のふち */
.rb.big{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 26px 6px rgba(255,236,160,.85),0 18px 38px rgba(0,0,0,.45)}
.rb.big .bh,.rb.fz .bh{background:linear-gradient(90deg,#FF3B3B,#FF9F1A,#FFD21A,#2DBB55,#1FA8E0,#4C6BFF,#B34CFF,#FF3BB8,#FF3B3B);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(1.5px 0 0 #1E1030) drop-shadow(-1.5px 0 0 #1E1030) drop-shadow(0 1.5px 0 #1E1030) drop-shadow(0 -1.5px 0 #1E1030) drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.rb.big .brows li.top,.rb.fz .brows li.top{position:relative;background:linear-gradient(var(--zBg),var(--zBg)) padding-box,linear-gradient(var(--rbFace),var(--rbFace)) padding-box,
  linear-gradient(90deg,#FF3B3B,#FFE53B,#3BE26A,#2FD6FF,#B34CFF,#FF3BB8) border-box;border:2px solid transparent;gap:2px 3px;padding:4px 5px}
/* ど的中・隠れど的中：枠は虹色（回さない）・炎に光る・見出しの下に帯（超大穴の馬／デカ的中が化けた） */
.rb.fz{padding:11px;box-shadow:0 0 0 3px #FFFFFF,0 0 28px 8px rgba(255,236,170,.9),0 0 64px 18px rgba(255,120,0,.6),0 12px 24px rgba(0,0,0,.35)}
.rb.fz::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:4px;pointer-events:none;
  background:conic-gradient(from 200deg,#FF3B3B,#FF9F1A,#FFE53B,#3BE26A,#2FD6FF,#4C6BFF,#B34CFF,#FF3BB8,#FF3B3B);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.rb.fz .brows li.top::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 70%) -130% 0/50% 100% no-repeat}
.rb.fz .btot b{background:linear-gradient(90deg,#FF3B3B,#FFE53B,#3BE26A,#2FD6FF,#B34CFF,#FF3BB8) 0 100%/100% 3px no-repeat;padding-bottom:4px}
.rb .zrib{display:flex;align-items:center;justify-content:center;gap:6px;width:max-content;max-width:100%;margin:8px auto 0;padding:3px 10px 3px 4px;border-radius:999px;background:#2A1259;color:#FFFFFF;
  font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 0 0 2px #FFFFFF,0 0 12px rgba(179,76,255,.7)}
.rb .zrib .zt{padding:3px 8px;border-radius:999px;background:linear-gradient(180deg,#FFF3B0,#FFC21A);color:#2A1259;font-weight:800;font-size:11.5px}
.rb .zrib .n{min-width:22px;height:22px;font-size:12px}
.rb .n.zx{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px #FF3BB8,0 0 10px 4px rgba(255,59,184,.6)}

.rb.t-pixel{--hdB:4px solid #29ADFF;--cardO:0 solid transparent;--zBg:#FFFFFF;--zB:2px solid #1D2B53;--sep:2px dashed #83769C;--rs:0;--nR:0;--w2B:0 solid transparent;--tagBg:#C2C3C7;--tagInk:#000000;--tagLine:#000000;--bg:#1D2B53;--ink:#1D2B53;--sub:#4A433C;--card:#FFF1E8;--cardB:0 solid transparent;--cardS:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,6px 10px 0 0 rgba(0,0,0,.35);--radius:0;--font:"DotGothic16";--dfont:"DotGothic16";--dw:400;--logo:#FFEC27;--logoS:3px 3px 0 #FF004D;--hd:#000000;--hdInk:#FFF1E8;--acc:#7E2553;--h1:#FFEC27;--coin:#FFEC27;--coinInk:#000000;--rbFace:#FFF1E8}
.rb.t-pixel{background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px);background-size:16px 16px}
.rb.t-pixel .mbtn,.rb.t-pixel .pill,.rb.t-pixel .seg,.rb.t-pixel .tag,.rb.t-pixel .coin,.rb.t-pixel .ocr{border-radius:0}
.rb.t-pixel .ct{padding:18px 18px 0;gap:18px}
.rb.t-pixel .seg{border:2px solid #1D2B53}
.rb.t-pixel .seg.on{background:#29ADFF;color:#000000;border-color:#000000}
.rb.t-pixel .btn.sub{box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset -3px -3px 0 0 #C2C3C7}
.rb.t-pixel .acts{gap:14px;margin-top:16px}
