body{margin:0}
*{box-sizing:border-box}
.ph{width:390px;height:1843px;position:relative;overflow:hidden;display:flex;flex-direction:column;background-color:var(--bg);color:var(--ink);font-family:var(--font),sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .25s}
