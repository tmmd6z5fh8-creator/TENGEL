<style>

#status{position:absolute;left:0;top:0;width:270px;height:26px;background:#16203D;color:#fff;z-index:3}

#status .isl{position:absolute;left:97px;top:5px;width:76px;height:19px;border-radius:12px;background:#000}
#status .ic{position:absolute;right:20px;top:8px;display:flex;gap:4px;align-items:flex-end}
#status .bars i{display:inline-block;width:3px;background:#fff;border-radius:1px;margin-left:1px}
#status .bat{width:20px;height:10px;border:1.3px solid rgba(255,255,255,.9);border-radius:3px;position:relative}
#status .bat::after{content:"";position:absolute;left:1.5px;top:1.5px;width:12px;height:4.5px;background:#fff;border-radius:1px}
.hdr{position:absolute;left:0;top:26px;width:270px;z-index:2}
#vp{position:absolute;left:0;width:270px;overflow:hidden;background:#eceef3}
.cimg{position:absolute;left:0;top:0;width:270px}
.tab{position:absolute;left:0;width:270px;z-index:2}
#home{position:absolute;left:0;bottom:0;width:270px;height:14px;background:#fff;z-index:2}
#home::after{content:"";position:absolute;left:90px;top:5px;width:90px;height:4px;border-radius:2px;background:#111}
.ring{position:absolute;border:3px solid #ffcf3a;border-radius:10px;box-shadow:0 0 0 2px rgba(80,0,0,.45),0 0 20px rgba(255,190,40,.95),inset 0 0 12px rgba(255,190,40,.45)}
.rip{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 16px rgba(255,220,120,.9)}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 14px rgba(255,200,80,.9)}

.card{transform-origin:50% 50%;border-radius:18px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 2.5px #ffd45c,0 0 30px rgba(255,150,0,.6),0 26px 50px rgba(0,0,0,.65)}

<script>
const META = window.__META;

const $ = id => document.getElementById(id);
// 版：?v=app＝App Store版のアプリの中で見せる版（「ホーム画面に追加」ではなく、アプリの言い方）。どちらの版にも商標の注意書きを入れる

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  { t: 1.2, x: 270, y: 330, n: 110, sp: 520, hue: 45 }, { t: 1.6, x: 270, y: 520, n: 70, sp: 420, hue: 40 },

const FILL = {

const SPR = {};
function mkText(key, text, o) {

  g.strokeStyle = s2; g.lineWidth = size * .09; g.strokeText(text, 0, 0);

}
function mkRibbon(key, text, o) {
  const w = o.w, h = o.h, size = o.size;
  const c = document.createElement('canvas'), g = c.getContext('2d'); c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  const sk = h * .35;
  const path = () => { g.beginPath(); g.moveTo(sk, 0); g.lineTo(w, 0); g.lineTo(w - sk, h); g.lineTo(0, h); g.closePath(); };
  path(); const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, o.c1 || '#d4001a'); gr.addColorStop(.55, o.c2 || '#8a000d'); gr.addColorStop(1, o.c3 || '#4a0006');
  g.fillStyle = gr; g.fill();
  g.lineWidth = 3; g.strokeStyle = '#ffd45c'; path(); g.stroke();
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.moveTo(sk + 4, 4); g.lineTo(w - 6, 4); g.stroke();
  g.font = `900 ${size}px "Noto Sans CJK JP"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.save(); g.translate(w / 2, h / 2 + 1); g.transform(1, 0, -.1, 1, 0, 0);
  g.lineWidth = size * .22; g.strokeStyle = '#2a0000'; g.strokeText(text, 0, 0);
  const tg = g.createLinearGradient(0, -size / 2, 0, size / 2); FILL.gold.forEach(([p, col]) => tg.addColorStop(p, col));
  g.fillStyle = o.white ? '#fff' : tg; g.fillText(text, 0, 0); g.restore();
  SPR[key] = { c, w, h };
}
function mkBadge(key, text, size) {
  const R = size, c = document.createElement('canvas'), g = c.getContext('2d'), w = R * 2 + 20; c.width = c.height = w * 2; g.scale(2, 2);
  g.translate(w / 2, w / 2);
  g.beginPath(); for (let i = 0; i < 32; i++) { const r = i % 2 ? R * .78 : R, a = i / 32 * TAU; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath();
  const gr = g.createRadialGradient(0, -R * .3, R * .1, 0, 0, R); gr.addColorStop(0, '#fff36b'); gr.addColorStop(.55, '#ff7a00'); gr.addColorStop(1, '#d10014');
  g.fillStyle = gr; g.fill(); g.lineWidth = 4; g.strokeStyle = '#fff'; g.stroke(); g.lineWidth = 2; g.strokeStyle = '#7a0000'; g.stroke();
  g.font = `900 ${R * .5}px "Noto Sans CJK JP"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.rotate(-.12); g.lineWidth = R * .16; g.strokeStyle = '#6a0000'; g.strokeText(text, 0, 2); g.fillStyle = '#fff'; g.fillText(text, 0, 2);
  SPR[key] = { c, w, h: w };
}
const ZCOL = { 人気: ['#ff5a5a', '#b30012'], 中穴: ['#3fe07a', '#00873a'], 大穴: ['#4cb8ff', '#0a4fbf'], 超大穴: ['#c77dff', '#5c1aa8'] };
function mkTile(key, text) {
  const w = 120, h = 70, c = document.createElement('canvas'), g = c.getContext('2d'); c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  const [a, b] = ZCOL[text];
  g.fillStyle = '#fbfbf5'; g.fillRect(0, 0, w, h);
  const gr = g.createLinearGradient(0, 8, 0, h - 8); gr.addColorStop(0, a); gr.addColorStop(1, b);
  g.beginPath(); g.roundRect(10, 8, w - 20, h - 16, 10); g.fillStyle = gr; g.fill(); g.lineWidth = 2.5; g.strokeStyle = '#1a1a1a'; g.stroke();
  const fs = text.length > 2 ? 26 : 32;
  g.font = `900 ${fs}px "Noto Sans CJK JP"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = 6; g.strokeStyle = '#1a0000'; g.strokeText(text, w / 2, h / 2 + 1); g.fillStyle = '#fff'; g.fillText(text, w / 2, h / 2 + 1);

let tmpC, tmpG;

  if (opt.hue != null) g.filter = `hue-rotate(${opt.hue}deg) saturate(1.25)`;
  if (opt.shine != null && opt.shine > -0.2 && opt.shine < 1.2) {
    if (!tmpC) { tmpC = document.createElement('canvas'); tmpG = tmpC.getContext('2d'); }
    if (tmpC.width < s.c.width || tmpC.height < s.c.height) { tmpC.width = Math.max(tmpC.width, s.c.width); tmpC.height = Math.max(tmpC.height, s.c.height); }

// ===================== スマホ =====================
const SW = 270, S = SW / 390, STATUS = 26, HDR = META.header.H * S, TABH = META.tabbar.H * S, HOME = 14, SH = 844 * S, BEZ = 10;
const VTOP = STATUS + HDR, VH = SH - STATUS - HDR - TABH - HOME;

const Z1 = '#zoneCard ol.zedit > li:nth-child(1)', S2 = '#slotList .slotrow[data-n="2"]';

const yM0 = Y('set_m0', '#slotList') - 29.1, yM1 = Y('set_m1', '#smPreview') - 63.7, yM3 = Y('set_m3', '#slotList') - 21, yJ = Y('judge_jra', '#result') - 14.6;
const SCENES = [
  { a: 3.2, b: 8.0, hdr: [['header_oi0', 3.2]], tab: [['tabbar_judge', 3.2]],
    views: [{ k: 'judge_empty', a: 3.2 }, { k: 'judge_reading', a: 4.4, fade: .1 }, { k: 'judge_filled', a: 5.2, fade: .22 }],
    scroll: { judge_filled: t => t < 6.0 ? lerp(0, 70, eio(P(t, 5.35, 5.8))) : t < 7.2 ? lerp(70, yF, eio(P(t, 6.0, 6.42))) : lerp(yF, yF + 45, eio(P(t, 7.2, 7.6))) },

  ['1着', '2着', '3着'].forEach((s, i) => mkText('rl' + i, s, { size: 24, fill: 'gold', depth: 1, skew: 0 }));
}
window.__ready = Promise.all([...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; })))
  .then(() => document.fonts.load('900 40px "Noto Sans CJK JP"')).then(() => document.fonts.ready)
  .then(() => { build(); render(0); return true; });
</script>
