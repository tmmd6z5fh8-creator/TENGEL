<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>CM用の例：出馬表・オッズ画面（架空）</title>
<meta name="viewport" content="width=390">
<style>
/* CMで「この画面のスクショを入れるだけ」を見せるための、架空の画面（どこかの会社の画面のまねではない・独自のデザイン）
   ?p=0 … 出馬表（距離・馬場・出走頭数が大きく分かる画面）／ ?p=1 … 単勝・複勝オッズ（人気順）／ ?p=2 … 3連単オッズ（人気順）
   数字はCMのアプリの画面（cm2_shots.py の F9：9R・ダ1400m・12頭・良・単勝・複勝・3連単1位／5位／10位）と同じ。
   アプリの読み取り（ocr_local.js）でこの3枚を読むと、F9 と同じ数字が入る（example_odds.py で確かめる） */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#f2f3f6;font-family:'Noto Sans CJK JP','Hiragino Sans',sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased}
.status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;background:#232a35;color:#fff}
.status b{font-size:16px;letter-spacing:.02em}
.status .ic{display:flex;gap:6px;align-items:center}
.bars{display:flex;gap:2px;align-items:flex-end;height:12.5px}.bars i{display:block;width:3.5px;background:#fff;border-radius:1px}
.bat{width:25px;height:12px;border:1.5px solid rgba(255,255,255,.9);border-radius:4px;position:relative}.bat::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:5px;background:#fff;border-radius:1px}
.appbar{height:52px;background:#232a35;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-weight:800;font-size:18px;letter-spacing:.08em;border-bottom:3px solid #f08c00}
.appbar::before{content:"";position:absolute;left:20px;top:18px;width:12px;height:12px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg)}
.race{background:#fff;margin:10px 10px 0;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rtop{display:flex;gap:12px;align-items:center}
.rno{flex:none;width:58px;height:58px;border-radius:10px;background:#f08c00;color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center}
.rinfo .d{font-size:13px;color:#5b6475}
.rinfo .n{font-size:19px;font-weight:900;margin:1px 0 2px}
.rinfo .m{font-size:14.5px;font-weight:700;color:#3b4252}
.rinfo .m span{margin-right:10px}
/* 出馬表：距離・馬場・出走頭数を大きく */
.tiles{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:8px;margin-top:12px}
.tile{border:1.5px solid #e3e6ec;border-radius:10px;padding:8px 6px 9px;text-align:center;background:#fafbfc}
.tile .k{font-size:12.5px;font-weight:700;color:#5b6475;letter-spacing:.06em}
.tile .v{font-size:21px;font-weight:900;margin-top:2px;letter-spacing:.01em;white-space:nowrap}
.wx{margin-top:8px;font-size:13px;color:#5b6475;font-weight:600}
.sect{margin:12px 10px 6px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}
.sect::before{content:"";width:6px;height:20px;border-radius:3px;background:#f08c00}
.sect small{margin-left:auto;font-size:12.5px;color:#5b6475;font-weight:600}
table{width:calc(100% - 20px);margin:0 10px;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
th{background:#e6e9ef;color:#3b4252;font-size:13px;font-weight:800;padding:7px 4px}
td{border-top:1px solid #e3e6ec;font-size:17px;padding:0 6px;height:43px;text-align:center}
td.name{text-align:left;font-weight:800;color:#1c3d72;font-size:15px;white-space:nowrap;padding-left:4px}
td.odds{text-align:right;padding-right:10px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
td.fuku{text-align:right;padding-right:10px;font-weight:700;font-size:15px;color:#3b4252;font-variant-numeric:tabular-nums;white-space:nowrap}
td.odds.hot{color:#d6261d}
td.sx{font-size:14px;color:#3b4252;font-weight:700}
.list td{height:36px}
.no{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:5px;font-weight:800;font-size:17px}
.list .no{width:30px;height:26px;font-size:15px}
.tri td{height:52px}
.combo{display:inline-flex;align-items:center;gap:7px}
.combo .no{width:36px;height:32px}
.combo i{font-style:normal;color:#8a93a5;font-size:14px}
/* 枠の色（1白・2黒・3赤・4青・5黄・6緑・7橙・8桃） */
.w1{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #b8bfcc}.w2{background:#1d1d1d;color:#fff}.w3{background:#e03131;color:#fff}.w4{background:#2f6fde;color:#fff}
.w5{background:#f5d90a;color:#111}.w6{background:#2f9e44;color:#fff}.w7{background:#f08c00;color:#fff}.w8{background:#f06595;color:#fff}
</style></head>
<body>
<div class="status"><b>9:41</b><span class="ic"><span class="bars"><i style="height:5px"></i><i style="height:7.5px"></i><i style="height:10px"></i><i style="height:12.5px"></i></span><span class="bat"></span></span></div>
<div class="appbar" id="appbar">オッズ</div>
<div class="race" id="race"></div>
<div id="body"></div>
<script>
// 馬番 → 枠（12頭：1〜4は1頭ずつ、5〜8枠は2頭ずつ）
const WAKU = n => n <= 4 ? n : Math.ceil((n - 4) / 2) + 4;
const NO = n => `<span class="no w${WAKU(n)}">${n}</span>`;
// 単勝・複勝（人気順）：馬番・馬名（架空）・単勝・複勝
// 馬名はまさちゃんが決めた架空の名前（netkeiba の競走馬検索で「テンゲル」は0頭＝実在しない・2026/10/15）。表の上から（人気順）1〜12
const TAN = [[6, 'テンゲルスター', '2.1', '1.1-1.3'], [2, 'テンゲルゴールド', '3.4', '1.3-1.8'], [10, 'テンゲルマリモット', '5.2', '1.6-2.3'], [7, 'テンゲルインパクト', '7.8', '2.0-2.9'],
             [1, 'テンゲルアルカイ', '9.5', '2.4-3.6'], [4, 'テンゲルテナァニ', '12.4', '2.9-4.4'], [11, 'テンゲルシップ', '16.8', '3.6-5.5'], [5, 'テンゲルグリア', '22.5', '4.5-6.9'],
             [9, 'テンゲルノオウマ', '31.0', '5.8-8.9'], [3, 'テンゲルテテテ', '45.6', '7.9-12.1'], [8, 'テンゲルステップ', '58.3', '9.8-15.0'], [12, 'テンゲルリール', '82.1', '13.5-20.6']];
// 出馬表の性齢（架空）
const SEX = { 1: '牡4', 2: '牝3', 3: '牡5', 4: '牡3', 5: '牝4', 6: '牡4', 7: 'セ6', 8: '牡3', 9: '牝5', 10: '牡4', 11: '牡3', 12: '牝4' };
// 3連単（人気順）：1位・5位・10位はアプリの画面と同じ
const TRI = [[[6, 2, 10], '18.5'], [[6, 10, 2], '21.3'], [[6, 2, 7], '27.4'], [[2, 6, 10], '31.6'], [[6, 7, 2], '42.6'],
             [[6, 2, 1], '45.2'], [[6, 10, 7], '51.8'], [[2, 10, 6], '58.4'], [[6, 1, 2], '66.0'], [[10, 6, 2], '78.9']];
const p = new URLSearchParams(location.search).get('p') || '1';
const race = document.getElementById('race'), body = document.getElementById('body');
const TOP = `<div class="rtop"><div class="rno">9R</div><div class="rinfo"><div class="d">2026年10月14日(水)　発走 18:05</div><div class="n">テンゲル賞</div>`;
if (p === '0') {
  document.getElementById('appbar').textContent = '出馬表';
  race.innerHTML = TOP + `</div></div>
    <div class="tiles"><div class="tile" id="exDist"><div class="k">距離</div><div class="v">ダート1400m</div></div>
      <div class="tile" id="exBaba"><div class="k">馬場</div><div class="v">良</div></div>
      <div class="tile" id="exN"><div class="k">出走頭数</div><div class="v">12頭</div></div></div>
    <div class="wx">天候：晴　右回り</div>`;
  const byNo = Object.fromEntries(TAN.map(([n, name]) => [n, name]));
  body.innerHTML = `<div class="sect">出走馬<small>馬番順</small></div><table class="list"><thead><tr><th style="width:44px">枠</th><th style="width:50px">馬番</th><th>馬名</th><th style="width:60px">性齢</th></tr></thead><tbody>`
    + Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<tr><td>${WAKU(n)}</td><td>${NO(n)}</td><td class="name">${byNo[n]}</td><td class="sx">${SEX[n]}</td></tr>`).join('') + '</tbody></table>';
} else {
  race.innerHTML = TOP + `<div class="m"><span>ダート1400m</span><span>12頭</span><span>馬場：良</span></div></div></div>`;
  if (p === '1') {
    body.innerHTML = `<div class="sect">単勝・複勝オッズ<small>人気順</small></div><table><thead><tr><th style="width:40px">人気</th><th style="width:46px">馬番</th><th>馬名</th><th style="width:58px">単勝</th><th style="width:86px">複勝</th></tr></thead><tbody>`
      + TAN.map(([n, name, o, f], i) => `<tr><td>${i + 1}</td><td>${NO(n)}</td><td class="name">${name}</td><td class="odds${i < 3 ? ' hot' : ''}">${o}</td><td class="fuku">${f}</td></tr>`).join('') + '</tbody></table>';
  } else {
    body.innerHTML = `<div class="sect">3連単オッズ<small>人気順</small></div><table class="tri"><thead><tr><th style="width:52px">人気</th><th>組み合わせ</th><th style="width:96px">オッズ</th></tr></thead><tbody>`
      + TRI.map(([c, o], i) => `<tr><td>${i + 1}</td><td><span class="combo">${NO(c[0])}<i>→</i>${NO(c[1])}<i>→</i>${NO(c[2])}</span></td><td class="odds">${o}</td></tr>`).join('') + '</tbody></table>';
  }
}
</script>
</body></html>
