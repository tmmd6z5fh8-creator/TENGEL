<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>テンゲルⅢ App Storeプレビュー（ポイント版）</title>
<style>
/* App Storeのプレビュー動画（App Preview）・ポイント版：アプリの画面だけで作る（審査ガイドライン 2.3.4：プレビューはアプリそのものの画面の録画だけ。文字を重ねるのはOK）
   画面いっぱいにアプリ（iPhone 443×960 → 886×1920／iPad 1032×1376 → 1200×1600）。29.5秒。
   中身はCM第7弾の4つの場面をそのままつないだもの（時間はCMの時刻で書いて、CMT() でプレビューの時刻に直す）。音もCMの同じところ（bgm7.wav）をつなぐ（make_preview7.sh）
     0〜14.0 ＝ CM 15.6〜29.6（ポイントで読み取り・自動で入る → 1発でゾーンまで判定）
     14.0〜20.4 ＝ CM 36.0〜42.4（Pカスタム：券種を500Pで解放）
     20.4〜28.4 ＝ CM 52.8〜60.8（単勝5連予想：5レースまとめて200P・自分で選ぶ／ランダム）
     28.4〜29.5 ＝ CM 71.2〜72.3（おわり：テンゲルⅢ）
   CMの例の画面（3枚の画像）・エンブレム・コイン・紙吹雪などアプリにないものは使わない。ポイントの帯・ロック・解放の確かめ・購入はイメージ（アプリができたら撮り直す） */
@font-face{font-family:'Dela Gothic One';src:url('fonts/DelaGothicOne-Regular.ttf')}
@font-face{font-family:'BIZ UDPGothic';font-weight:700;src:url('fonts/BIZUDPGothic-Bold.ttf')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;src:url('fonts/IBMPlexMono-SemiBold.ttf')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:#eceef3}
body{font-family:'Noto Sans CJK JP','Hiragino Sans',sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#scr{position:absolute;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:#eceef3}

.ipad #status .isl{display:none}.ipad #status .ic{right:20px;top:6px}

#status .ic{position:absolute;right:30px;top:22px;display:flex;gap:6px;align-items:center;height:12.5px}

.ring{position:absolute;border:3px solid #ffcf3a;border-radius:10px;box-shadow:0 0 0 2px rgba(80,0,0,.4),0 0 18px rgba(255,190,40,.95),inset 0 0 10px rgba(255,190,40,.4);z-index:4;display:none}

/* 保有ポイント（ヘッダー・イメージ） */
#ppill{position:absolute;z-index:3;height:27px;padding:0 12px 0 4px;border-radius:999px;border:1px solid rgba(243,240,230,.35);display:flex;align-items:center;gap:6px;
  color:#F3F0E6;font-family:'BIZ UDPGothic',sans-serif;font-weight:700;font-size:13px;background:#16203D}

  color:#5a3500;font-style:normal;font-family:'Dela Gothic One';font-size:11px;line-height:1}

  font-family:'BIZ UDPGothic',sans-serif;font-weight:700;color:#141A2E;transform-origin:50% 50%}
#pdlg .ttl{font-size:18px}

  background:linear-gradient(0deg,rgba(8,11,28,.95) 0%,rgba(8,11,28,.9) 55%,rgba(8,11,28,.55) 78%,rgba(8,11,28,0) 100%)}
#dim{position:absolute;left:0;top:0;width:var(--W);height:var(--H);z-index:7;background:rgba(6,9,24,1);opacity:0}
canvas{position:absolute;left:0;top:0;width:var(--W);height:var(--H);z-index:8}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity;z-index:9}
.center{width:var(--W);text-align:center}
.sub{display:inline-block;padding:6px 15px 7px;border-radius:9px;border:2px solid #ffd45c;background:linear-gradient(180deg,#6a000c,#1c0003);
  box-shadow:0 0 14px rgba(255,150,0,.6),inset 0 0 9px rgba(255,80,0,.35);font-weight:900;font-size:17px;letter-spacing:.04em;white-space:nowrap;text-shadow:0 2px 0 #000}

.ipad .sub{font-size:27px;padding:9px 24px 10px;border-radius:12px}

.ipad .foot{font-size:16px}

.ipad #disc{width:900px;font-size:16px}

<body>
<div id="scr">
  <div id="status"><span class="tm">9:41</span><span class="dt">10月14日(水)</span><span class="isl"></span>
    <span class="ic"><span class="bars"><i style="height:5px"></i><i style="height:7.5px"></i><i style="height:10px"></i><i style="height:12.5px"></i></span><span class="bat"></span></span></div>
  <div id="hdrs"></div>
  <div id="ppill"><i class="pc">P</i><b id="pnum">1,500</b><span>P</span></div>
  <div id="vp"><div id="cimgs"></div>
    <div class="ring" id="ring"></div><div class="ring" id="ring2"></div><div class="ring" id="ring3"></div>
  </div>
  <div id="tabs"></div>
  <div id="home"></div>
  <div id="pdlg"><div class="bd"></div><div class="dlg" id="pdlgc"><div class="ttl" id="pdt">「複勝」を解放する？</div><div class="txt">記録できる券種がふえるよ</div>
    <div class="btns"><span class="b0">やめる</span><span class="b1" id="pdb">500Pで解放</span></div></div></div>
  <div class="rip" id="rip" style="display:none"></div>
  <div class="dot" id="dot" style="display:none"></div>

</div>
<canvas id="fx"></canvas>
<div class="abs center" id="csub"><span class="sub"></span></div>
<div class="abs center foot" id="cfoot"><span>※画像の読み取りは、この端末の中で行います（1レース200P）</span></div>
<div class="abs center" id="disc">※画面はイメージです。レース・オッズ・馬名は架空の例です。<br>過去のデータの傾向を表示する道具で、的中や利益を約束するものではありません。馬券は20歳になってから。</div>

<script>
const META = window.__META, SHOTS = window.__SHOTS || 'shots_prev7';
const IPAD = !!window.__IPAD;
const W = IPAD ? 1032 : 443, H = IPAD ? 1376 : 960, DUR = 29.5;
const $ = id => document.getElementById(id);
document.documentElement.style.setProperty('--W', W + 'px'); document.documentElement.style.setProperty('--H', H + 'px');
if (IPAD) document.documentElement.classList.add('ipad');
$('fx').width = W * 2; $('fx').height = H * 2;
if (!IPAD) $('status').querySelector('.dt').remove();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const env = (t, a, b, fi = .2, fo = .15) => (t < a || t > b) ? 0 : Math.min(eo(P(t, a, a + fi)), 1 - P(t, b - fo, b));

// ===================== プレビューの時刻 → CMの時刻（4つの場面をつなぐ） =====================
const SEG = [[0, 15.6], [14.0, 36.0], [20.4, 52.8], [28.4, 71.2]];
function CMT(p) { let s = SEG[0]; for (const x of SEG) if (p >= x[0]) s = x; return s[1] + (p - s[0]); }

// ===================== 文字の絵（CMと同じ作り方） =====================
const FILL = {
  gold: [[0, '#fffbe6'], [.28, '#ffe27a'], [.49, '#ffb300'], [.52, '#fff1b8'], [.78, '#e07b00'], [1, '#ffe08a']],
  fire: [[0, '#fffde0'], [.3, '#ffe14d'], [.62, '#ff8400'], [1, '#d81b00']],
  white: [[0, '#ffffff'], [.6, '#f4f4f4'], [1, '#c9d2e6']],
  blue: [[0, '#f2fbff'], [.4, '#9fe3ff'], [.5, '#ffffff'], [.75, '#38a8ff'], [1, '#a9e8ff']],
  rainbow: [[0, '#ff3b3b'], [.18, '#ff9d00'], [.36, '#ffe600'], [.54, '#3ee05a'], [.72, '#2fa8ff'], [.9, '#b04dff'], [1, '#ff4fd8']],
  red: [[0, '#ffe2e2'], [.35, '#ff6b6b'], [.7, '#e01b1b'], [1, '#ff9a9a']],
};
const SPR = {};
function mkText(key, text, o) {
  const size = o.size, pad = Math.ceil(size * .5), font = `900 ${size}px "Noto Sans CJK JP"`;
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = font;
  const tw = g.measureText(text).width, w = Math.ceil(tw + pad * 2 + size * .3), h = Math.ceil(size * 1.3 + pad * 2);
  c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  g.font = font; g.textBaseline = 'middle'; g.textAlign = 'center'; g.lineJoin = 'round'; g.miterLimit = 2;
  g.translate(w / 2, h / 2); g.transform(1, 0, -(o.skew ?? .12), 1, 0, 0);
  const s1 = o.s1 ?? '#2a0000', s2 = o.s2 ?? '#fff4c8', ext = o.ext ?? '#4a0000';
  if (o.glow) { g.save(); g.shadowColor = o.glow; g.shadowBlur = size * .45; g.strokeStyle = o.glow; g.lineWidth = size * .24; g.strokeText(text, 0, 0); g.restore(); }
  const depth = o.depth ?? Math.max(2, Math.round(size * .08));
  g.strokeStyle = ext; g.fillStyle = ext; g.lineWidth = size * .22;
  for (let i = depth; i >= 1; i--) { g.strokeText(text, i * .3, i); g.fillText(text, i * .3, i); }
  g.strokeStyle = s1; g.lineWidth = size * .22; g.strokeText(text, 0, 0);
  g.strokeStyle = s2; g.lineWidth = size * .09; g.strokeText(text, 0, 0);
  const gr = o.dir === 'h' ? g.createLinearGradient(-tw / 2, 0, tw / 2, 0) : g.createLinearGradient(0, -size * .55, 0, size * .55);
  FILL[o.fill].forEach(([p, col]) => gr.addColorStop(p, col));
  g.fillStyle = gr; g.fillText(text, 0, 0);
  SPR[key] = { c, w, h, tw: tw + size * .4 };
}
function mkRibbon(key, text, o) {
  const w = o.w, h = o.h, size = o.size;
  const c = document.createElement('canvas'), g = c.getContext('2d'); c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  const sk = h * .35;
  const path = () => { g.beginPath(); g.moveTo(sk, 0); g.lineTo(w, 0); g.lineTo(w - sk, h); g.lineTo(0, h); g.closePath(); };
  path(); const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#d4001a'); gr.addColorStop(.55, '#8a000d'); gr.addColorStop(1, '#4a0006');
  g.fillStyle = gr; g.fill();
  g.lineWidth = 3; g.strokeStyle = '#ffd45c'; path(); g.stroke();
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.moveTo(sk + 4, 4); g.lineTo(w - 6, 4); g.stroke();
  g.font = `900 ${size}px "Noto Sans CJK JP"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.save(); g.translate(w / 2, h / 2 + 1); g.transform(1, 0, -.1, 1, 0, 0);
  g.lineWidth = size * .22; g.strokeStyle = '#2a0000'; g.strokeText(text, 0, 0);
  const tg = g.createLinearGradient(0, -size / 2, 0, size / 2); FILL.gold.forEach(([p, col]) => tg.addColorStop(p, col));
  g.fillStyle = tg; g.fillText(text, 0, 0); g.restore();
  SPR[key] = { c, w, h };
}
let tmpC, tmpG;
function drawSpr(g, key, x, y, sc = 1, a = 1, rot = 0, opt = {}) {
  const s = SPR[key]; if (!s || a <= .001 || sc <= .001) return;
  g.save(); g.globalAlpha = g.globalAlpha * clamp(a); g.translate(x, y); if (rot) g.rotate(rot); g.scale(sc, sc);
  if (opt.hue != null) g.filter = `hue-rotate(${opt.hue}deg) saturate(1.25)`;
  if (opt.shine != null && opt.shine > -0.2 && opt.shine < 1.2) {
    if (!tmpC) { tmpC = document.createElement('canvas'); tmpG = tmpC.getContext('2d'); }
    if (tmpC.width < s.c.width || tmpC.height < s.c.height) { tmpC.width = Math.max(tmpC.width, s.c.width); tmpC.height = Math.max(tmpC.height, s.c.height); }
    tmpG.globalCompositeOperation = 'source-over'; tmpG.clearRect(0, 0, tmpC.width, tmpC.height);
    tmpG.drawImage(s.c, 0, 0);
    tmpG.globalCompositeOperation = 'source-atop';
    const bx = lerp(-.3, 1.3, opt.shine) * s.c.width, bw = s.c.width * .18;
    const lg = tmpG.createLinearGradient(bx - bw, 0, bx + bw, s.c.height * .3);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.85)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    tmpG.fillStyle = lg; tmpG.fillRect(0, 0, s.c.width, s.c.height);
    g.drawImage(tmpC, 0, 0, s.c.width, s.c.height, -s.w / 2, -s.h / 2, s.w, s.h);
  } else g.drawImage(s.c, -s.w / 2, -s.h / 2, s.w, s.h);
  g.restore();
}
function slamK(t, t0, t1, s0 = 2.4) {
  if (t < t0 || t > t1) return null;
  const u = P(t, t0, t0 + .17), out = P(t, t1 - .14, t1);
  return { a: Math.min(1, P(t, t0, t0 + .05)) * (1 - out), sc: lerp(s0, 1, back(u, 2.2)) * (1 + .1 * out) * (1 + .012 * Math.sin((t - t0) * 9)) };
}

// ===================== アプリの画面（画面いっぱい） =====================
const STATUS = IPAD ? 24 : 58, HDR = META.header.H, TABH = IPAD ? 0 : META.tabbar.H, HOME = IPAD ? 20 : 34;
const VTOP = STATUS + HDR, VH = H - VTOP - TABH - HOME;
$('vp').style.top = VTOP + 'px'; $('vp').style.height = VH + 'px';
const ZN = n => `#result ol.zones > li:nth-child(${n})`, BT = t => `#recCard [data-k=types] button[data-v="${t}"]`;
const B = (k, sel) => META[k].b[sel];
// その要素の上が、画面の y（上から）にくるスクロール量（下に余りが出ないように）
const at = (k, sel, y) => Math.max(0, Math.min(META[k].H - VH, B(k, sel).y - (y - VTOP)));
const FY = IPAD ? 120 : 180;   // 見せたいところを置く高さ（テロップは下なので、上のほう）
const yIn1 = IPAD ? 0 : at('judge_filled', '.input-col > .card:nth-child(1) .fields', FY), yIn2 = at('judge_filled', '.input-col > .card:nth-child(2)', FY - 10), yIn3 = at('judge_filled', '.input-col > .card:nth-child(3)', FY - 10);
const yF = at('judge_filled', '#result', FY - 10), yZ1 = at('judge_filled', ZN(1), FY - 10);
const yRT = at('rec_lk0', '#recCard [data-k=types]', IPAD ? 640 : 420);
const yW5 = IPAD ? 0 : at('w5_5', '#w5Mode', FY + 10), yW5z = at('w5_rand', '#w5Races .w5race[data-i="0"] .w5zones', IPAD ? 260 : FY + 60);
const C2 = B('judge_filled', '.input-col > .card:nth-child(2)');
const ODDS_BOX = { x: C2.x, y: C2.y, w: C2.w, h: Math.min(C2.h, IPAD ? 640 : 430) };
const HD = IPAD ? { judge: 'header_oi0', w5: 'header_w5' } : { judge: 'header_oi0', w5: 'header_oi3' };
const TB = list => IPAD ? [] : list;
const SCENES = [   // 時刻はCMの時刻
  // ポイントで画像を読み取り レースを判定しよう!!（読み取り −200P → 距離・頭数・馬場 → 単勝 → 3連単）
  { a: 15.2, b: 23.2, hdr: [[HD.judge, 15.2]], tab: TB([['tabbar_judge', 15.2]]),
    views: [{ k: 'judge_empty', a: 15.2 }, { k: 'judge_reading', a: 16.55, fade: .12 }, { k: 'judge_filled', a: 17.9, fade: .2 }],
    scroll: { judge_empty: () => 0, judge_reading: () => 0,
              judge_filled: t => t < 19.6 ? lerp(0, yIn1, eio(P(t, 17.95, 18.4))) : t < 21.4 ? lerp(yIn1, yIn2, eio(P(t, 19.6, 19.95))) : lerp(yIn2, yIn3, eio(P(t, 21.4, 21.75))) },
    rings: [{ a: 15.65, b: 16.05, k: 'judge_empty', sel: ['#ocrBtn'] }, { a: 16.7, b: 17.8, k: 'judge_reading', sel: ['#ocrMsg'] },
            { a: 18.45, b: 19.55, k: 'judge_filled', each: ['.f:has(> #fDist)', '.f:has(> #fN)', '.f:has(> #fBaba)'] }, { a: 20.0, b: 21.35, k: 'judge_filled', box: ODDS_BOX },
            { a: 21.8, b: 23.1, k: 'judge_filled', sel: ['.input-col > .card:nth-child(3)'] }],
    taps: [{ t: 16.0, k: 'judge_empty', sel: '#ocrBtn', fx: .5 }] },
  // 誰でも簡単に! 1発でゾーンまで判定!!
  { a: 23.2, b: 29.6, hdr: [[HD.judge, 23.2]], tab: TB([['tabbar_judge', 23.2]]), views: [{ k: 'judge_filled', a: 23.2 }],
    scroll: { judge_filled: t => t < 25.2 ? lerp(yIn3, yF, eio(P(t, 23.2, 23.65))) : lerp(yF, yZ1, eio(P(t, 25.2, 25.55))) },
    rings: [{ a: 23.8, b: 25.1, k: 'judge_filled', sel: ['#result .vhead'] }, { a: 25.6, b: 26.8, k: 'judge_filled', sel: [ZN(1) + ' .zflow', ZN(1) + ' .znums'] },
            { a: 26.85, b: 28.0, k: 'judge_filled', sel: [ZN(1) + ' .zthird'] }, { a: 28.1, b: 29.5, k: 'judge_filled', sel: [ZN(1) + ' .zref'] }], taps: [] },
  // Pカスタムで 自分だけのテンゲルを 育てよう!!（券種：はじめは単勝・馬単・3連単 → 複勝・馬連を500Pずつで解放）

const CKEYS = [], HKEYS = [], TKEYS = [];

Object.assign($('ppill').style, IPAD ? { right: PP.right + 'px', top: PP.top + 'px' } : { left: PP.left + 'px', top: PP.top + 'px' });
