<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>テンゲルⅢ App Storeプレビュー</title>
<style>
/* App Storeのプレビュー動画（App Preview）：アプリの画面だけで作る（審査ガイドライン 2.3.4：プレビューはアプリそのものの画面の録画だけ。文字を重ねるのはOK）
   画面いっぱいにアプリ（6.9インチのiPhoneと同じ幅443・886×1920）。CMと同じ音楽・同じテロップ・同じタイミング。
   CMの前置き・エンブレム・スロットのリール・紙吹雪などアプリにないものは使わない */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:#eceef3}
body{font-family:'Noto Sans CJK JP','Hiragino Sans',sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#scr{position:absolute;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:#eceef3}
#status{position:absolute;left:0;top:0;width:var(--W);height:58px;background:#eceef3;color:#111;z-index:3}
.ipad #status{height:24px}.ipad #status .tm{left:22px;top:5px;font-size:13px}.ipad #status .dt{position:absolute;left:62px;top:5px;font-size:13px;font-weight:600}
.ipad #status .isl{display:none}.ipad #status .ic{right:20px;top:7px}
#status .tm{position:absolute;left:44px;top:19px;font-weight:700;font-size:16.5px;letter-spacing:.01em}
#status .isl{position:absolute;left:162px;top:11px;width:119px;height:35px;border-radius:18px;background:#000}
#status .ic{position:absolute;right:30px;top:22px;display:flex;gap:6px;align-items:flex-end}
#status .bars i{display:inline-block;width:3.5px;background:#111;border-radius:1px;margin-left:1.5px}
#status .bat{width:26px;height:12.5px;border:1.5px solid rgba(17,17,17,.85);border-radius:4px;position:relative}
#status .bat::after{content:"";position:absolute;left:1.8px;top:1.8px;width:17px;height:6px;background:#111;border-radius:1.5px}
.hdr{position:absolute;left:0;top:58px;width:var(--W);z-index:2}
.ipad .hdr{top:24px}
#vp{position:absolute;left:0;width:var(--W);overflow:hidden;background:#eceef3}
.cimg{position:absolute;left:0;top:0;width:var(--W)}
.tab{position:absolute;left:0;width:var(--W);z-index:2}
#home{position:absolute;left:0;bottom:0;width:var(--W);height:34px;background:#fff;z-index:2}
#home::after{content:"";position:absolute;left:calc(50% - 72px);top:20px;width:143px;height:5px;border-radius:3px;background:#111}
.ipad #home{height:20px;background:#eceef3}.ipad #home::after{left:calc(50% - 160px);top:11px;width:320px}
.ring{position:absolute;border:3px solid #ffcf3a;border-radius:10px;box-shadow:0 0 0 2px rgba(80,0,0,.4),0 0 18px rgba(255,190,40,.95),inset 0 0 10px rgba(255,190,40,.4);z-index:4}
.rip{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 14px rgba(255,200,90,.95),inset 0 0 6px rgba(255,200,90,.6);z-index:4}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(40,40,60,.32);box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 0 14px rgba(255,190,70,.9);z-index:4}
#scrim{position:absolute;left:0;top:0;width:var(--W);height:330px;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,11,28,.95) 0%,rgba(8,11,28,.9) 52%,rgba(8,11,28,.55) 76%,rgba(8,11,28,0) 100%)}
.ipad #scrim{top:auto;bottom:0;background:linear-gradient(0deg,rgba(8,11,28,.95) 0%,rgba(8,11,28,.9) 55%,rgba(8,11,28,.55) 78%,rgba(8,11,28,0) 100%)}
#dim{position:absolute;left:0;top:0;width:var(--W);height:var(--H);z-index:5;background:rgba(6,9,24,1);opacity:0}
canvas{position:absolute;left:0;top:0;width:var(--W);height:var(--H);z-index:7}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity;z-index:8}
.center{width:var(--W);text-align:center}
.ipad .sub{font-size:27px;padding:9px 24px 10px;border-radius:12px}.ipad .foot{font-size:16px}.ipad #eSub{font-size:22px}.ipad #disc{width:900px;font-size:15px}
.sub{display:inline-block;padding:6px 15px 7px;border-radius:9px;border:2px solid #ffd45c;background:linear-gradient(180deg,#6a000c,#1c0003);
  box-shadow:0 0 14px rgba(255,150,0,.6),inset 0 0 9px rgba(255,80,0,.35);font-weight:900;font-size:17.5px;letter-spacing:.04em;white-space:nowrap;text-shadow:0 2px 0 #000}
.sub.blue{border-color:#8fe6ff;background:linear-gradient(180deg,#0b3478,#020a22);box-shadow:0 0 14px rgba(80,200,255,.6),inset 0 0 9px rgba(80,200,255,.3)}
.foot{font-size:11px;color:rgba(235,235,235,.85);letter-spacing:.02em;text-shadow:0 1px 2px #000}
#eSub{font-size:14px;font-weight:700;letter-spacing:.05em;color:#fff;text-shadow:0 1px 3px #000}
#disc{width:420px;font-size:10px;line-height:1.75;color:rgba(232,232,232,.86);text-shadow:0 1px 2px #000}
</style></head>
<body>
<div id="scr">
  <div id="status"><span class="tm">9:41</span><span class="dt">10月14日(水)</span><span class="isl"></span>
    <span class="ic"><span class="bars"><i style="height:5px"></i><i style="height:7.5px"></i><i style="height:10px"></i><i style="height:12.5px"></i></span><span class="bat"></span></span></div>
  <div id="hdrs"></div>
  <div id="vp"><div id="cimgs"></div>
    <div class="ring" id="ring" style="display:none"></div>
    <div class="rip" id="rip" style="display:none"></div>
    <div class="dot" id="dot" style="display:none"></div>
  </div>
  <div id="tabs"></div>
  <div id="home"></div>
  <div id="scrim"></div>
  <div id="dim"></div>
</div>
<canvas id="fx"></canvas>
<div class="abs center" id="csub"><span class="sub"></span></div>
<div class="abs center foot" id="cfoot">※画像の読み取りには、AnthropicのAPIキー（有料）が必要です</div>
<div class="abs center" id="eSub">スクショで判定・買い目を編集・収支を記録</div>
<div class="abs center" id="disc">※画面は架空のレースの例です。的中や利益を約束するものではありません。<br>※画像の読み取りには、AnthropicのAPIキー（有料）が必要です。<br>※馬券は20歳になってから。無理のない範囲で楽しみましょう。<br>※本アプリは、競馬の主催者・団体とは関係のない非公式のアプリです。</div>

<script>
const META = window.__META, SHOTS = window.__SHOTS || 'shots_prev';
// iPad版（13インチ・1200×1600）：アプリはiPadの画面（タブは上）・テロップは下に出す（判定の画面の上のほうを隠さないように）
const IPAD = !!window.__IPAD;
const W = IPAD ? 1032 : 443, H = IPAD ? 1376 : 960, DUR = 29.5;
const $ = id => document.getElementById(id);
document.documentElement.style.setProperty('--W', W + 'px'); document.documentElement.style.setProperty('--H', H + 'px');
if (IPAD) document.documentElement.classList.add('ipad');
$('fx').width = W * 2; $('fx').height = H * 2;
if (!IPAD) $('status').querySelector('.dt').remove();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const env = (t, a, b, fi = .2, fo = .15) => (t < a || t > b) ? 0 : Math.min(eo(P(t, a, a + fi)), 1 - P(t, b - fo, b));

// ===================== 文字の絵（CMと同じ作り方） =====================
const FILL = {
  gold: [[0, '#fffbe6'], [.28, '#ffe27a'], [.49, '#ffb300'], [.52, '#fff1b8'], [.78, '#e07b00'], [1, '#ffe08a']],
  fire: [[0, '#fffde0'], [.3, '#ffe14d'], [.62, '#ff8400'], [1, '#d81b00']],
  white: [[0, '#ffffff'], [.6, '#f4f4f4'], [1, '#c9d2e6']],
  blue: [[0, '#f2fbff'], [.4, '#9fe3ff'], [.5, '#ffffff'], [.75, '#38a8ff'], [1, '#a9e8ff']],
  rainbow: [[0, '#ff3b3b'], [.18, '#ff9d00'], [.36, '#ffe600'], [.54, '#3ee05a'], [.72, '#2fa8ff'], [.9, '#b04dff'], [1, '#ff4fd8']],
};
const SPR = {};
function mkText(key, text, o) {
  const size = o.size, pad = Math.ceil(size * .5), font = `900 ${size}px "Noto Sans CJK JP"`;
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = font;
  const tw = g.measureText(text).width, w = Math.ceil(tw + pad * 2 + size * .3), h = Math.ceil(size * 1.3 + pad * 2);
  c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  g.font = font; g.textBaseline = 'middle'; g.textAlign = 'center'; g.lineJoin = 'round'; g.miterLimit = 2;
  g.translate(w / 2, h / 2); g.transform(1, 0, -(o.skew ?? .12), 1, 0, 0);
  const s1 = o.s1 ?? '#2a0000', s2 = o.s2 ?? '#fff4c8', ext = o.ext ?? '#4a0000';
  if (o.glow) { g.save(); g.shadowColor = o.glow; g.shadowBlur = size * .45; g.strokeStyle = o.glow; g.lineWidth = size * .24; g.strokeText(text, 0, 0); g.restore(); }
  const depth = o.depth ?? Math.max(2, Math.round(size * .08));
  g.strokeStyle = ext; g.fillStyle = ext; g.lineWidth = size * .22;
  for (let i = depth; i >= 1; i--) { g.strokeText(text, i * .3, i); g.fillText(text, i * .3, i); }
  g.strokeStyle = s1; g.lineWidth = size * .22; g.strokeText(text, 0, 0);
  g.strokeStyle = s2; g.lineWidth = size * .09; g.strokeText(text, 0, 0);
  const gr = o.dir === 'h' ? g.createLinearGradient(-tw / 2, 0, tw / 2, 0) : g.createLinearGradient(0, -size * .55, 0, size * .55);
  FILL[o.fill].forEach(([p, col]) => gr.addColorStop(p, col));
  g.fillStyle = gr; g.fillText(text, 0, 0);
  SPR[key] = { c, w, h };
}
function mkRibbon(key, text, o) {
  const w = o.w, h = o.h, size = o.size;
  const c = document.createElement('canvas'), g = c.getContext('2d'); c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  const sk = h * .35;
  const path = () => { g.beginPath(); g.moveTo(sk, 0); g.lineTo(w, 0); g.lineTo(w - sk, h); g.lineTo(0, h); g.closePath(); };
  path(); const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#d4001a'); gr.addColorStop(.55, '#8a000d'); gr.addColorStop(1, '#4a0006');
  g.fillStyle = gr; g.fill();
  g.lineWidth = 3; g.strokeStyle = '#ffd45c'; path(); g.stroke();
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.moveTo(sk + 4, 4); g.lineTo(w - 6, 4); g.stroke();
  g.font = `900 ${size}px "Noto Sans CJK JP"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.save(); g.translate(w / 2, h / 2 + 1); g.transform(1, 0, -.1, 1, 0, 0);
  g.lineWidth = size * .22; g.strokeStyle = '#2a0000'; g.strokeText(text, 0, 0);
  const tg = g.createLinearGradient(0, -size / 2, 0, size / 2); FILL.gold.forEach(([p, col]) => tg.addColorStop(p, col));
  g.fillStyle = tg; g.fillText(text, 0, 0); g.restore();
  SPR[key] = { c, w, h };
}
let tmpC, tmpG;
function drawSpr(g, key, x, y, sc = 1, a = 1, rot = 0, opt = {}) {
  const s = SPR[key]; if (!s || a <= .001 || sc <= .001) return;
  g.save(); g.globalAlpha = g.globalAlpha * clamp(a); g.translate(x, y); if (rot) g.rotate(rot); g.scale(sc, sc);
  if (opt.hue != null) g.filter = `hue-rotate(${opt.hue}deg) saturate(1.25)`;
  if (opt.shine != null && opt.shine > -0.2 && opt.shine < 1.2) {
    if (!tmpC) { tmpC = document.createElement('canvas'); tmpG = tmpC.getContext('2d'); }
    if (tmpC.width < s.c.width || tmpC.height < s.c.height) { tmpC.width = Math.max(tmpC.width, s.c.width); tmpC.height = Math.max(tmpC.height, s.c.height); }
    tmpG.globalCompositeOperation = 'source-over'; tmpG.clearRect(0, 0, tmpC.width, tmpC.height);
    tmpG.drawImage(s.c, 0, 0);
    tmpG.globalCompositeOperation = 'source-atop';
    const bx = lerp(-.3, 1.3, opt.shine) * s.c.width, bw = s.c.width * .18;
    const lg = tmpG.createLinearGradient(bx - bw, 0, bx + bw, s.c.height * .3);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.85)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    tmpG.fillStyle = lg; tmpG.fillRect(0, 0, s.c.width, s.c.height);
    g.drawImage(tmpC, 0, 0, s.c.width, s.c.height, -s.w / 2, -s.h / 2, s.w, s.h);
  } else g.drawImage(s.c, -s.w / 2, -s.h / 2, s.w, s.h);
  g.restore();
}
function slamK(t, t0, t1, s0 = 2.4) {
  if (t < t0 || t > t1) return null;
  const u = P(t, t0, t0 + .17), out = P(t, t1 - .14, t1);
  return { a: Math.min(1, P(t, t0, t0 + .05)) * (1 - out), sc: lerp(s0, 1, back(u, 2.2)) * (1 + .1 * out) * (1 + .012 * Math.sin((t - t0) * 9)) };
}

// ===================== アプリの画面（画面いっぱい） =====================
const STATUS = IPAD ? 24 : 58, HDR = META.header.H, TABH = IPAD ? 0 : META.tabbar.H, HOME = IPAD ? 20 : 34;
const FY = IPAD ? 200 : 300;   // 見せたいところを置く画面の高さ（iPhoneはテロップの下、iPadは上のほう）
const VTOP = STATUS + HDR, VH = H - VTOP - TABH - HOME;
$('vp').style.top = VTOP + 'px'; $('vp').style.height = VH + 'px';
const Z1 = '#zoneCard ol.zedit > li:nth-child(1)', S2 = '#slotList .slotrow[data-n="2"]', ZN = n => `#result ol.zones > li:nth-child(${n})`;
const B = (k, sel) => META[k].b[sel];
// その要素の上が、画面の y（上から）にくるスクロール量
const at = (k, sel, y) => Math.max(0, B(k, sel).y - (y - VTOP));
const yF = at('judge_filled', '#result', FY), yZ = at('set_z0', '#zoneCard .zk-head', FY - 4), yC = at('judge_custom', '#result', FY);
const yM0 = at('set_m0', '#slotList', FY), yM1 = at('set_m1', '#smPreview', FY + 30), yM3 = at('set_m3', '#slotList', FY), yJ = at('judge_jra', '#result', FY);
const yP = at('judge_pick0', ZN(2), FY + 30), yW = at('win5', '#w5Sum', FY);
// 上の帯：iPadはタブが上にあるので、そのタブを選んだ状態で撮ったもの
const HD = IPAD ? { judge: 'header_oi0', set: 'header_set0', jc: 'header_jc', setc: 'header_oi3c', jra: 'header_jra', jj: 'header_jj', w5: 'header_w5', rec: 'header_oi3' }
                : { judge: 'header_oi0', set: 'header_oi3', jc: 'header_oi3c', setc: 'header_oi3c', jra: 'header_jra', jj: 'header_jra', w5: 'header_oi3', rec: 'header_oi3' };
const TB = list => IPAD ? [] : list;   // 下のタブバー（iPadはない）
// スクロール：iPadの判定の画面は、左に入力・右に判定（スクロールしなくても見える）
const Q0 = IPAD ? () => 0 : t => lerp(yF - 40, yF + 30, eio(P(t, 0, 3.2)));
const Q1 = IPAD ? () => 0 : t => t < 6.0 ? lerp(0, 70, eio(P(t, 5.35, 5.8))) : t < 7.2 ? lerp(70, yF, eio(P(t, 6.0, 6.42))) : lerp(yF, yF + 120, eio(P(t, 7.2, 7.6)));
const Q2 = IPAD ? t => lerp(0, 110, eio(P(t, 8.6, 9.6))) : t => lerp(yF + 120, yF + 330, eio(P(t, 8.6, 9.5)));
const QC = IPAD ? t => lerp(0, 50, eio(P(t, 13.9, 15.0))) : t => lerp(yC, yC + 60, eio(P(t, 13.9, 15.0)));
const QJ = IPAD ? t => lerp(0, 30, eio(P(t, 19.1, 19.9))) : t => lerp(yJ, yJ + 30, eio(P(t, 19.1, 19.9)));
const Q5 = IPAD ? t => lerp(30, 190, eio(P(t, 20.6, 22.8))) : t => lerp(yJ + 30, yJ + 230, eio(P(t, 20.6, 22.8)));
const Q7 = IPAD ? t => lerp(0, 50, eio(P(t, 25.6, 29.5))) : t => lerp(yF - 60, yF + 40, eio(P(t, 25.6, 29.5)));
const SCENES = [
  // 0：はじめ（判定の画面にタイトル）
  { a: 0, b: 3.2, hdr: [[HD.judge, 0]], tab: TB([['tabbar_judge', 0]]), views: [{ k: 'judge_filled', a: 0 }],
    scroll: { judge_filled: Q0 }, rings: [], taps: [] },
  // 1：スクショを選ぶだけで即判定
  { a: 3.2, b: 8.0, hdr: [[HD.judge, 3.2]], tab: TB([['tabbar_judge', 3.2]]),
    views: [{ k: 'judge_empty', a: 3.2 }, { k: 'judge_reading', a: 4.4, fade: .1 }, { k: 'judge_filled', a: 5.2, fade: .22 }],
    scroll: { judge_empty: () => 0, judge_reading: () => 0, judge_filled: Q1 },
    rings: [{ a: 5.4, b: 6.0, k: 'judge_filled', sel: ['.input-col > .card:nth-child(1) .fields'] }, { a: 6.45, b: 7.2, k: 'judge_filled', sel: ['#result .lbadge'] },
            { a: 7.65, b: 7.95, k: 'judge_filled', sel: [ZN(1) + ' .zflow', ZN(1) + ' .znums'] }],
    taps: [{ t: 4.0, k: 'judge_empty', sel: '#ocrBtn', fx: .32 }] },
  // 2：1着・2着・3着のゾーン
  { a: 8.0, b: 10.4, hdr: [[HD.judge, 8.0]], tab: TB([['tabbar_judge', 8.0]]), views: [{ k: 'judge_filled', a: 8.0 }],
    scroll: { judge_filled: Q2 },
    rings: [{ a: 8.05, b: 8.6, k: 'judge_filled', sel: [ZN(1) + ' .zflow', ZN(1) + ' .znums'] }, { a: 8.65, b: 9.55, k: 'judge_filled', sel: [ZN(1) + ' .zthird'] },
            { a: 9.6, b: 10.35, k: 'judge_filled', sel: [ZN(2)] }], taps: [] },
  // 3：買い目編集
  { a: 10.4, b: 15.2, hdr: [[HD.set, 10.4], [HD.jc, 13.6, .25]], tab: TB([['tabbar_set', 10.4], ['tabbar_judge', 13.6]]),
    views: [{ k: 'set_z0', a: 10.4 }, { k: 'set_z1', a: 11.25, fade: .08 }, { k: 'set_z2', a: 12.05, fade: .08 }, { k: 'judge_custom', a: 13.6, slide: .32 }],
    scroll: { set_z0: () => yZ, set_z1: () => yZ, set_z2: t => lerp(yZ, yZ + 40, eio(P(t, 12.6, 13.2))), judge_custom: QC },
    rings: [{ a: 11.3, b: 12.0, k: 'set_z1', sel: [Z1 + ' .zpick[data-f="b"] button[data-z="大穴"]'] }, { a: 12.1, b: 12.8, k: 'set_z2', sel: [Z1 + ' .zpick[data-f="t"] button[data-z="大穴"]'] },
            { a: 12.85, b: 13.55, k: 'set_z2', sel: [Z1 + ' .zr-stat'] },
            { a: 13.95, b: 14.75, k: 'judge_custom', sel: ['#result .vhead .chip.cus'] }, { a: 14.8, b: 15.15, k: 'judge_custom', sel: [ZN(1) + ' .zflow', ZN(1) + ' .znums'] }],
    taps: [{ t: 11.2, k: 'set_z0', sel: Z1 + ' .zpick[data-f="b"] button[data-z="大穴"]', fx: .5 }, { t: 12.0, k: 'set_z1', sel: Z1 + ' .zpick[data-f="t"] button[data-z="大穴"]', fx: .5 }] },
  // 4：自分のデータ（マザーデータ）
  { a: 15.2, b: 20.0, hdr: [[HD.setc, 15.2], [HD.jra, 18.4, .2], [HD.jj, 18.8]], tab: TB([['tabbar_set', 15.2], ['tabbar_judge', 18.8]]),
    views: [{ k: 'set_m0', a: 15.2 }, { k: 'set_m1', a: 16.3, fade: .14 }, { k: 'set_m3', a: 18.4, fade: .16 }, { k: 'judge_jra', a: 18.8, slide: .32 }],
    scroll: { set_m0: () => yM0, set_m1: t => lerp(yM0, yM1, eio(P(t, 16.5, 16.95))), set_m3: () => yM3, judge_jra: QJ },
    rings: [{ a: 15.6, b: 16.2, k: 'set_m0', sel: [S2] }, { a: 17.0, b: 17.25, k: 'set_m1', sel: ['#smPreview'] }, { a: 18.45, b: 18.8, k: 'set_m3', sel: [S2] },
            { a: 19.1, b: 19.95, k: 'judge_jra', sel: ['#result .vhead .chips'] }],

  // 5：自分だけのテンゲル（自分のデータで判定）
