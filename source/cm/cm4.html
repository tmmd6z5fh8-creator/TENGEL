<script>

const $ = id => document.getElementById(id);

  ['競馬の主催者・団体とは関係のない、', '非公式のアプリです'],
] : [
  ['画面は架空のレースの例です'],
  ['過去のデータの傾向を表示する道具です。', '的中や利益を約束するものではありません'],
  ['馬券は20歳になってから。', '無理のない範囲で楽しみましょう'],
  ['画像の読み取りには、AnthropicのAPIキー', '（有料）が必要です'],
  ['競馬の主催者とは関係のない、非公式のアプリです。', '「JRA」「WIN5」は日本中央競馬会の', '商標または登録商標です'],
];
const DISC_SMALL = APPV ? ['iPhone・iPadは、米国その他の国で登録されたApple Inc.の商標です。', 'iPhoneの商標は、アイホン株式会社のライセンスにもとづき使用されています。']
  : ['iPhoneの商標は、アイホン株式会社のライセンスにもとづき使用されています。'];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };

const env = (t, a, b, fi = .2, fo = .15) => (t < a || t > b) ? 0 : Math.min(eo(P(t, a, a + fi)), 1 - P(t, b - fo, b));

const TAU = Math.PI * 2;

// ===================== 合図（BGMと同じ時刻） =====================
// 第4弾は控えめ：アプリの画面を見せている間（3.2〜25.6秒）のゆれは小さく
const HITS = [[1.2, 10], [1.6, 6], [3.2, 4], [6.4, 5], [8.0, 3], [9.6, 5], [10.4, 3], [15.2, 3], [20.0, 6], [20.4, 3], [20.8, 4], [23.2, 4], [24.0, 3], [24.8, 3], [25.6, 9], [26.4, 5], [30.0, 6]];
const FLASH = [[1.2, .75, .3], [3.2, .5, .2], [6.4, .3, .16], [8.0, .4, .18], [9.6, .35, .16], [10.4, .45, .2], [15.2, .45, .2], [20.0, .4, .18], [23.2, .3, .14], [24.0, .25, .12], [24.8, .25, .12], [25.6, .7, .28], [30.0, .5, .3]];
// 衝撃の輪（大きな文字がたたきつけられるとき）
const SHOCK = [];   // 第4弾は衝撃の輪なし
const RAINBOW = [[9.6, .35, .4], [20.0, .45, .5]];
const SPEED = [[3.2, .3], [6.4, .22], [8.0, .25], [9.6, .3], [10.4, .25], [15.2, .3], [20.0, .4], [23.2, .25], [24.0, .2], [24.8, .2], [25.6, .4]];
const BURSTS = [   // テロップが出るところで、少しだけ
  { t: 1.2, x: 270, y: 330, n: 90, sp: 480, hue: 45 }, { t: 1.6, x: 270, y: 520, n: 50, sp: 380, hue: 40 },
  { t: 6.4, x: 270, y: 174, n: 40, sp: 340, hue: 25 }, { t: 9.6, x: 270, y: 174, n: 60, sp: 400, hue: -1 },
  { t: 10.6, x: 270, y: 174, n: 36, sp: 320, hue: 45 }, { t: 15.6, x: 270, y: 174, n: 36, sp: 320, hue: 195 },
  { t: 20.8, x: 270, y: 226, n: 70, sp: 440, hue: -1 },
  { t: 23.2, x: 270, y: 174, n: 30, sp: 320, hue: 40 }, { t: 24.0, x: 270, y: 174, n: 30, sp: 320, hue: 40 }, { t: 24.8, x: 270, y: 174, n: 30, sp: 320, hue: 40 },
  { t: 25.6, x: 270, y: 232, n: 100, sp: 520, hue: 45 }, { t: 26.4, x: 270, y: 516, n: 40, sp: 380, hue: 0 },
];

// ===================== 文字の絵（あらかじめ描いておく） =====================
const FILL = {
  gold: [[0, '#fffbe6'], [.28, '#ffe27a'], [.49, '#ffb300'], [.52, '#fff1b8'], [.78, '#e07b00'], [1, '#ffe08a']],
  fire: [[0, '#fffde0'], [.3, '#ffe14d'], [.62, '#ff8400'], [1, '#d81b00']],
  white: [[0, '#ffffff'], [.6, '#f4f4f4'], [1, '#c9d2e6']],
  blue: [[0, '#f2fbff'], [.4, '#9fe3ff'], [.5, '#ffffff'], [.75, '#38a8ff'], [1, '#a9e8ff']],
  rainbow: [[0, '#ff3b3b'], [.18, '#ff9d00'], [.36, '#ffe600'], [.54, '#3ee05a'], [.72, '#2fa8ff'], [.9, '#b04dff'], [1, '#ff4fd8']],
};
const SPR = {};
function mkText(key, text, o) {
  const size = o.size, pad = Math.ceil(size * .5), font = `900 ${size}px "Noto Sans CJK JP"`;
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = font;
  const tw = g.measureText(text).width, w = Math.ceil(tw + pad * 2 + size * .3), h = Math.ceil(size * 1.3 + pad * 2);
  c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  g.font = font; g.textBaseline = 'middle'; g.textAlign = 'center'; g.lineJoin = 'round'; g.miterLimit = 2;
  g.translate(w / 2, h / 2); g.transform(1, 0, -(o.skew ?? .12), 1, 0, 0);
  const s1 = o.s1 ?? '#2a0000', s2 = o.s2 ?? '#fff4c8', ext = o.ext ?? '#4a0000';
  if (o.glow) { g.save(); g.shadowColor = o.glow; g.shadowBlur = size * .45; g.strokeStyle = o.glow; g.lineWidth = size * .24; g.strokeText(text, 0, 0); g.restore(); }
  const depth = o.depth ?? Math.max(2, Math.round(size * .08));
  g.strokeStyle = ext; g.fillStyle = ext; g.lineWidth = size * .22;
  for (let i = depth; i >= 1; i--) { g.strokeText(text, i * .3, i); g.fillText(text, i * .3, i); }
  g.strokeStyle = s1; g.lineWidth = size * .22; g.strokeText(text, 0, 0);
  g.strokeStyle = s2; g.lineWidth = size * .09; g.strokeText(text, 0, 0);
  const gr = o.dir === 'h' ? g.createLinearGradient(-tw / 2, 0, tw / 2, 0) : g.createLinearGradient(0, -size * .55, 0, size * .55);
  FILL[o.fill].forEach(([p, col]) => gr.addColorStop(p, col));
  g.fillStyle = gr; g.fillText(text, 0, 0);
  SPR[key] = { c, w, h };
}
function mkRibbon(key, text, o) {
  const w = o.w, h = o.h, size = o.size;
  const c = document.createElement('canvas'), g = c.getContext('2d'); c.width = w * 2; c.height = h * 2; g.scale(2, 2);
  const sk = h * .35;
  const path = () => { g.beginPath(); g.moveTo(sk, 0); g.lineTo(w, 0); g.lineTo(w - sk, h); g.lineTo(0, h); g.closePath(); };
  path(); const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, o.c1 || '#d4001a'); gr.addColorStop(.55, o.c2 || '#8a000d'); gr.addColorStop(1, o.c3 || '#4a0006');
  g.fillStyle = gr; g.fill();
  g.lineWidth = 3; g.strokeStyle = '#ffd45c'; path(); g.stroke();
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.moveTo(sk + 4, 4); g.lineTo(w - 6, 4); g.stroke();
  g.font = `900 ${size}px "Noto Sans CJK JP"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.save(); g.translate(w / 2, h / 2 + 1); g.transform(1, 0, -.1, 1, 0, 0);
  g.lineWidth = size * .22; g.strokeStyle = '#2a0000'; g.strokeText(text, 0, 0);
  const tg = g.createLinearGradient(0, -size / 2, 0, size / 2); FILL.gold.forEach(([p, col]) => tg.addColorStop(p, col));
  g.fillStyle = o.white ? '#fff' : tg; g.fillText(text, 0, 0); g.restore();

function mkBadge(key, text, size) {
  const R = size, c = document.createElement('canvas'), g = c.getContext('2d'), w = R * 2 + 20; c.width = c.height = w * 2; g.scale(2, 2);
  g.translate(w / 2, w / 2);
  g.beginPath(); for (let i = 0; i < 32; i++) { const r = i % 2 ? R * .78 : R, a = i / 32 * TAU; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath();
  const gr = g.createRadialGradient(0, -R * .3, R * .1, 0, 0, R); gr.addColorStop(0, '#fff36b'); gr.addColorStop(.55, '#ff7a00'); gr.addColorStop(1, '#d10014');
  g.fillStyle = gr; g.fill(); g.lineWidth = 4; g.strokeStyle = '#fff'; g.stroke(); g.lineWidth = 2; g.strokeStyle = '#7a0000'; g.stroke();
  g.font = `900 ${R * .5}px "Noto Sans CJK JP"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.rotate(-.12); g.lineWidth = R * .16; g.strokeStyle = '#6a0000'; g.strokeText(text, 0, 2); g.fillStyle = '#fff'; g.fillText(text, 0, 2);
  SPR[key] = { c, w, h: w };

let tmpC, tmpG;
function drawSpr(g, key, x, y, sc = 1, a = 1, rot = 0, opt = {}) {
  const s = SPR[key]; if (!s || a <= .001 || sc <= .001) return;
  g.save(); g.globalAlpha = g.globalAlpha * clamp(a); g.translate(x, y); if (rot) g.rotate(rot); g.scale(sc, sc);
  if (opt.hue != null) g.filter = `hue-rotate(${opt.hue}deg) saturate(1.25)`;
  if (opt.shine != null && opt.shine > -0.2 && opt.shine < 1.2) {
    if (!tmpC) { tmpC = document.createElement('canvas'); tmpG = tmpC.getContext('2d'); }
    if (tmpC.width < s.c.width || tmpC.height < s.c.height) { tmpC.width = Math.max(tmpC.width, s.c.width); tmpC.height = Math.max(tmpC.height, s.c.height); }
    tmpG.globalCompositeOperation = 'source-over'; tmpG.clearRect(0, 0, tmpC.width, tmpC.height);
    tmpG.drawImage(s.c, 0, 0);
    tmpG.globalCompositeOperation = 'source-atop';
    const bx = lerp(-.3, 1.3, opt.shine) * s.c.width, bw = s.c.width * .18;
    const lg = tmpG.createLinearGradient(bx - bw, 0, bx + bw, s.c.height * .3);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.85)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    tmpG.fillStyle = lg; tmpG.fillRect(0, 0, s.c.width, s.c.height);
    g.drawImage(tmpC, 0, 0, s.c.width, s.c.height, -s.w / 2, -s.h / 2, s.w, s.h);

// たたきつける動き（t0で出て、t1で消える）
function slamK(t, t0, t1, s0 = 2.4) {
  if (t < t0 || t > t1) return null;
  const u = P(t, t0, t0 + .17), out = P(t, t1 - .14, t1);

// ===================== スマホ =====================
const SW = 270, S = SW / 390, STATUS = 26, HDR = META.header.H * S, TABH = META.tabbar.H * S, HOME = 14, SH = 844 * S, BEZ = 10;
const VTOP = STATUS + HDR, VH = SH - STATUS - HDR - TABH - HOME;
$('vp').style.top = VTOP + 'px'; $('vp').style.height = VH + 'px';
const Z1 = '#zoneCard ol.zedit > li:nth-child(1)', S2 = '#slotList .slotrow[data-n="2"]', ZN = n => `#result ol.zones > li:nth-child(${n})`;
// スクロールの位置は、撮った画面の中の要素の位置から決める（文字を変えて高さがずれても合うように）
const Y = (k, sel) => META[k].b[sel].y;
const yF = Y('judge_filled', '#result') - 15, yZ = Y('set_z0', '#zoneCard .zk-head') - 25.4, yC = Y('judge_custom', '#result') - 13.6;
const yM0 = Y('set_m0', '#slotList') - 29.1, yM1 = Y('set_m1', '#smPreview') - 63.7, yM3 = Y('set_m3', '#slotList') - 21, yJ = Y('judge_jra', '#result') - 14.6;

const LAMPS = (() => {
  const pts = [], ins = 11, st = 22;
  for (let x = ins; x <= W - ins; x += st) pts.push([x, ins]);
  for (let y = ins + st; y <= H - ins; y += st) pts.push([W - ins, y]);
  for (let x = W - ins - st; x >= ins; x -= st) pts.push([x, H - ins]);
  for (let y = H - ins - st; y > ins; y -= st) pts.push([ins, y]);
  return pts;
})();
function lampMode(t) {

  if (t < 0.3) return ['off', 0, 'gold'];
  if (t < 1.2) return ['boot', 0, 'gold'];
  if (t >= 20.0 && t < 23.2) return ['rainbow', 0, 'rainbow'];

}

function drawBolts3(g, t) {
  [[6.38, 4, 80, 300], [6.4, 5, 460, 300], [9.58, 6, 70, 420], [9.6, 7, 470, 420], [14.38, 8, 90, 260], [20.0, 9, 60, 350], [20.02, 10, 480, 350], [29.98, 11, 100, 200], [30.0, 12, 440, 200]].forEach(([t0, s, x0, y1]) => {
    if (t >= t0 && t < t0 + .22) bolt(g, x0, -10, 270 + (x0 < 270 ? -60 : 60), y1, s * 13 + Math.floor((t - t0) * 30), (1 - P(t, t0, t0 + .22)) * (Math.floor(t * 60) % 2 ? 1 : .6));
  });
}

// ===================== 1コマを描く =====================
function punchAt(t) {   // カメラの押し込み（ヒットで一瞬大きく）
  let k = 0; HITS.forEach(([t0, amp]) => { if (t >= t0 && t < t0 + .3) k = Math.max(k, amp / 14 * Math.pow(1 - P(t, t0, t0 + .3), 2)); });
  return 1 + .055 * k;
}
function shakeAt(t) {
  let dx = 0, dy = 0;
  HITS.forEach(([t0, amp], i) => { if (t >= t0 && t < t0 + .3) { const k = amp * Math.pow(1 - P(t, t0, t0 + .3), 2); dx += (rnd(i, Math.floor(t * 60)) - .5) * 2 * k; dy += (rnd(i + 50, Math.floor(t * 60)) - .5) * 2 * k; } });
  return [dx, dy];
}
function render(t) {
  const [dx, dy] = shakeAt(t); $('world').style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px)`;
  drawBG(t);

  // エンディングのバナー
  const bu = P(t, 25.6, 25.8), fo = 1 - P(t, 29.85, 30.0); place($('banner'), 270, 250, t >= 25.6 ? Math.min(1, P(t, 25.6, 25.65)) * fo : 0, lerp(1.9, 1, back(bu, 2)) * (1 + .01 * Math.sin(t * 3)));
  // DOMの小さい文字
  const sub = SUBS.find(s => t >= s.a && t <= s.b), cs = $('csub');
  if (sub) { cs.firstChild.textContent = sub.s; cs.firstChild.className = 'sub' + (sub.blue ? ' blue' : ''); place(cs, 270, 254 + 8 * (1 - eo(P(t, sub.a, sub.a + .15))), env(t, sub.a, sub.b, .12, .1), lerp(1.25, 1, eo(P(t, sub.a, sub.a + .15)))); }
  else setVis(cs, 0);
  place($('cfoot'), 270, 936, env(t, 3.9, 6.05, .3, .15));
  place($('eSum'), 270, 586, eo(P(t, 26.8, 27.15)) * fo, lerp(1.15, 1, eo(P(t, 26.8, 27.1))));
  place($('ectaw'), 270, 650 + 14 * (1 - eo(P(t, 27.2, 27.6))), eo(P(t, 27.2, 27.55)) * fo, (.9 + .1 * back(P(t, 27.2, 27.6))) * (1 + .02 * Math.sin(t * 6) * P(t, 27.6, 28.0)));
  // 前面
  F.setTransform(2, 0, 0, 2, 0, 0); F.clearRect(0, 0, W, H);
  let sl = 0; SPEED.forEach(([t0, a]) => { if (t >= t0 && t < t0 + .35) sl = Math.max(sl, a * (1 - P(t, t0, t0 + .35))); });
  if (t >= 20.0 && t < 23.2) sl = Math.max(sl, .05);
  speedLines(F, sl, Math.floor(t * 30) * 3);
  drawIntro(F, t);
  drawBolts(F, t);
  drawCounter(F, t);
  drawCaps(F, t);
  drawClimax(F, t);
  drawEnding(F, t);
  drawDisclaimer(F, t);
  coins(F, t, 25.6, 28.2, 50, 22);
  confetti(F, t);
  sparkles(F, t, 1.2, 3.2, 10); sparkles(F, t, 20.0, 23.2, 10); sparkles(F, t, 25.6, 30.0, 12);
  bursts(F, t);
  drawFrame(F, t); drawLamps(F, t);
  flashes(F, t);
}
