<title>テンゲルⅢ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: アプリ型シェル — 夜の開催を思わせる紺の帯ヘッダー＋本文。スマホは1カラム＋下タブ、PCは「入力｜判定」の2ペイン */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#141A2E; --muted:#5A6175; --line:#D7DBE4;
  --night:#16203D; --night-ink:#F3F0E6; --lamp:#E2A23B;
  --primary:#1B2A55; --primary-ink:#FFFFFF; --focus:#E2A23B;
  --A:#2C67A8; --A-bg:#E3EDF8; --B:#A86F00; --B-bg:#FBF0D6; --C:#B8264F; --C-bg:#FBE3EA;
  --ok:#17784A; --ok-bg:#DDF2E6; --warn:#A14E06; --warn-bg:#FCEBD9; --bad:#A8231B; --bad-bg:#F9E0DE;
  --heat:#1B2A55;
  --w1:#FFFFFF; --w1i:#151515; --w2:#1A1A1A; --w2i:#FFFFFF; --w3:#D3232D; --w3i:#FFFFFF; --w4:#1E5BBE; --w4i:#FFFFFF;
  --w5:#F3CF1E; --w5i:#151515; --w6:#1D8A3B; --w6i:#FFFFFF; --w7:#F07E19; --w7i:#151515; --w8:#F38DB6; --w8i:#151515;
  --font-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --font-body:'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:10px; --gap:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1121; --surface:#141B31; --surface-2:#1A2340; --ink:#ECEEF5; --muted:#9BA3BB; --line:#2A3457;
  --night:#090E1C; --night-ink:#F3F0E6; --lamp:#F0B54E;
  --primary:#F0B54E; --primary-ink:#1C1300; --focus:#F0B54E;
  --A:#7DB1EC; --A-bg:#16294A; --B:#F2BE55; --B-bg:#3A2C0D; --C:#F27399; --C-bg:#40162A;
  --ok:#5FD39A; --ok-bg:#123726; --warn:#F3A45B; --warn-bg:#3D2410; --bad:#F2867D; --bad-bg:#401A17;
  --heat:#F0B54E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1121; --surface:#141B31; --surface-2:#1A2340; --ink:#ECEEF5; --muted:#9BA3BB; --line:#2A3457;
  --night:#090E1C; --night-ink:#F3F0E6; --lamp:#F0B54E;
  --primary:#F0B54E; --primary-ink:#1C1300; --focus:#F0B54E;
  --A:#7DB1EC; --A-bg:#16294A; --B:#F2BE55; --B-bg:#3A2C0D; --C:#F27399; --C-bg:#40162A;
  --ok:#5FD39A; --ok-bg:#123726; --warn:#F3A45B; --warn-bg:#3D2410; --bad:#F2867D; --bad-bg:#401A17;
  --heat:#F0B54E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);color:var(--night-ink);border-bottom:3px solid var(--lamp)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.04em;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--lamp)}
.brand .ver{font-size:12px;opacity:.75;letter-spacing:.06em}
.dbpill{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid rgba(243,240,230,.3);white-space:nowrap}
.dbpill.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5FD39A;margin-right:6px;vertical-align:1px}
.tabs-top{display:none;gap:4px}
.tabs-top button,.tabbar button{border:0;background:none;cursor:pointer}
.tabs-top button{color:var(--night-ink);opacity:.7;padding:6px 14px;border-radius:8px;font-weight:700}
.tabs-top button[aria-selected="true"]{opacity:1;background:rgba(243,240,230,.12);box-shadow:inset 0 -2px 0 var(--lamp)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{color:var(--primary)}
@media (min-width:900px){.tabs-top{display:flex}.tabbar{display:none}}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 96px}
@media (min-width:900px){main{padding-block:22px 48px}}
.view[hidden]{display:none}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:var(--gap)}
.card h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 12px;font-weight:700}
.card h3{font-size:15px;margin:0 0 8px}
.judge-grid{display:grid;gap:var(--gap)}
@media (min-width:900px){.judge-grid{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}.result-col{position:sticky;top:84px}}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.lab{font-size:12px;color:var(--muted);font-weight:700}
.f.s2{grid-column:span 2}.f.s3{grid-column:span 3}.f.s4{grid-column:span 4}.f.s6{grid-column:span 6}
input[type=text],input[type=number],input[type=date],input[type=password],input:not([type]),select,textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}
input[type=number]{appearance:textfield;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{font-size:14px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{flex:1;border:0;background:none;padding:8px 4px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.banner{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.banner.info{background:var(--A-bg);color:var(--ink)}
.banner.warn{background:var(--warn-bg);color:var(--ink)}
.banner.bad{background:var(--bad-bg);color:var(--ink)}
.banner b{font-weight:700}

/* odds grid */
.odds{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 18px}
@media (min-width:560px) and (max-width:899px){.odds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.orow{display:grid;grid-template-columns:2.1em minmax(0,.8fr) minmax(0,1.2fr);gap:8px;align-items:center}
.orow input{padding:5px 9px;font-size:15px;font-family:var(--font-mono)}
.oheads{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media (min-width:560px) and (max-width:899px){.oheads{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ohead{display:grid;grid-template-columns:2.1em minmax(0,.8fr) minmax(0,1.2fr);gap:8px;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.ohead.two{display:none}
@media (min-width:560px) and (max-width:899px){.ohead.two{display:grid}}
#result{scroll-margin-top:72px}
.num{display:inline-grid;place-items:center;min-width:1.85em;height:1.85em;padding:0 .3em;border-radius:6px;font-family:var(--font-mono);font-weight:600;font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.num.plain{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.w1{background:var(--w1);color:var(--w1i);box-shadow:inset 0 0 0 1px #8D93A3}.w2{background:var(--w2);color:var(--w2i);box-shadow:inset 0 0 0 1px #5A5F6B}
.w3{background:var(--w3);color:var(--w3i)}.w4{background:var(--w4);color:var(--w4i)}.w5{background:var(--w5);color:var(--w5i)}
.w6{background:var(--w6);color:var(--w6i)}.w7{background:var(--w7);color:var(--w7i)}.w8{background:var(--w8);color:var(--w8i)}

/* verdict */
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .big{font-family:var(--font-display);font-size:20px;color:var(--ink);margin-bottom:6px}
.vhead{display:flex;gap:14px;align-items:stretch}
.lbadge{flex:none;width:86px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px}
.lbadge .ll{font-family:var(--font-display);font-size:46px;line-height:1}
.lbadge .ln{font-size:12px;font-weight:700;letter-spacing:.08em;margin-top:2px}
.LA{background:var(--A-bg);color:var(--A)}.LB{background:var(--B-bg);color:var(--B)}.LC{background:var(--C-bg);color:var(--C)}
.vmeta{min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.vkubun{font-size:19px;font-weight:700;line-height:1.3}
.vratio{font-size:13px;color:var(--muted)}
.vratio b{font-family:var(--font-mono);color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.usu{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.chip.atsu{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chip.ref{background:var(--night);color:var(--night-ink);border-color:transparent}
.zones{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.zone{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.zrank{font-family:var(--font-display);font-size:15px;color:var(--muted);padding-top:2px}
.zflow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:18px}
.zflow .arr{color:var(--muted);font-weight:400}
.prov{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:1px 7px;border-radius:999px}
.znums{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.znums .grp{display:inline-flex;gap:4px;flex-wrap:wrap}
.znums .arr{color:var(--muted)}
.zref{font-size:12.5px;color:var(--muted);margin-top:6px}
.zref b{color:var(--ink);font-family:var(--font-mono)}
.zthird{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px}
.zthird .t3{font-weight:700}
.hidenote{font-size:12px;color:var(--muted)}
.vfoot{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.oldline{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.numbers{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:14px;font-size:13px}
.numbers .zl{font-weight:700;color:var(--muted);white-space:nowrap}
details.full{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.full summary{cursor:pointer;font-weight:700;font-size:14px}
pre.out{white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);font-size:12.5px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0 0;max-height:none;overflow-x:auto}

/* ledger */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{width:auto;min-width:9.5em}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fchip{border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
.dgroup{margin-top:16px}
.dgroup h3{font-size:14px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dgroup h3 .muted{font-weight:400;font-size:12.5px}
.lrows{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lrow+.lrow{border-top:1px solid var(--line)}
.lmain{width:100%;display:grid;grid-template-columns:2.6em 1.9em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:0;background:none;cursor:pointer;text-align:left}
.lmain:hover{background:var(--surface-2)}
.lr-r{font-family:var(--font-display);font-size:15px}
.lb{display:inline-grid;place-items:center;width:1.8em;height:1.8em;border-radius:6px;font-family:var(--font-display);font-size:14px}
.lmid{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.lmid .k{font-weight:700;font-size:14px}
.lmid .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lend{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hit{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.hit.y{background:var(--ok-bg);color:var(--ok)}.hit.n{background:var(--surface-2);color:var(--muted)}.hit.u{background:var(--warn-bg);color:var(--warn)}
.flag{font-size:11px;color:var(--warn);white-space:nowrap}
.ledit{padding:4px 12px 14px;background:var(--surface-2);border-top:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}

/* stats */
.stat-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.stat-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1.2}
.tile .l{font-size:12px;color:var(--muted);font-weight:700}
.tile .d{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td.l,table.t th.l{text-align:left}
table.t thead th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--muted)}
table.t tr.sub td{color:var(--muted);font-size:12.5px}
table.t .g{color:var(--ok);font-weight:700}
.stat-grid{display:grid;gap:var(--gap);margin-top:var(--gap)}
@media (min-width:900px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-grid .wide{grid-column:1/-1}}
.stat-grid .card+.card{margin-top:0}
.stat-grid>*,.judge-grid>*{min-width:0}
.ledit .fields{max-width:760px}
.minibar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:25;padding-inline:12px;display:flex;justify-content:center;pointer-events:none}
.minibar button{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;border:0;cursor:pointer;background:var(--night);color:var(--night-ink);border-radius:999px;padding:7px 8px 7px 7px;box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:13px;text-align:left}
.minibar .lb{flex:none}
.minibar .mz{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar .go{flex:none;font-weight:700;color:var(--lamp);padding-right:6px}
@media (min-width:900px){.minibar{display:none}}
.heat td.c{text-align:center;font-family:var(--font-mono);min-width:3em}
.heat td.c.on{outline:2px solid var(--primary);outline-offset:-3px;font-weight:700}
.prog{display:flex;flex-direction:column;gap:12px}
.pi .pl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.pi .pl b{font-family:var(--font-mono)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--primary)}
.pi .pd{font-size:12px;color:var(--muted);margin-top:3px}

.toast{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:var(--night-ink);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}.f.s3{grid-column:span 2}.f.s4{grid-column:span 4}.f.s6{grid-column:span 4}.f.s2m4{grid-column:span 4}}

/* v2: 購入記録・月ごとの収支 */
.ym{display:flex;flex-direction:column;gap:10px}
.ym-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ym-top select{width:auto;min-width:7.5em;font-weight:700}
.ym-top .ttl{font-weight:700;font-size:15px}
.months{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (min-width:700px){.months{grid-template-columns:repeat(13,minmax(0,1fr))}}
.months button{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 2px;cursor:pointer;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.months button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
.months button.has::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--lamp)}
.money-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:var(--gap)}
@media (min-width:700px){.money-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile .v.plus,.plus{color:var(--ok)}
.tile .v.minus,.minus{color:var(--bad)}
.stc{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.stc.hit{background:var(--ok-bg);color:var(--ok)}

.stc.skip{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-weight:400}

.recbox{display:flex;flex-direction:column;gap:12px}

.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.mother-note{font-size:12.5px;color:var(--muted);margin:2px 0 10px}

.lmoney{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}

/* v3: 設定・買い目編集 */
.zk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}

.zk-tabs .fchip.cus::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 2px var(--surface)}

.chip.cus{background:var(--lamp);color:#1C1300;border-color:transparent}

.zedit{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.zrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.zr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zr-no{font-family:var(--font-display);font-size:15px;color:var(--muted)}
.zr-label{font-weight:700;font-size:16px}

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = v => { if (v == null || v === '') return '—'; const n = +v; if (!isFinite(n)) return String(v); return n % 1 === 0 ? n.toFixed(1) : String(n); };
const hiTxt = h => h == null ? '—' : h.toFixed(1);
const yen = v => v == null ? '—' : Math.round(v).toLocaleString('ja-JP');
const pct = T.pct;
const todayJST = () => { const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); };
const VENUES = { '大井': 'oi', '川崎': 'kawasaki', '船橋': 'funabashi', '浦和': 'urawa', '門別': 'monbetsu', '盛岡': 'morioka', '水沢': 'mizusawa', '金沢': 'kanazawa', '笠松': 'kasamatsu', '名古屋': 'nagoya', '園田': 'sonoda', '姫路': 'himeji', '高知': 'kochi', '佐賀': 'saga', '帯広': 'obihiro', '札幌': 'sapporo', '函館': 'hakodate', '福島': 'fukushima', '新潟': 'niigata', '東京': 'tokyo', '中山': 'nakayama', '中京': 'chukyo', '京都': 'kyoto', '阪神': 'hanshin', '小倉': 'kokura' };
const venueKey = v => VENUES[v] || ('v' + [...v].map(c => c.codePointAt(0).toString(16)).join(''));
const idFor = (date, venue, r) => date.replace(/-/g, '') + '-' + venueKey(venue || '大井') + '-' + String(r).padStart(2, '0');
const storeGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const storeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, ms); }


// ===== state =====
// recs/derived = テンゲル基盤データ（マザーデータ・races）… アプリからは書き換えない
// bets          = 買ったレースの記録（bets）… 実測・回収の「月ごとの収支」だけに使う
const blankForm = () => ({ id: null, venue: '大井', date: todayJST(), r: '', dist: '', surface: 'ダ', baba: '', n: '', rows: [], tan1: '', s1: '', s1combo: '', s5: '', s5combo: '', s10: '', s10combo: '' });

  if (J.warnN) h += `<div class="banner warn">${esc(J.warnN)}。判定は出走頭数で行っているよ。番号を確認してね。</div>`;
  if (!S.n) h += Slots.on ? `<div class="banner warn">マザーデータ「${esc(J.mother)}」に、集計できるレースがまだないよ。参考的中率は出せないよ（判定そのものは正しく出ているよ）。</div>` : `<div class="banner warn">基盤データに接続できていないため、参考的中率は出せないよ（判定そのものは正しく出ているよ）。</div>`;
  if (!J.isOi) { const alt = otherHome(J.venue); if (alt) h += `<div class="banner info">開催場が${esc(J.venue)}だよ。マザーデータを「${esc(alt.name)}」（${alt.usable}走）に切り替える？<div class="row" style="margin-top:8px"><button class="btn primary slotchip-go" type="button" data-slot="${alt.n}">「${esc(alt.name)}」に切り替える</button></div></div>`; }
  h += '<ol class="zones">';
  J.set.forEach((z, i) => {
    const prov = z.prov ? '<span class="prov">暫定・同一ゾーン例外</span>' : '';
    const numsA = zoneNumsHTML(J, [z.a]);
    const numsB = zoneNumsHTML(J, z.b);
    let third = '';
    if (J.third) {
      const tz = J.third[i] || [], tprov = T.THIRD_PROV[k] && T.THIRD_PROV[k][i] ? ' <span class="prov">暫定</span>' : '';
      if (!tz.length) third = `<div class="zthird"><span class="t3">3着：見送り</span><span class="small muted">（この買い目は馬単だけ）</span></div>`;
      else {
        const tn = J.horses.length ? `<div class="znums">${tz.map(t => { const hn = J.nums[t]; return hn.length ? `<span class="grp" title="${t}">${numChips(J, hn)}</span>` : `<span class="hidenote">${t}：該当なし</span>`; }).join('<span class="arr">／</span>')}</div>` : '';
        third = `<div class="zthird"><span class="t3">3着：${tz.join('・')}</span>${tprov}<div class="zref">${ref3(J, i)}　馬単的中時の3着 <b>${K.tri3[i]}/${K.hit3n[i]}</b>${tz.includes('人気') ? '　※人気は配当低めになりやすい' : ''}</div>${tn}</div>`;
      }
    }
    h += `<li class="zone"><div class="zrank">第${i + 1}</div><div><div class="zflow"><span>${z.a}</span><span class="arr">→</span><span>${z.b.join('／')}</span>${prov}</div>
      ${numsA ? `<div class="znums">${numsA}<span class="arr">→</span>${numsB}</div>` : ''}
      <div class="zref">参考的中率 <b>${refZone(J, i)}</b></div><div class="zref">${reasonOf(k, z)}</div>${third}</div></li>`;
  });
  h += '</ol>';
  if (!J.third) h += `<div class="banner info">3連単3着：<b>見送り</b>（${T.isCustom(k) ? 'この区分の買い目に3着を決めていないため' : 'C層・非該当／' + c.c0reason}）</div>`;
  if (J.horses.length) {
    h += '<div class="numbers">' + T.ZN.map(z => { const hn = hideNote(J, z); return `<span class="zl">${z}</span><span>${hn ? `<span class="hidenote">${hn}</span>` : J.nums[z].length ? numChips(J, J.nums[z]) + (/(大穴|超大穴)/.test(z) && J.fukuUsed(z) ? ' <span class="hidenote">複勝順</span>' : '') : '<span class="hidenote">該当なし</span>'}</span>`; }).join('') + (J.outside.length ? `<span class="zl">対象外</span><span class="hidenote">${J.outside.join('・')}（13番人気以降）</span>` : '') + '</div>';
  }
  const kubunN = K.n;
  h += `<div class="vfoot"><div class="small">レース判定：${c.L}層×${bandName(k)}　${kubunN >= 5 ? `人気→人気率 ${pct(K.nn, kubunN)}・穴絡み率 ${pct(K.ana, kubunN)}（n=${kubunN}）` : `データ不足（n=${kubunN}）`}<span class="muted">　※払戻データ未取得のため、人気→人気の出現率を代理指標にしているよ</span></div>`;
  if (J.third) h += `<div class="small">3連単ゾーン的中 ${pct(K.triTot, K.n3)}（${K.triTot}/${K.n3}）・馬単的中時の3着的中率 ${pct(K.triTot, K.hitIn3)}（${K.triTot}/${K.hitIn3}）<span class="muted">　※回収率は払戻がたまってから</span></div>`;
  if (c.L === 'C' && c.c20 === '比20以上' && (k === 'C1' || k === 'C2')) h += `<div class="small">観測メモ：1着超大穴を観測中（${S.c20['比20以上'].sup1}/${S.c20['比20以上'].n}）※判定・ゾーンには使わない</div>`;
  h += `<div class="oldline">旧本線（記録用・買い目ではない）${esc(oldLineText(J))}</div>`;
  if (J.excluded) h += `<div class="small muted">基盤データにあるこのレース自身は外して参考値を計算しているよ（自己参照の除外）。</div>`;
  h += `<div class="row" style="margin-top:4px"><button class="btn primary" type="button" id="copyAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>全文コピー</button>
    <button class="btn primary" type="button" id="saveJudge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>${st.bets.has(J.id) ? '判定と結果を上書き保存' : '判定と結果を保存'}</button></div>
    ${st.form.example ? '<p class="small muted" style="margin:0">入力例は保存できないよ。本番のレースを入れてね。</p>' : '<p class="small muted" style="margin:0">' + (st.bets.has(J.id) ? '記録タブに保存済み。' : '') + '下の「結果・収支の記録」に入れた着順・購入額・回収額も一緒に保存するよ。結果がまだなら空のままでOK（結果待ちで保存）。</p>'}<div data-k="savemsg" data-id="${esc(J.id || '')}" hidden></div></div>
    <details class="full"><summary>全STEPを表示（STEP0〜T3）</summary><pre class="out" id="outText">${esc(buildText(J))}</pre></details>`;
  box.innerHTML = h;
  $('#copyAll').addEventListener('click', ev => copyText(buildText(J), ev.currentTarget, $('#outText')));
  $('#saveJudge').addEventListener('click', () => { const box = $('#recCard .recf'); if (box) saveRecf(box, $('#saveJudge')); else toast('先に判定に必要な項目を入れてね'); });
  for (const el of $$('[data-k=savemsg]', box)) paintSaveMsg(el);
}

// ===== full text (指示書の出力フォーマット) =====
function buildText(J) {
  const S = J.S, c = J.c, x = J.x, k = c.kubun, K = S.k[k], sep = '━━━━━━━━━━━━', o = [];
  const n3All = Object.values(S.k).reduce((s, q) => s + q.n3, 0);
  const refL = J.isOi ? null : `【参考判定】${J.venue}${x.r}R／参考値はすべて${J.mother}${S.n}走（3着${n3All}走）の実測`;
  const arrow = s => String(s || '').replace(/[-－ー‐ｰ\s]+/g, '→');
  const so = (v, cb) => v == null ? '読取不可' : (cb ? arrow(cb) + ' / ' : '') + fmt(v) + '倍';
  // STEP0
  o.push(sep); if (refL) o.push(refL);
  if (J.motherN !== 1) o.push(`マザーデータ：${J.mother}（集計対象${S.n}走）`);
  o.push(`開催場：${J.venue}`);
  o.push(`レース：${x.r}R　／　出走頭数：${x.n}頭　／　距離：${x.dist}m（${J.surface}）　／　馬場状態：${x.baba}`);
  if (J.surface === '芝' && J.motherN === 1) o.push('※芝レース（大井はダートのみ）');
  if (J.horses.length) { o.push('|人気|番号|記号|単勝|'); J.horses.forEach(hh => o.push(`|${hh.rank}|${hh.no}|${hh.sym}|${fmt(hh.tan)}|`)); }
  else o.push(`単勝1位：${fmt(x.tan1)}倍（全頭のオッズ一覧なし）`);
  o.push(`3連単1位：${J.s1combo ? arrow(J.s1combo) + ' / ' : ''}${fmt(x.s1)}倍`);
  o.push(`3連単5位：${so(J.s5, J.s5combo)}`); o.push(`3連単10位：${so(J.s10, J.s10combo)}`);
  if (J.warnN) o.push('※' + J.warnN);
  if (J.excluded) o.push('※基盤データ収録済みのため、このレース自身を除外して参考値を再計算（自己参照の除外）');
  o.push(sep, '');
  // STEP1
  o.push(sep, '■STEP1　超大穴帯注意', `3連単5位：${J.s5 == null ? '読取不可' : fmt(J.s5) + '倍'}　3連単10位：${J.s10 == null ? '読取不可' : fmt(J.s10) + '倍'}`, `超大穴帯注意（J〜L出走 かつ 5位≥40.0）：${J.chuui}`, `旧見送り条件（記録用）：${J.oldSkip}`, sep, '');
  // STEP2
  o.push(sep, '■STEP2　姫ゲート層判定', `単勝1位：${fmt(x.tan1)}倍　3連単1位：${fmt(x.s1)}倍　比：${c.hi.toFixed(1)}`, `馬場：${x.baba}`, `判定：【${T.LAYER_LABEL[c.L]}】`, `根拠：${condText(J)}`, `入口：${entryText(J)}`);
  if (c.L === 'C') o.push(`比区分：${c.c20}　※記録用・判定には使わない`);
  o.push(sep, '');
  // STEP2-1
  o.push(sep, '■STEP2-1　序盤Rフィルター（C層のみ）', `層：${c.L}層`, `レース番号：${x.r}R`, `判定：${c.L !== 'C' ? '—（固定）' : c.early ? '【ゲート閉（序盤R）】' : '【通過】'}`);
  if (c.early) o.push(`本来の帯：${c.honrai}　※記録用・表示のみ`);
  o.push(sep, '');
  // STEP2-2
  const g1 = c.hi >= 10 && x.n >= 9, g2 = c.hi >= 10 && x.n >= 14;
  o.push(sep, '■STEP2-2　大穴フィルター（C層のみ）', `対象：${c.L !== 'C' ? `${c.L}層は実行せず（固定）` : c.early ? '序盤Rのため実行せず' : 'C層で序盤R通過'}`);
  if (c.L === 'C' && !c.early) o.push(`比：${c.hi.toFixed(1)}　頭数：${x.n}頭`, `第1段階（比≥10.0 かつ 頭数≥9）：${g1 ? '作動' : '不作動'}`, `第2段階（比≥10.0 かつ 頭数≥14）：${g2 ? '作動' : '不作動'}`);
  o.push(`判定：${c.L !== 'C' ? '—（固定）' : '【' + bandName(k) + '】'}`, sep, '');
  // STEP3
  o.push(sep, '■STEP3　役割ゾーン候補', `区分：${({ A: 'A層（固定）', B: 'B層（固定）', C0: c.early ? 'C層・非該当（序盤R）' : 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}`);
  J.set.forEach((z, i) => o.push(`第${i + 1}：${z.label}${z.prov ? '　※暫定・同一ゾーン例外' : ''}`));
  if (T.isCustom(k)) o.push('※まさちゃんのカスタム買い目（設定タブで変更）。参考値もこの買い目で計算');
  o.push(sep, '');
  // STEP4
  o.push(sep, '■STEP4　テンゲルⅢ　馬単 最終判定');
  if (refL) o.push(`【参考判定】${J.venue}${x.r}R／参考値はすべて${J.mother}${S.n}走の実測`);
  o.push(`レース：${x.r}R（距離${x.dist}m／馬場${x.baba}／${x.n}頭）`);
  o.push(`超大穴帯注意：【${J.chuui}】　旧見送り条件（記録用）：【${J.oldSkip}】`);
  o.push(`層：${c.L}層（比${c.hi.toFixed(1)}）` + (c.L === 'C' ? `　比区分：${c.c20}　※記録用` : ''));
  o.push(`入口：${c.L === 'A' ? 'A層固定' : c.L === 'B' ? 'B層固定' : `C層（序盤R：${c.early ? 'ゲート閉' : '通過'}${c.early ? '' : ' → 大穴フィルター：' + bandName(k)}）`}`);
  if (c.early) o.push(`本来の帯：${c.honrai}　※記録用`);
  o.push('', '①役割ゾーンごとの番号');
  const line = (z, lab) => { const hn = hideNote(J, z); if (hn) return `　${lab}＝${hn}`; if (!J.horses.length) return `　${lab}＝（オッズ一覧なし）`; const ns = J.nums[z]; return `　${lab}＝${ns.length ? ns.join('・') : '該当なし'}${(z === '大穴' || z === '超大穴') && ns.length ? (J.fukuUsed(z) ? '　※複勝オッズ昇順' + (J.horses.some(hh => hh.zone === z && hh.fukuRange) ? '（幅表示は下限で比較）' : '') : '　※単勝オッズ昇順（複勝なし）') : ''}`; };
  o.push(line('人気', '人気(A.B.C)'), line('中穴', '中穴(D.E.F)'), line('大穴', '大穴(G.H.I)'), line('超大穴', '超大穴(J.K.L)'));
  o.push(`　対象外：単勝13番人気以降${J.outside.length ? '（' + J.outside.join('・') + '）' : ''}`);
  o.push('', '②推奨買い目ゾーン');
  J.set.forEach((z, i) => { o.push(`　第${i + 1}　${z.label}${z.prov ? '　※暫定・同一ゾーン例外' : ''}`, `　　理由：${reasonOf(k, z)}`, `　　参考的中率：${refZone(J, i)}`); });
  o.push('　※参考的中率＝その区分でそのゾーンが実際に出た割合（掛け算はしていない）');
  const ht = T.hantei(K);
  o.push('', '③レース判定', `　区分：${c.L}層 × ${bandName(k)}`, K.n >= 5 ? `　人気→人気率：${pct(K.nn, K.n)}（n=${K.n}）　穴絡み率：${pct(K.ana, K.n)}（n=${K.n}）` : `　人気→人気率・穴絡み率：データ不足（n=${K.n}）`, `　判定：${ht.mark}${K.n < 5 ? '※データ不足' : ''}`, '　※払戻データ未取得のため、人気→人気の出現率を代理指標としています');
  o.push('', '④旧本線（記録用・買い目ではない）', `　${oldLineText(J)}`);
  if (c.L === 'C' && c.c20 === '比20以上' && (k === 'C1' || k === 'C2')) o.push('', `観測メモ：1着超大穴を観測中（${S.c20['比20以上'].sup1}/${S.c20['比20以上'].n}）※判定・ゾーンには使わない`);
  o.push(sep, '');
  // T1
  o.push(sep, '■STEP T1　3着区分の確認', `区分：【${({ A: 'A層', B: 'B層', C0: 'C層・非該当（序盤R）', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}】`, `判定：${J.third ? '【3着2本へ】' : '【3着：見送り】'}`, sep, '');
  // T3
  if (!J.third) {
    o.push(sep, `■STEP T3　3連単3着：見送り（${({ A: 'A層', B: 'B層', C0: 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}）`, `理由：${T.isCustom(k) ? 'この区分の買い目に3着を決めていないため（設定タブ）' : c.early ? 'C層の序盤R（1〜3R）のため' : 'C層で大穴フィルターが不作動のため'}`, sep);
  } else {
    const cus = T.isCustom(k);
    o.push(sep, '■STEP T3　テンゲルⅢ　3連単3着 最終判定');
    if (refL) o.push(`【参考判定】${J.venue}${x.r}R／参考値はすべて${J.mother}${n3All}走の実測`);
    o.push(`レース：${x.r}R（距離${x.dist}m／馬場${x.baba}／${x.n}頭）`, `区分：【${({ A: 'A層', B: 'B層', C0: 'C層・非該当', C1: 'C層・第1段階', C2: 'C層・第2段階' })[k]}】（比${c.hi.toFixed(1)}／${x.n}頭）`, '', '①3着ゾーンの番号');
    const tl = { 人気: '人気(A.B.C)', 中穴: '中穴(D.E.F)', 大穴: '大穴(G.H.I)', 超大穴: '超大穴(J.K.L)' };
    t3show(k).forEach(z => { const ns = J.horses.length ? (J.nums[z].join('・') || '該当なし') : '（オッズ一覧なし）'; o.push(`　${tl[z]}＝${ns}${z === '人気' ? '　※1・2着に使った人気馬は除いて読む' : ''}${(z === '大穴' || z === '超大穴') && J.horses.length ? (J.fukuUsed(z) ? '　※複勝オッズ昇順' : '　※単勝オッズ昇順') : ''}`); });
    o.push('', cus ? '②馬単ゾーンごとの3着' : '②馬単ゾーンごとの3着2本');
    J.set.forEach((z, i) => {
      const tz = J.third[i] || [];
      if (!tz.length) { o.push(`　馬単 第${i + 1}（${z.label}）の3着：見送り（馬単だけ）`); return; }
      const p = T.THIRD_PROV[k] && T.THIRD_PROV[k][i];
      o.push(`　馬単 第${i + 1}（${z.label}）の3着：${tz.join('・')}${p ? '　※暫定' : ''}`, `　　参考的中率：${ref3(J, i)}${tz.includes('人気') ? '※人気は配当低めになりやすい' : ''}`, `　　馬単的中時の3着：${K.tri3[i]}/${K.hit3n[i]}`);
    });
    o.push('', '③3連単の形（ゾーンのみ・組番は作らない）');
    J.set.forEach((z, i) => { const tz = J.third[i] || []; o.push(`　第${i + 1}：${z.label}→${tz.length ? '（' + tz.join('・') + '）' : '（3着見送り）'}`); });
    o.push(`　3連単ゾーン的中：${pct(K.triTot, K.n3)}（${T.KUBUN_LABEL[k].replace('（固定）', '')}／${K.triTot}/${K.n3}）　馬単的中時の3着的中率：${pct(K.triTot, K.hitIn3)}（${K.triTot}/${K.hitIn3}）`);
    o.push('', `④3着判定：3着【${cus ? t3show(k).join('・') : ({ A: '人気・中穴', B: '人気・大穴', C1: '大穴帯', C2: '超大穴帯' })[k]}】`, '　※払戻データ未取得のため、回収率は未計算です', sep);
  }
  return o.join('\n');
}

async function copyText(text, btn, pre) {
  try { await navigator.clipboard.writeText(text); toast('コピーしたよ'); }
  catch {
    if (pre) { const d = pre.closest('details'); if (d) d.open = true; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('コピーできなかったので文章を選択したよ。長押しでコピーしてね', 3600);
  }
}

function errText(e) {
  const c = (e && e.code) || 'unknown';
  const m = { invalid_argument: '書き込みが許可されていないか、データの形が合わなかったよ', quota_exceeded: '保存できる上限に達したよ。古い記録を消してね', unavailable: '通信が不安定みたい。少し待ってもう一度押してね', revoked: 'データへのアクセスが切れたよ。アプリを開き直してね', not_granted: 'この画面ではデータの保存が許可されていないよ。claude.aiのアプリ画面で開いてね', capability_disabled: 'この画面ではデータを保存できないよ。claude.aiのアプリ画面で開いてね', not_saved: '保存したはずの記録が読み戻せなかったよ' }[c] || '保存できなかったよ';
  return `${m}（${c}${e && e.message ? '：' + String(e.message).slice(0, 80) : ''}）`;

  const b = st.bets.get(box.dataset.id); return b ? { snap: b.snap, horses: b.horses || [] } : null;
}
function updateRecPreview(box) {
  const ctx = recCtx(box); if (!ctx) return;
  const v = readRecf(box);
  const p = parseResStr(v.res, v.mode, ctx.horses);
  const tmp = { snap: ctx.snap, types: v.types, other: v.other, stake: v.stake, payout: v.payout, p1: p.ranks?.[0], p2: p.ranks?.[1], p3: p.ranks?.[2], buyZ: v.buyZ };
  const s = betStatus(tmp);
  let detail = '';
  const zl = i => ctx.snap.zones[i - 1].label;
  if (s.s === '的中' || s.s === '不的中') {
    const pair = `${s.z1}→${s.z2}${s.z3 ? '→' + s.z3 : ''}　`;
    if (s.zi) detail = pair + `買ったゾーン第${s.zi}（${zl(s.zi)}）に入った${s.triHit ? '・3連単ゾーンも的中' : ctx.snap.third ? '・3連単ゾーンは外れ' : ''}`;
    else if (s.ziAny) detail = pair + `第${s.ziAny}（${zl(s.ziAny)}）に入ったけど、買っていないゾーンだよ`;
    else detail = pair + '推奨ゾーンの外';
  } else if (s.s === '結果待ち') detail = s.needZone ? '買ったゾーンを押して選んでね（選んだゾーンだけで当たり外れを判定するよ）' : s.need3 ? '3連単も買ったなら3着を入れてね' : '着順を入れると自動で判定するよ';
  else if (s.s === '未購入') detail = '収支には入れないよ' + (s.zi ? `（テンゲル的には第${s.zi}ゾーン的中だった）` : '');
  else detail = '取消・中止などの返還。回収額が空なら購入額を入れて計算するよ';
  const stake = s.s === '未購入' ? 0 : (toNum(v.stake) || 0), pay = s.s === '未購入' ? 0 : (s.s === '払い戻し' ? (toNum(v.payout) ?? toNum(v.stake) ?? 0) : (toNum(v.payout) || 0));
  const bal = pay - stake;
  $('[data-k=status]', box).innerHTML = `<span class="stc ${s.cls}" style="font-size:14px">${s.s}</span><span class="sub">${esc(detail)}</span>${s.s !== '未購入' && (stake || pay) ? `<span class="balance ${bal > 0 ? 'plus' : bal < 0 ? 'minus' : ''}" style="margin-left:auto">${yen(stake)}→${yen(pay)}（${signYen(bal)}円）</span>` : ''}`;
  const hint = $('[data-k=hint]', box);
  const read = p.split ? `「${(p.nos || p.ranks).join('-')}」と読んだよ。` : '';
  hint.textContent = p.err ? p.err : !v.res ? '着順は「.」で区切ってね（6.2.11 → 6-2-11）' : read + (p.ranks && v.mode === 'no' ? '→ ' + p.ranks.map((x, j) => `${j + 1}着 ${x}番人気`).join('・') : '');
  if (s.s === '的中' && !toNum(v.payout)) hint.textContent += (hint.textContent ? '　' : '') + '的中だよ！回収額を入れてね💰';
  if (s.s === '不的中' && toNum(v.payout) > 0) hint.textContent += (hint.textContent ? '　' : '') + '※買ったゾーンの外だけど回収額が入っているよ（ほかの買い目で当たったならそのままでOK）';
}
// 入力のたびにプレビュー更新・券種/入れ方/その他の切り替え
function wireRecf(container) {
  container.addEventListener('click', e => {
    const box = e.target.closest('.recf'); if (!box) return;
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const grp = b.parentElement?.dataset.k;
    if (grp === 'types' || grp === 'buyz') { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); }
    else if (grp === 'other') { $$('button', b.parentElement).forEach(x => x.setAttribute('aria-pressed', String(x === b))); const pi = $('[data-k=payout]', box); pi.placeholder = b.dataset.v === '払い戻し' ? '購入額と同じ' : '外れは0'; }
    else if (grp === 'mode') {
      const ctx = recCtx(box); const before = readRecf(box); if (before.mode === b.dataset.v) return;
      const p = ctx ? parseResStr(before.res, before.mode, ctx.horses) : {};
      $$('button', b.parentElement).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const ri = $('[data-k=res]', box);
      if (p.ranks) { ri.value = b.dataset.v === 'nin' ? p.ranks.join('-') : p.ranks.map(rk => rankOrder(ctx.horses)[rk - 1]).join('-'); }
      $('[data-k=reslab]', box).textContent = `レース結果 1着-2着-3着（${b.dataset.v === 'no' ? '馬番' : '人気'}）`;
      ri.placeholder = b.dataset.v === 'no' ? '例 6.2.11' : '例 1.4.2';
    } else return;
    if (box.dataset.scope === 'judge') { st.draft = { ...readRecf(box), id: st.draft?.id, dirty: true }; }
    updateRecPreview(box);
  });
  container.addEventListener('input', e => {
    const box = e.target.closest('.recf'); if (!box) return;
    if (box.dataset.scope === 'judge') { st.draft = { ...readRecf(box), id: st.draft?.id, dirty: true }; }
    updateRecPreview(box);
  });
}
async function saveRecf(box, extBtn) {
  const sid = box.dataset.scope === 'judge' ? (currentJudge().id || '') : box.dataset.id;
  const fail = t => { setSaveMsg(sid, false, t); toast('❌ ' + t, 4200); };
  if (!st.db) return fail(st.dbState === 'connecting' ? 'まだデータに接続中だよ。数秒待ってもう一度押してね' : 'この画面ではデータに接続できないよ。claude.aiでアプリを開いてね');
  const scope = box.dataset.scope, v = readRecf(box);
  let id, base = null, horses;
  if (scope === 'judge') {
    const J = currentJudge(); if (!J.ok) return fail('先に判定に必要な項目を入れてね');
    if (st.form.example) return fail('いまは入力例（架空のレース）だから保存しないよ。「入力をクリア」して本番のレースを入れてね');
    id = J.id; if (!id) return fail('日付とレース番号を入れてね');
    horses = J.horses.map(h => ({ no: h.no, tan: h.tan }));
    const f = st.form;
    base = { date: f.date, venue: J.venue, r: +f.r, dist: +f.dist, surface: f.surface, baba: f.baba, n: +f.n, tan1: J.x.tan1, s1: J.x.s1, s5: J.s5, s10: J.s10,
      s1combo: f.s1combo || '', s5combo: f.s5combo || '', s10combo: f.s10combo || '', horses: J.horses.map(h => ({ no: h.no, tan: h.tan, fuku: h.fukuRaw || null })), snap: snapOf(J), judgeText: buildText(J) };
  } else { id = box.dataset.id; const b = st.bets.get(id); if (!b) return; horses = b.horses || []; }
  const p = parseResStr(v.res, v.mode, horses); if (p.err) return fail(p.err);
  const stake = toNum(v.stake);
  const noStake = v.other !== '未購入' && stake == null;
  const payout = v.other === '払い戻し' && v.payout === '' ? stake : toNum(v.payout);
  const fields = { types: v.types.length ? v.types : ['馬単'], stake: v.other === '未購入' ? (stake ?? null) : stake, payout, other: v.other,
    p1: p.ranks ? p.ranks[0] : null, p2: p.ranks ? p.ranks[1] : null, p3: p.ranks && p.ranks[2] != null ? p.ranks[2] : null,
    n1: p.nos ? p.nos[0] : null, n2: p.nos ? p.nos[1] : null, n3: p.nos && p.nos[2] != null ? p.nos[2] : null, note: v.note, updatedAt: new Date().toISOString() };
  if (v.buyZ) fields.buyZ = v.buyZ;
  const btns = [$('[data-act=save]', box), extBtn].filter(Boolean); btns.forEach(x => x.disabled = true);
  try {
    const isNew = !st.bets.has(id);
    await writeBet(id, isNew ? { ...base, ...fields, createdAt: fields.updatedAt } : (base ? { ...base, ...fields } : fields), isNew);
    if (scope === 'judge' && st.draft) st.draft.dirty = false;
    const s = betStatus({ ...(base || st.bets.get(id)), ...fields });
    const msg = `保存できたよ（${s.s}）。記録タブの${+id.slice(4, 6)}月に入っているよ${s.needZone ? '。買ったゾーンを選んでね' : ''}${noStake ? '。購入額はあとで入れてね' : ''}`;
    setSaveMsg(id, true, msg); toast('✅ ' + msg, 3000);
  } catch (e) { setSaveMsg(id, false, errText(e)); writeErr(e); }
  finally { btns.forEach(x => x.disabled = false); }
}
function raceBase(J) {

  }

  const paid = all.filter(r => r.pay != null);

    for (const [gl, gf] of groups) for (const [pl, pf] of pers) {
      const x = paid.filter(r => gf(r) && pf(r)); const i13 = x.reduce((s, r) => s + r.inv13, 0), r13 = x.reduce((s, r) => s + r.ret13, 0), i12 = x.reduce((s, r) => s + r.inv12, 0), r12 = x.reduce((s, r) => s + r.ret12, 0);
      h += `<tr${pl === '全期間' ? '' : ' class="sub"'}><td>${pl === '全期間' ? gl : ''}</td><td>${pl}</td><td>${x.length}</td><td>${yen(i13)}</td><td>${yen(r13)}</td><td class="${r13 > i13 && i13 ? 'g' : ''}">${pct(r13, i13)}</td><td>${yen(i12)}</td><td>${yen(r12)}</td><td class="${r12 > i12 && i12 ? 'g' : ''}">${pct(r12, i12)}</td></tr>`;

}
function reviewCard(all) {

  const B13 = d13.filter(r => r.L === 'B'), Bhit = B13.filter(r => r.hit);

const cfgEq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const copyRows = rows => rows.map(r => ({ a: r.a, b: [...r.b], t: [...r.t] }));
function zdraft() { if (!st.zdraft) st.zdraft = T.getZones(); return st.zdraft; }

const rowLabel = r => r.a + '→' + (r.b.length ? r.b.join('／') : '？');
// 下書きの買い目を基盤データ（大井）に当てはめて数える（保存する前に比べられるように）
function previewRows(k, rows) {
  const rs = st.derived.filter(r => r.inStats && r.kubun === k);

    out[i].hit++; hit++;
    if (r.has3 && rows[i].t.length) { out[i].hit3n++; if (rows[i].t.includes(r.z3)) { out[i].tri++; tri++; } }

  return { n: rs.length, n3, hit, tri, rows: out };
}
const zpick = (f, lab, sel) => `<div class="zr-line"><span class="zr-lab">${lab}</span><div class="zpick" data-f="${f}" role="group" aria-label="${lab}">${T.ZN.map(z => `<button type="button" data-z="${z}" aria-pressed="${sel.includes(z)}">${z}</button>`).join('')}</div></div>`;
function renderSet() {

  const d = zdraft(), k = st.zk, rows = d[k], meta = ZK.find(x => x[0] === k);
  const pv = previewRows(k, rows), pd = previewRows(k, T.DEFAULT_CFG[k]);
  const noData = st.dbState !== 'on';
  let h = `<h2>買い目編集</h2>
  <p class="hint" style="margin:0 0 10px">区分ごとに、馬単の<b>1着→2着</b>と3連単の<b>3着</b>を決められるよ。保存すると、判定と実測（①〜⑦）がこの買い目で計算されるよ。保存済みの購入記録は、保存したときの買い目のままだよ。</p>
  <div class="zk-tabs">${ZK.map(([key, short]) => `<button type="button" class="fchip${T.isCustom(key) || zdirty(key) ? ' cus' : ''}" data-zk="${key}" aria-pressed="${key === k}">${short}</button>`).join('')}</div>
  <div class="zk-head"><b>${meta[2]}</b>${T.isDefaultRows(k, rows) ? '<span class="chip">第13改訂版の初期</span>' : '<span class="chip cus">カスタム</span>'}${zdirty(k) ? '<span class="chip dirty">未保存</span>' : ''}</div>
  <p class="small muted" style="margin:4px 0 0">${meta[3]}。${noData ? '' : `基盤データ（大井）では${pv.n}走。`}</p>
  <ol class="zedit">`;
  rows.forEach((r, i) => {
    const s = pv.rows[i], ov = [];
    rows.slice(0, i).forEach((p, j) => { if (p.a === r.a && p.b.some(b => r.b.includes(b))) ov.push(j + 1); });
    h += `<li class="zrow" data-i="${i}">
      <div class="zr-top"><span class="zr-no">第${i + 1}</span><span class="zr-label">${esc(rowLabel(r))}</span>
        <span class="zr-act"><button type="button" data-act="up" aria-label="第${i + 1}を上へ"${i === 0 ? ' disabled' : ''}>↑</button><button type="button" data-act="down" aria-label="第${i + 1}を下へ"${i === rows.length - 1 ? ' disabled' : ''}>↓</button><button type="button" data-act="del" aria-label="第${i + 1}を消す">×</button></span></div>
      ${zpick('a', '1着', [r.a])}${zpick('b', '2着', r.b)}${zpick('t', '3着', r.t)}
      <div class="zr-stat">${!r.b.length ? '' : noData ? '基盤データを読み込むと、ここに的中数が出るよ' : `馬単 <b>${s.hit}/${pv.n}</b>（${pct(s.hit, pv.n)}）　${r.t.length ? `3連単 <b>${s.tri}/${s.hit3n}</b>（馬単的中時の3着）` : '3着は見送り（馬単だけ）'}`}</div>
      ${!r.b.length ? '<div class="zr-warn">2着を1つ以上えらんでね</div>' : ''}${ov.length ? `<div class="zr-warn">第${ov.join('・第')}と重なってるよ（上の買い目が先に当たりになるよ）</div>` : ''}
    </li>`;
  });
  h += `</ol>
  <div class="row" style="margin-top:10px"><button class="btn" type="button" data-zact="add"${rows.length >= T.MAXZ ? ' disabled' : ''}>＋買い目を足す</button><button class="btn ghost" type="button" data-zact="def">この区分を初期に戻す</button></div>
  ${noData ? '' : `<div class="zsum">この区分の合計（基盤データ ${pv.n}走）：馬単 <b>${pv.hit}/${pv.n}</b>（${pct(pv.hit, pv.n)}）・3連単ゾーン <b>${pv.tri}/${pv.n3}</b>（${pct(pv.tri, pv.n3)}）<br><span class="muted">第13改訂版の初期なら：馬単 ${pd.hit}/${pd.n}（${pct(pd.hit, pd.n)}）・3連単 ${pd.tri}/${pd.n3}</span><br><span class="muted small">※的中数だけで決めないでね。人気寄りの買い目ほど当たりは増えて、配当は下がりやすいよ</span></div>`}
  <div class="zsave${zdirty() ? ' sticky' : ''}"><button class="btn primary" type="button" data-zact="save">保存する</button><button class="btn" type="button" data-zact="undo">変更を取り消す</button><span class="msg" id="zmsg">${zdirty() ? '未保存の変更があるよ' : '保存済みだよ'}</span></div>

  box.innerHTML = h;
}
function setZmsg(t, bad) { const m = $('#zmsg'); if (m) { m.textContent = t; m.style.color = bad ? 'var(--bad)' : ''; } }
async function saveZones() {
  const d = zdraft();
  for (const [key, , name] of ZK) { const bad = d[key].findIndex(r => !r.b.length); if (bad >= 0) { st.zk = key; renderSet(); setZmsg(`❌ ${name}の第${bad + 1}に2着がないよ。えらんでから保存してね`, true); return; } }
  if (!zdirty()) { setZmsg('変更はないよ（保存済み）'); return; }
  const allDef = T.KEYS.every(key => T.isDefaultRows(key, d[key]));
  const cfg = allDef ? null : JSON.parse(JSON.stringify(d));
  try {
    await ZoneStore.save(cfg);
    T.setZones(cfg); st.zdraft = null; paintVer();
    st.derived = [...st.recs.values()].map(r => T.derive(r));
    renderResult(); renderSet();
    setZmsg('✅ 保存したよ。判定と実測（①〜⑦）に反映したよ');
    toast(allDef ? '買い目を第13改訂版の初期に戻したよ' : '買い目を保存したよ');
  } catch (err) { setZmsg('❌ 保存できなかったよ：' + (err && err.message || err), true); }
}
$('#zoneCard').addEventListener('click', e => {
  const d = zdraft(), k = st.zk, rows = d[k];
  const zk = e.target.closest('[data-zk]'); if (zk) { st.zk = zk.dataset.zk; renderSet(); return; }
  const zb = e.target.closest('.zpick button');
  if (zb) {
    const i = +zb.closest('.zrow').dataset.i, f = zb.closest('.zpick').dataset.f, z = zb.dataset.z, r = rows[i];
    if (f === 'a') r.a = z;
    else { const s = new Set(r[f]); if (s.has(z)) s.delete(z); else s.add(z); r[f] = T.ZN.filter(x => s.has(x)); }
    renderSet(); return;
  }
  const act = e.target.closest('[data-act]');
  if (act && act.closest('.zrow')) {
    const i = +act.closest('.zrow').dataset.i;
    if (act.dataset.act === 'up' && i > 0) [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]];
    else if (act.dataset.act === 'down' && i < rows.length - 1) [rows[i + 1], rows[i]] = [rows[i], rows[i + 1]];
    else if (act.dataset.act === 'del') { if (rows.length <= 1) { toast('買い目は1本は残してね'); return; } rows.splice(i, 1); }
    renderSet(); return;
  }
  const za = e.target.closest('[data-zact]'); if (!za) return;
  const a = za.dataset.zact;
  if (a === 'add') {
    if (rows.length >= T.MAXZ) { toast(`買い目は${T.MAXZ}本までだよ`); return; }
    rows.push({ a: '人気', b: [], t: [] }); renderSet();
    const last = $$('#zoneCard .zrow').pop(); if (last) last.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  } else if (a === 'def') { d[k] = copyRows(T.DEFAULT_CFG[k]); renderSet(); toast('この区分を初期の買い目にしたよ（保存はまだ）'); }
  else if (a === 'undo') { st.zdraft = null; renderSet(); toast('保存してある買い目に戻したよ'); }
  else if (a === 'save') saveZones();
  else if (a === 'allDef') { st.zdraft = {}; for (const key of T.KEYS) st.zdraft[key] = copyRows(T.DEFAULT_CFG[key]); saveZones(); }
});

// ===== データ接続 =====
function setPill() {
  const p = $('#dbpill');

  if (st.dbState === 'on') { p.textContent = `${Slots.on ? motherName() : '基盤'} ${mN}走・記録 ${st.bets.size}件${st.canWrite ? '' : '（閲覧のみ）'}`; p.classList.add('on'); }

  else { p.textContent = 'データに接続中…'; p.classList.remove('on'); }
}
function inputBusy(sel) { const a = document.activeElement; return !!(a && a.closest && a.closest(sel) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
let rT; function recompute() {
  clearTimeout(rT); rT = setTimeout(() => {
    st.derived = [...st.recs.values()].map(r => T.derive(r));
    setPill(); renderResult();
    if (st.tab === 'rec' && !inputBusy('#recList')) renderRec();
    if (st.tab === 'stats') renderStats();
    if (st.tab === 'set') renderSet();
  }, 60);
}
let bT; function recomputeBets() {
  clearTimeout(bT); bT = setTimeout(() => {
    setPill(); renderResult();

// 1つの購読は最大1000件なので、四半期ごとに分けて購読する（2026年7月〜来四半期）
function quarters() {
  const pad = n => String(n).padStart(2, '0'), now = todayJST(), out = [];
  let ey = +now.slice(0, 4), em = Math.floor((+now.slice(5, 7) - 1) / 3) * 3 + 1 + 6; while (em > 12) { em -= 12; ey++; }
  let y = 2026, m = 7;
  while ((y < ey || (y === ey && m < em)) && out.length < 48) { let ny = y, nm = m + 3; if (nm > 12) { nm -= 12; ny++; } out.push([`${y}-${pad(m)}-01`, `${ny}-${pad(nm)}-01`]); y = ny; m = nm; }
  return out;
}
function subscribeAll(db, name, map, onChange, onReady, onDead) {
  const col = db.collection(name), qs = quarters(), seen = new Map(), firstSeen = new Set();
  const subs = [...qs.map(([s, e]) => [s, col.where('date', '>=', s).where('date', '<', e).limit(1000)]),
    ['old', col.where('date', '<', qs[0][0]).limit(1000)], ['future', col.where('date', '>=', qs[qs.length - 1][1]).limit(1000)]];
  let ready = false;
  const handle = key => snap => {
    const ids = new Set(snap.docs.map(d => d.id));
    for (const id of (seen.get(key) || [])) if (!ids.has(id)) map.delete(id);
    seen.set(key, ids);
    for (const d of snap.docs) { const v = d.data(); if (v) map.set(d.id, { id: d.id, ...v }); }
    firstSeen.add(key);
    if (!ready && firstSeen.size >= subs.length) { ready = true; onReady(); }
    if (ready) onChange();
  };
  const onErr = e => { if (e && (e.code === 'revoked' || e.code === 'not_granted')) onDead(); };
  for (const [key, q] of subs) q.onSnapshot(handle(key), onErr);
  setTimeout(() => { if (!ready) { ready = true; onReady(); onChange(); } }, 10000);
}
async function setupDB() {
  const db = await window.claude?.use?.('db').catch?.(() => null) ?? null;
  if (!db) { st.dbState = 'off'; st.betState = 'off'; setPill(); renderResult(); if (st.tab !== 'judge') setTab(st.tab); return; }
  st.db = db;
  const user = await window.claude?.use?.('user').catch?.(() => null) ?? null;
  if (user) { try { const ce = await user.canEdit(); if (ce === false) st.editHint = true; } catch {} }
  // テンゲル基盤データ（読むだけ）
  subscribeAll(db, 'races', st.recs, recompute, () => { st.dbState = 'on'; }, () => { st.dbState = 'off'; setPill(); });
  // 買ったレースの記録
  subscribeAll(db, 'bets', st.bets, recomputeBets, () => { st.betState = 'on'; }, () => { st.betState = 'off'; setPill(); });
}
async function setupDownloads() { st.downloads = await window.claude?.use?.('downloads').catch?.(() => null) ?? null; }

// ===== boot =====

if (window.TengelLocal && window.TengelLocal.ready) window.TengelLocal.ready.then(refreshSlots).catch(() => {});

  if (JSON.stringify(T.getZones()) !== before) { st.zdraft = null; recompute(); }
}).catch(() => {});
const t0 = storeGet('tengel.tab'); if (t0) setTab(t0 === 'ledger' ? 'rec' : t0);
if (window.claude && typeof window.claude.use === 'function') { setupDB(); setupOCR(); setupDownloads(); }
else { st.dbState = 'off'; st.betState = 'off'; setPill(); $('#ocrRow').hidden = true; if (st.tab !== 'judge') setTab(st.tab); }
})();
